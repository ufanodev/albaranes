<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eliminar Albarán (Confirmación)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="/js/security.js"></script>
    <script src="/js/albaran_cargar.js" defer></script> 
    <script src="/js/albaran_borrar.js" defer></script> 
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f9;
            color: #1f2937;
            line-height: 1.6;
        }

        /* Estilos Inputs (Solo Lectura Visual) */
        .input-field {
            @apply w-full px-4 py-2 border border-gray-300 rounded-lg transition duration-150 ease-in-out text-base shadow-sm;
        }
        
        /* Clase específica para campos bloqueados */
        .readonly-field {
            @apply bg-gray-100 cursor-not-allowed border-gray-300 text-gray-600 focus:ring-0 focus:outline-none;
        }

        .section-title {
            @apply text-xl font-bold text-red-700 mb-4 border-b-2 border-red-200 pb-2 mt-8;
        }

        /* Estilo Base del Botón */
        .action-button {
             @apply inline-flex items-center justify-center font-semibold py-2.5 px-6 rounded-lg 
                    shadow-md cursor-pointer transition duration-300 transform text-white focus:outline-none 
                    hover:scale-[1.02] focus:ring-4 text-sm;
        }
        
        /* Estilo Botón Eliminar (Rojo) */
        .btn-delete-main {
            @apply bg-red-600 hover:bg-red-700 focus:ring-red-400/50 shadow-lg;
        }
        
        /* Estilo Botón Volver (Gris) */
        .btn-volver {
            @apply bg-gray-500 hover:bg-gray-600 focus:ring-gray-300 shadow-gray-400/50;
        }
    </style>
</head>
<body class="p-4 sm:p-8 lg:p-12">

    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-xl p-6 md:p-10">
        
        <div class="flex justify-between items-center mb-8 border-b pb-3">
            <h1 class="text-3xl font-extrabold text-red-800">
                Eliminar Albarán 🗑️
            </h1>
            
            <span id="loadingIndicator" class="text-sm text-blue-600 font-semibold animate-pulse mr-8">Cargando datos...</span>
            
            <div class="flex space-x-3">
                <button type="button" 
                        id="btn-confirm-delete" 
                        onclick="handleDeleteAction('confirmar')" 
                        class="action-button btn-delete-main"
                        title="Eliminar permanentemente este albarán">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    CONFIRMAR ELIMINACIÓN
                </button>
                
                <a href="#" onclick="goBack(); return false;" class="action-button btn-volver">
                    <span class="mr-2">🔙</span> Volver al Listado
                </a>
            </div>
        </div>
        
        <div id="deleteWarning" class="p-4 bg-red-100 text-red-800 border border-red-300 rounded-lg font-bold mb-6 text-center">
            ADVERTENCIA: Está a punto de ELIMINAR este albarán. Revise los datos antes de continuar.
        </div>


        <form id="viewForm">
            
            <div class="section-title !mt-0">Datos Principales</div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">LICENCIA</label>
                    <input type="text" id="licencia_ref" readonly class="input-field readonly-field">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Nº Albarán</label>
                    <input type="text" id="numero_albaran" readonly class="input-field readonly-field font-bold">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Fecha</label>
                    <input type="date" id="fecha" readonly class="input-field readonly-field">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Empresa</label>
                    <input type="text" id="empresa_nombre" readonly class="input-field readonly-field">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Referencia</label>
                    <input type="text" id="referencia" readonly class="input-field readonly-field">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Conductor (Asalariado)</label>
                    <input type="text" id="asalariado" readonly class="input-field readonly-field">
                </div>
            </div>

            <div class="section-title">Detalles del Servicio</div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Hora</label>
                    <input type="time" id="hora" readonly class="input-field readonly-field">
                </div>

                <div class="md:col-span-2 lg:col-span-1">
                    <label class="block text-sm font-medium text-gray-600 mb-1">DNI Pasajero</label>
                    <input type="text" id="dni_pasajero" readonly class="input-field readonly-field">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Matrícula</label>
                    <input type="text" id="matricula" readonly class="input-field readonly-field">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Nº Plazas</label>
                    <input type="text" id="num_plazas" readonly class="input-field readonly-field">
                </div>
            </div>
            
            <div class="flex flex-wrap gap-x-8 gap-y-4 mt-6">
                <div class="flex items-center space-x-4 p-3 bg-gray-50 rounded-lg border border-gray-200">
                    <span class="font-medium text-gray-700">Tarifa:</span>
                    <label class="flex items-center space-x-2 opacity-70"><input type="checkbox" id="urbano" disabled class="h-4 w-4 rounded"><span class="text-sm">Urbano</span></label>
                    <label class="flex items-center space-x-2 opacity-70"><input type="checkbox" id="diurno" disabled class="h-4 w-4 rounded"><span class="text-sm">Diurno</span></label>
                    <label class="flex items-center space-x-2 opacity-70"><input type="checkbox" id="noct_fest" disabled class="h-4 w-4 rounded"><span class="text-sm">Noct/Fest</span></label>
                </div>
                <div class="flex items-center space-x-4 p-3 bg-gray-50 rounded-lg border border-gray-200">
                    <span class="font-medium text-gray-700">Otros:</span>
                    <label class="flex items-center space-x-2 opacity-70"><input type="checkbox" id="festivo" disabled class="h-4 w-4 rounded"><span class="text-sm">Festivo</span></label>
                    <label class="flex items-center space-x-2 opacity-70"><input type="checkbox" id="finalizado" disabled class="h-4 w-4 rounded"><span class="text-sm">Finalizado</span></label>
                    <label class="flex items-center space-x-2 opacity-70"><input type="checkbox" id="enganche" disabled class="h-4 w-4 rounded"><span class="text-sm">Enganche</span></label>
                </div>
            </div>

            <div class="section-title">Trayecto</div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-600 mb-1">Cliente</label>
                    <input type="text" id="cliente" readonly class="input-field readonly-field" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Origen</label>
                    <textarea id="origen" rows="2" readonly class="input-field readonly-field resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Destino</label>
                    <textarea id="destino" rows="2" readonly class="input-field readonly-field resize-none"></textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-600 mb-1">Parada Intermedia</label>
                    <textarea id="parada" rows="1" readonly class="input-field readonly-field resize-none"></textarea>
                </div>
            </div>

            <div class="section-title">Importes</div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Km Totales</label>
                    <input type="text" id="km_totales" readonly class="input-field readonly-field text-right" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Tiempo Espera</label>
                    <input type="time" id="tiempo_espera" readonly class="input-field readonly-field" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Importe TOTAL</label>
                    <input type="text" id="importe_total" readonly class="input-field readonly-field text-right font-bold text-lg text-gray-800" />
                </div>
            </div>
            
            <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Importe Suplidos</label>
                    <input type="text" id="importe_suplidos" readonly class="input-field readonly-field text-right" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Autorizado Por</label>
                    <input type="text" id="autorizado_por" readonly class="input-field readonly-field" />
                </div>
            </div>

            <div class="mt-8">
                <label class="block text-sm font-medium text-gray-600 mb-1">Observaciones</label>
                <textarea id="observaciones" rows="3" readonly class="input-field readonly-field w-full"></textarea>
            </div>
            
            <div class="section-title">Estado Facturación</div>
            <div class="flex gap-6 p-4 bg-gray-50 rounded-lg">
                <label class="flex items-center space-x-2 opacity-70"><input type="checkbox" id="cobrado" disabled class="h-4 w-4"><span class="text-sm">Cobrado</span></label>
                <label class="flex items-center space-x-2 opacity-70"><input type="checkbox" id="pagado" disabled class="h-4 w-4"><span class="text-sm">Pagado</span></label>
                
                <div class="ml-auto text-sm text-gray-500 flex gap-4">
                    <span>Factura: <span id="num_factura" class="font-semibold text-gray-700">-</span></span>
                    <span>Fecha Cobro: <span id="fecha_cobro" class="font-semibold text-gray-700">-</span></span>
                </div>
            </div>
            
            <div id="errorMessage" class="hidden mt-4 p-4 bg-red-100 text-red-700 text-center rounded-lg"></div>

        </form>
    </div>
</body>
</html>
