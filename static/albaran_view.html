<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Vista Albarán - Panel Titular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/security.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'primary-pastel': '#FFDAB9', 'primary-link': '#FF8C00' } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        /* Fondos sombreados para los campos de vista */
        .view-field { @apply w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl shadow-inner text-gray-700 font-bold; }
        .section-title { @apply text-lg font-bold text-gray-800 mb-4 border-b-2 border-primary-pastel pb-2 flex items-center mt-8; }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="max-w-6xl mx-auto bg-white shadow-2xl rounded-[2rem] overflow-hidden">
        <div class="bg-primary-pastel p-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-gray-900 flex items-center">
                    <i data-lucide="clipboard-list" class="mr-3 text-primary-link"></i> ALBARÁN: <span id="view_numero_albaran_header" class="text-primary-link">...</span>
                </h1>
                <span id="loadingIndicator" class="text-xs font-bold animate-pulse text-primary-link uppercase">Sincronizando con base de datos...</span>
            </div>
            <button onclick="window.history.back()" class="bg-gray-600 text-white px-6 py-2 rounded-xl font-bold active:scale-95 transition shadow-lg">Volver</button>
        </div>

        <div class="p-6 md:p-10">
            <div class="section-title !mt-0 text-primary-link"><i data-lucide="info" class="w-5 h-5 mr-2"></i> PARTE 1: IDENTIFICACIÓN Y TRAYECTO</div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div><label class="text-[10px] font-black uppercase text-gray-400">Nº Albarán</label><div id="numero_albaran" class="view-field"></div></div>
                <div><label class="text-[10px] font-black uppercase text-gray-400">Fecha</label><div id="fecha" class="view-field"></div></div>
                <div><label class="text-[10px] font-black uppercase text-gray-400">Hora Recogida</label><div id="hora" class="view-field"></div></div>
                <div><label class="text-[10px] font-black uppercase text-gray-400">Licencia</label><div id="licencia_ref" class="view-field"></div></div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div><label class="text-[10px] font-black uppercase text-gray-400">Empresa</label><div id="empresa_nombre" class="view-field"></div></div>
                <div><label class="text-[10px] font-black uppercase text-gray-400">Referencia</label><div id="referencia" class="view-field"></div></div>
                <div><label class="text-[10px] font-black uppercase text-gray-400">Conductor</label><div id="asalariado" class="view-field"></div></div>
            </div>

            <div class="mb-6"><label class="text-[10px] font-black uppercase text-gray-400">Cliente</label><div id="cliente" class="view-field"></div></div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <div><label class="text-[10px] font-black uppercase text-gray-400">Origen</label><div id="origen" class="view-field min-h-[44px]"></div></div>
                <div><label class="text-[10px] font-black uppercase text-gray-400">Destino</label><div id="destino" class="view-field min-h-[44px]"></div></div>
                <div><label class="text-[10px] font-black uppercase text-gray-400">Parada</label><div id="parada" class="view-field min-h-[44px]"></div></div>
            </div>

            <div class="section-title text-primary-link"><i data-lucide="map" class="w-5 h-5 mr-2"></i> PARTE 2: TARIFAS Y DATOS TÉCNICOS</div>
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-6 items-end">
                <div class="lg:col-span-6 flex space-x-3 bg-slate-100 p-2.5 rounded-xl shadow-inner border border-slate-200">
                    <label class="flex items-center space-x-1"><input type="checkbox" id="urbano" disabled><span class="text-[10px] font-bold uppercase">Urbano</span></label>
                    <label class="flex items-center space-x-1"><input type="checkbox" id="diurno" disabled><span class="text-[10px] font-bold uppercase">Diurno</span></label>
                    <label class="flex items-center space-x-1"><input type="checkbox" id="noct_fest" disabled><span class="text-[10px] font-bold uppercase">Noct/Fest</span></label>
                    <label class="flex items-center space-x-1"><input type="checkbox" id="festivo" disabled><span class="text-[10px] font-bold uppercase">Festivo</span></label>
                </div>
                <div class="lg:col-span-3"><label class="text-[10px] font-black uppercase text-gray-400">DNI Pasajero</label><div id="dni_pasajero" class="view-field"></div></div>
                <div class="lg:col-span-3"><label class="text-[10px] font-black uppercase text-gray-400">Matrícula</label><div id="matricula" class="view-field uppercase"></div></div>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-8 bg-slate-100 p-4 rounded-2xl border border-slate-200 shadow-inner">
                <div><label class="text-[10px] uppercase font-black text-slate-500">Km Totales</label><div id="km_totales" class="view-field text-right font-black text-primary-link"></div></div>
                <div><label class="text-[10px] uppercase font-black text-slate-500">Km Nac.</label><div id="km_nacionales" class="view-field text-right"></div></div>
                <div><label class="text-[10px] uppercase font-black text-slate-500">Km Int.</label><div id="km_internacionales" class="view-field text-right"></div></div>
            </div>

            <div class="section-title text-primary-link"><i data-lucide="euro" class="w-5 h-5 mr-2"></i> PARTE 3: IMPORTES Y EXTRAS</div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div><label class="text-[10px] uppercase text-gray-400">Espera</label><div id="tiempo_espera" class="view-field text-center"></div></div>
                <div><label class="text-[10px] uppercase text-gray-400">Plazas</label><div id="num_plazas" class="view-field text-center"></div></div>
                <div class="flex items-center pt-4"><label class="flex items-center space-x-2"><input type="checkbox" id="enganche" disabled> <span class="text-xs uppercase font-bold">Enganche</span></label></div>
                <div><label class="text-[10px] uppercase text-gray-400">Suplidos</label><div id="importe_suplidos" class="view-field text-right text-orange-600"></div></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div><label class="text-[10px] uppercase text-gray-400">Autorizado Por</label><div id="autorizado_por" class="view-field"></div></div>
                <div class="bg-slate-900 p-4 rounded-2xl text-white flex justify-between items-center shadow-xl border-4 border-primary-pastel">
                    <span class="font-black uppercase text-xs text-primary-pastel">Importe Total</span>
                    <span id="importe_total" class="text-3xl font-black text-primary-link">0.00 €</span>
                </div>
            </div>

            <div class="w-full mb-8">
                <label class="text-[10px] uppercase text-gray-400 font-black">Observaciones del Conductor</label>
                <div id="observaciones" class="view-field italic min-h-[80px]"></div>
            </div>
            
            <div id="errorMessage" class="hidden mt-6 p-6 bg-red-600 text-white rounded-2xl text-center font-black"></div>
        </div>
    </div>
    <script src="/js/albaran_cargar.js"></script>
    <script src="/js/albaran_view.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
