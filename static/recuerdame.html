<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña - Albaranes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pastel': '#FFDAB9',
                        'primary-link': '#FF8C00',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-sm w-full bg-white p-8 rounded-xl shadow-xl border border-primary-pastel">
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">🔑</div>
            <h1 class="text-3xl font-bold text-black mb-2">¿Olvidaste tu Contraseña?</h1>
            <p class="text-gray-500 text-sm">Introduce tu email para recibir un código de seguridad.</p>
        </div>
        
        <form id="recuperarForm">
            <div class="mb-5">
                <label for="email" class="block text-sm font-medium text-black mb-1">Correo Electrónico</label>
                <input type="email" id="email" name="email" required
                       placeholder="ejemplo@email.com"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-pastel focus:border-primary-pastel" />
            </div>
            
            <button type="submit" id="btnEnviar"
                    class="w-full py-3 bg-primary-pastel text-black font-semibold rounded-lg hover:bg-orange-300 transition duration-200 shadow-md mb-4">
                Enviar Código
            </button>

            <div class="text-center mb-6">
                <a href="/resetpwd" 
                   class="block w-full py-2 border-2 border-primary-pastel text-black text-sm font-bold rounded-lg hover:bg-orange-50 transition duration-150">
                    📩 Ya tengo un código
                </a>
            </div>

            <hr class="mb-6 border-primary-pastel opacity-50">

            <div class="text-center">
                <a href="/login" class="text-sm font-medium text-primary-link hover:text-orange-500 transition duration-150">
                    ⬅️ Volver al Acceso
                </a>
            </div>
            
            <div id="statusMessage" class="hidden text-center mt-6 p-3 rounded-md border border-opacity-50 font-medium text-sm" role="alert"></div>
        </form>
    </div>

    <script src="/js/recuerdame.js"></script>
</body>
</html>
