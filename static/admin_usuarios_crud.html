<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">👤 Gestión de Usuarios</title> 
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="/js/security.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/admin_usuarios_crud.js" defer></script> 
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f9; 
            color: #1f2937; 
            line-height: 1.6;
        }

        .input-field {
            @apply w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-800
                   transition duration-150 ease-in-out text-base shadow-sm bg-white;
        }

        .input-field:focus {
            @apply outline-none border-violet-500 ring-2 ring-violet-300;
        }

        .section-title {
            @apply text-xl font-bold text-violet-700 mb-4 border-b-2 border-violet-200 pb-2 mt-8;
        }
        
        .action-button {
            @apply inline-flex items-center justify-center font-semibold py-2.5 px-6 rounded-lg 
                     shadow-md cursor-pointer transition duration-300 transform text-white focus:outline-none 
                     hover:scale-[1.02] focus:ring-4 text-sm;
        }
        
        .btn-crear { @apply bg-violet-600 hover:bg-violet-700 focus:ring-violet-300 shadow-violet-400/50; }
        .btn-modificar { @apply bg-indigo-600 hover:bg-indigo-700 focus:ring-indigo-300 shadow-indigo-400/50; }
        .btn-borrar { @apply bg-red-600 hover:bg-red-700 focus:ring-red-300 shadow-red-400/50; }
        .btn-volver { @apply bg-gray-500 hover:bg-gray-600 focus:ring-gray-300 shadow-gray-400/50; }

        .status-message { @apply mt-6 p-4 text-center font-medium rounded-lg border-2; }
    </style>
</head>
<body class="p-4 sm:p-8 lg:p-12">

    <div class="max-w-3xl mx-auto bg-white shadow-2xl rounded-xl p-6 md:p-10">
        <h1 id="mainTitle" class="text-3xl font-extrabold text-violet-800 text-center mb-8 border-b pb-3">
            Administración de Usuarios 🔐
        </h1>

        <form id="usuarioForm" onsubmit="handleFormSubmit(event)">

            <input type="hidden" id="id" name="id"> 

            <div class="section-title !mt-0">Datos de Acceso</div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="usuario" class="block text-xs font-black text-gray-500 mb-1 uppercase tracking-tighter">Usuario *</label>
                    <input type="text" id="usuario" name="usuario" required
                           placeholder="Ej: admin_central"
                           class="input-field">
                </div>
                
                <div id="email_container">
                    <div id="wrapper_email_titular">
                        <label class="block text-xs font-black text-violet-700 mb-1 uppercase tracking-tighter">Seleccionar Email Titular *</label>
                        <select id="email_select" onchange="syncEmail(this)" class="input-field border-violet-300 bg-violet-50 font-bold">
                            <option value="">Cargando titulares...</option>
                        </select>
                    </div>

                    <div id="wrapper_email_admin" class="hidden">
                        <label class="block text-xs font-black text-indigo-700 mb-1 uppercase tracking-tighter">Email Nuevo Administrador *</label>
                        <input type="email" id="admin_email_nuevo" oninput="syncEmail(this)" 
                               placeholder="ejemplo@admin.com" 
                               class="input-field border-indigo-300 bg-indigo-50 font-bold">
                    </div>
                    
                    <input type="hidden" id="email" name="email" required>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                <div>
                    <label for="password" class="block text-xs font-black text-gray-500 mb-1 uppercase tracking-tighter">Password *</label>
                    <input type="password" id="password" name="password" 
                           placeholder="Mínimo 6 caracteres"
                           class="input-field">
                    <p id="password-help" class="text-[10px] text-gray-400 mt-1 italic uppercase">Dejar en blanco para mantener la actual en edición.</p>
                </div>

                <div>
                    <label for="role" class="block text-xs font-black text-gray-500 mb-1 uppercase tracking-tighter">Rol del Sistema</label>
                    <select id="role" name="role" class="input-field font-bold" onchange="handleRoleChange(this.value)">
                        <option value="user">Usuario Estándar (Titular)</option>
                        <option value="admin">Administrador Global</option>
                    </select>
                </div>
            </div>
            
            <div class="section-title">Asignación de Licencia y Estado</div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label for="activo" class="block text-xs font-black text-gray-500 mb-1 uppercase tracking-tighter">Estado Cuenta</label>
                    <select id="activo" name="activo" class="input-field font-bold">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo / Bloqueado</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label for="licencia_ref" class="block text-xs font-black text-violet-700 mb-1 uppercase tracking-tighter">Vincular a Licencia *</label>
                    <select id="licencia_ref" name="licencia_ref" required class="input-field border-violet-300 bg-violet-50 font-bold">
                        <option value="0">--- Cargando licencias ---</option>
                    </select>
                    <p class="text-[10px] text-gray-400 mt-1 uppercase">Solo requerido para usuarios tipo titular.</p>
                </div>
            </div>

            <div id="statusMessage" class="hidden status-message" role="alert"></div>
            
            <div class="mt-10 pt-6 border-t border-gray-200 flex flex-wrap justify-center gap-4">
                <button type="submit" id="btn-crear" class="action-button btn-crear">
                    <i data-lucide="user-plus" class="h-5 w-5 mr-2"></i> Crear Usuario
                </button>

                <button type="button" id="btn-modificar" onclick="handleAction('modificar')" class="action-button btn-modificar hidden">
                    <i data-lucide="save" class="h-5 w-5 mr-2"></i> Guardar Cambios
                </button>

                <button type="button" id="btn-borrar" onclick="handleAction('borrar')" class="action-button btn-borrar hidden">
                    <i data-lucide="trash-2" class="h-5 w-5 mr-2"></i> Confirmar Baja
                </button>
                
                <button type="button" onclick="handleAction('volver')" class="action-button btn-volver">
                    <i data-lucide="arrow-left" class="h-5 w-5 mr-2"></i> Volver al Listado
                </button>
            </div>
        </form>
    </div>

    <script>
        // Inicialización de iconos Lucide
        document.addEventListener('DOMContentLoaded', function() {
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
