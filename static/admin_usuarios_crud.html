<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Usuarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/security.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/usuarios_cargar.js"></script> 
    
    <script src="/js/admin_usuarios_crud.js" defer></script>
    
    <style>
        /* 🎨 Configuración de Tailwind CSS y Estilos Base */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f9; 
            color: #1f2937; 
            line-height: 1.6;
        }

        .input-field {
            @apply w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-800
                    transition duration-150 ease-in-out text-base shadow-sm;
        }

        .input-field:focus {
            @apply outline-none border-violet-500 ring-2 ring-violet-300;
        }

        .input-field:disabled, .input-field[readonly] {
            @apply bg-gray-100 text-gray-500 cursor-default;
        }

        .section-title {
            @apply text-xl font-bold text-violet-700 mb-4 border-b-2 border-violet-200 pb-2 mt-8;
        }
        
        .action-button {
            @apply inline-flex items-center justify-center font-semibold py-2.5 px-6 rounded-lg 
                    shadow-md cursor-pointer transition duration-300 transform text-white focus:outline-none 
                    hover:scale-[1.02] focus:ring-4 text-sm;
        }
        
        .btn-crear { @apply bg-violet-600 hover:bg-violet-700 focus:ring-violet-300 shadow-violet-400/50; }
        .btn-modificar { @apply bg-indigo-600 hover:bg-indigo-700 focus:ring-indigo-300 shadow-indigo-400/50; }
        .btn-borrar { @apply bg-red-600 hover:bg-red-700 focus:ring-red-300 shadow-red-400/50; }
        .btn-volver { @apply bg-gray-500 hover:bg-gray-600 focus:ring-gray-300 shadow-gray-400/50; }

        .status-message { @apply mt-6 p-4 text-center font-medium rounded-lg; }
        .status-success { @apply bg-green-100 text-green-800 border border-green-300; }
        .status-error { @apply bg-red-100 text-red-800 border border-red-300; }
        .status-info { @apply bg-blue-100 text-blue-800 border border-blue-300; }
    </style>
</head>
<body class="p-4 sm:p-8 lg:p-12">

    <div class="max-w-3xl mx-auto bg-white shadow-2xl rounded-xl p-6 md:p-10">
        <h1 id="mainTitle" class="text-3xl font-extrabold text-violet-800 text-center mb-8 border-b pb-3">
            Administración de Usuarios 🔐
        </h1>

        <form id="usuarioForm">

            <div class="section-title !mt-0">Datos de Usuario</div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>
                    <label for="id" class="block text-sm font-medium text-gray-600 mb-1">ID</label>
                    <input type="text" id="id" name="id"
                            placeholder="ID"
                            class="input-field bg-gray-100 text-gray-500" readonly>
                    <p class="text-xs text-gray-400 mt-1">El ID se asigna automáticamente al crear.</p>
                </div>

                <div>
                    <label for="usuario" class="block text-sm font-medium text-gray-600 mb-1">USUARIO *</label>
                    <input type="text" id="usuario" name="usuario" required
                            placeholder="Nombre de usuario o alias"
                            class="input-field">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-600 mb-1">EMAIL *</label>
                    <input type="email" id="email" name="email" required
                            placeholder="usuario@ejemplo.com"
                            class="input-field">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-600 mb-1">
                        PASSWORD *
                    </label>
                    <input type="password" id="password" name="password" 
                            placeholder="Dejar vacío para no modificar"
                            class="input-field">
                    <p id="password-help" class="text-xs text-gray-400 mt-1">Requerido solo al crear.</p>
                </div>
            </div>
            
            <div class="section-title">Roles y Estado</div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label for="role" class="block text-sm font-medium text-gray-600 mb-1">ROL</label>
                    <select id="role" name="role" class="input-field">
                        <option value="user">Usuario Estándar</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <div>
                    <label for="activo" class="block text-sm font-medium text-gray-600 mb-1">ESTADO</label>
                    <select id="activo" name="activo" class="input-field">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                </div>

                <div>
                    <label for="licencia_ref" class="block text-sm font-medium text-gray-600 mb-1">
                        Licencia Ref.
                    </label>
                    <input type="number" id="licencia_ref" name="licencia_ref"
                            placeholder="ID de Licencia asociado"
                            class="input-field">
                    <p class="text-xs text-gray-400 mt-1">Opcional. ID de la licencia si es un titular.</p>
                </div>
            </div>

            <div class="mt-10 pt-6 border-t border-gray-200 flex flex-wrap justify-center gap-4">
                
                <button type="submit" id="btn-crear"
                        class="action-button btn-crear">
                    <span class="mr-2">💾</span> Guardar Usuario (Crear)
                </button>

                <button type="button" id="btn-modificar" onclick="handleAction('modificar')"
                        class="action-button btn-modificar" disabled style="display:none;">
                    <span class="mr-2">✏️</span> Guardar Cambios
                </button>

                <button type="button" id="btn-borrar" onclick="handleAction('borrar')"
                        class="action-button btn-borrar" disabled style="display:none;">
                    <span class="mr-2">🗑️</span> Borrar Usuario
                </button>
                
                <button type="button" onclick="handleAction('volver')"
                        class="action-button btn-volver">
                    <span class="mr-2">🔙</span> Volver
                </button>
            </div>
            
            <div id="statusMessage" class="hidden status-message" role="alert"></div>

        </form>
    </div>

    <script src="/js/admin_usuarios_crud.js" defer></script>
</body>
</html>
