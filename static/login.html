<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso al Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DEPENDENCIAS MÍNIMAS: 
    - Se ha eliminado /js/security.js. La página de login no debe ejecutar lógica de protección.
    -->
    
    <!-- LÓGICA DE LOGIN -->
    <script src="/js/login.js" defer></script>
    <script>
        // Configuración para usar colores personalizados que simulen el naranja pastel
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pastel': '#FFDAB9', // Naranja Pastel
                        'primary-link': '#FF8C00',   // Naranja más vivo para enlaces
                        'status-success-bg': '#D1FAE5',
                        'status-error-bg': '#FEE2E2',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-sm w-full bg-white p-8 rounded-xl shadow-xl border border-primary-pastel">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-black mb-2">
                🚕 Iniciar Sesión
            </h1>
            <p class="text-gray-500 text-sm">Albaranes Radiotaxi</p>
        </div>
        
        <!-- AÑADIDO method="POST" para evitar el envío de credenciales por URL si el JS falla -->
        <form id="loginForm" method="POST"> 
            <div class="mb-5">
                <label for="username" class="block text-sm font-medium text-black mb-1">Usuario / Email</label>
                <input type="text" id="username" name="username" required
                        placeholder="Introduce tu usuario o email"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-pastel focus:border-primary-pastel" />
            </div>
            
            <!-- CAMPO CONTRASEÑA MODIFICADO CON ICONO DE OJO -->
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-black mb-1">Contraseña</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required
                            placeholder="**********"
                            class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-pastel focus:border-primary-pastel" />
                    <!-- Icono de ojo para mostrar/ocultar contraseña -->
                    <button type="button" id="togglePassword" 
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none">
                        <svg id="eyeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <!-- Icono de ojo cerrado (por defecto) -->
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox"
                            class="h-4 w-4 text-primary-pastel border-gray-300 rounded focus:ring-primary-pastel" />
                    <label for="remember-me" class="ml-2 block text-sm text-black">
                        Recuérdame
                    </label>
                </div>
                <a href="/recuerdame" class="text-sm font-medium text-primary-link hover:text-orange-500 transition duration-150">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>
            
            <button type="submit" 
                    class="w-full py-3 bg-primary-pastel text-black font-semibold rounded-lg hover:bg-orange-300 transition duration-200 shadow-md"
                    id="submitButton">
                Acceder
            </button>
            
            <div id="statusMessage" class="hidden text-center mt-4 p-3 rounded-md border border-opacity-50 font-medium" role="alert"></div>
        </form>
    </div>

    <script>
        // ====================================================================
        // FUNCIONALIDAD DE MOSTRAR/OCULTAR CONTRASEÑA
        // ====================================================================
        
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            // Cambiar tipo de input entre password y text
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Cambiar icono según el estado
            if (type === 'text') {
                // Mostrar icono de ojo abierto (contraseña visible)
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                `;
            } else {
                // Mostrar icono de ojo cerrado (contraseña oculta)
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                `;
            }
        });

        // Permitir activar el toggle con Enter cuando el campo de contraseña tiene el foco
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                // Prevenir el envío del formulario si solo se quiere mostrar/ocultar
                e.preventDefault();
                document.getElementById('togglePassword').click();
            }
        });
    </script>
</body>
</html>
