<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configuración para usar colores personalizados (Naranja Pastel)
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pastel': '#FFDAB9', // Naranja Pastel
                        'primary-link': '#FF8C00',   // Naranja más vivo para enlaces/botones primarios
                        'black-pure': '#000000',
                    }
                }
            }
        }
    </script>
    
    <script src="/js/security.js"></script> 
    <script src="/js/utils.js"></script> 
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <header class="bg-black-pure text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="text-xl font-bold flex items-center">
                ⚙️ Panel de Administración
            </div>
            <nav>
                <a href="#" id="logoutButton" class="px-4 py-2 rounded-md text-sm font-medium bg-primary-link text-white hover:bg-orange-600 transition duration-150">
                    ➡️ Salir
                </a>
            </nav>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 md:p-8">
        <div class="w-full max-w-4xl bg-white shadow-2xl rounded-xl p-6 md:p-10 border border-primary-pastel">
            
            <h1 class="text-3xl font-extrabold text-center text-black-pure mb-10 border-b-2 border-primary-pastel/50 pb-4">
                Bienvenido, Administrador
            </h1>

            <div class="grid grid-cols-2 lg:grid-cols-3 gap-6">
                
                <a href="/admin/titulares" 
                    class="admin-button bg-primary-pastel text-black-pure hover:bg-orange-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6.32v12.36c.64.21 1.34.32 2.05.32 2.76 0 5-2.24 5-5s-2.24-5-5-5c-.71 0-1.41.11-2.05.32zM2 12c0-2.76 2.24-5 5-5s5 2.24 5 5-2.24 5-5 5-5-2.24-5-5z"/><circle cx="7" cy="12" r="5"/><circle cx="17" cy="12" r="5"/></svg>
                    Gestión de Titulares
                </a>
                
                <a href="/admin/pago_tit"
                    class="admin-button bg-primary-link text-white hover:bg-orange-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    Gestión de Albaranes
                </a>
                
                <a href="/admin/conductor"
                    class="admin-button bg-gray-700 text-white hover:bg-gray-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
                    Conductores
                </a>

                <a href="/admin/usuarios"
                    class="admin-button bg-violet-700 text-white hover:bg-violet-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M10 9h4M10 13h4M10 17h4"/></svg>
                    Usuarios
                </a>
                
                <a href="/admin/empresas"
                    class="admin-button bg-yellow-700 text-white hover:bg-yellow-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v13M16 11h-4M8 11h-.01"/><rect x="4" y="17" width="16" height="3" rx="1"/></svg>
                    Gestión de Empresas
                </a>

                <a href="/admin/backup"
                    class="admin-button bg-emerald-700 text-white hover:bg-emerald-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Backup
                </a>
                
            </div>
            
        </div>
    </main>

    <script>
        // Lógica de Logout
        document.getElementById('logoutButton').addEventListener('click', function(e) {
            e.preventDefault();
            // Llama a la función global exportada por security.js
            if (typeof clearTokenAndRedirect === 'function') {
                clearTokenAndRedirect();
            } else {
                // Fallback si security.js no se cargó correctamente
                localStorage.removeItem('jwtToken');
                window.location.href = '/login';
            }
        });
    </script>
    
    <style>
        .admin-button {
            /* Estilos base para todos los botones del menú admin */
            @apply flex flex-col items-center justify-center p-6 sm:p-8 rounded-xl shadow-lg transition duration-300 ease-in-out transform hover:scale-[1.03] hover:shadow-xl font-semibold text-base sm:text-lg w-full h-32 text-center;
        }
    </style>
</body>
</html>
