<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚕 Búsqueda de Albaranes de Servicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/security.js"></script>    
    <script src="/js/busqueda.js" defer></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pastel': '#FFDAB9', 
                        'primary-link': '#FF8C00',  
                        'black-pure': '#000000',
                        'secondary-blue': '#3B82F6', 
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .card { @apply bg-white p-6 rounded-xl shadow-lg border border-primary-pastel/50; }
        .input-field { @apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-link focus:border-primary-link transition duration-150; }
        .status-message { @apply mt-4 p-3 rounded-md font-medium text-center; }
        .status-success { @apply bg-green-100 text-green-700 border border-green-400; }
        .status-error { @apply bg-red-400 text-white border border-red-600; }
        .status-info, .status-neutral { @apply bg-gray-200 text-gray-700 border border-gray-400; }
        .sortable { cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between; }
        .search-highlight { @apply bg-yellow-100 border border-yellow-300; }
    </style>
</head>
<body class="bg-gray-50 p-4 sm:p-8 lg:p-12 font-inter">

    <div id="actionModal" class="fixed inset-0 z-50 bg-black bg-opacity-50 hidden flex items-center justify-center p-4" onclick="handleActionModal(false)">
        <div class="bg-white rounded-xl p-6 shadow-2xl max-w-sm w-full transform transition-all duration-300 scale-90" onclick="event.stopPropagation()">
            <h3 id="modalTitle" class="text-xl font-bold mb-3 text-black-pure">Acción Realizada</h3>
            <p id="modalBody" class="text-gray-700 mb-4"></p>
            <button onclick="handleActionModal(false)" class="w-full bg-primary-link text-white font-semibold py-2 rounded-lg hover:bg-orange-600 transition active:scale-95">Aceptar</button>
        </div>
    </div>
    
    <div class="max-w-7xl mx-auto">
        <div class="card mb-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b border-gray-200 pb-4">
                <h1 class="text-3xl font-bold text-black-pure mb-4 sm:mb-0 flex items-center">
                    <span class="text-4xl mr-3">🚕</span>
                    <span class="text-2xl uppercase">
                        ALBARANES LICENCIA <span id="num_licencia_header" class="text-primary-link">...</span>
                    </span>
                </h1>

                <div class="flex flex-wrap gap-3">
                    <a href="/titulares/nuevo_albaran" class="group relative inline-flex items-center justify-center px-6 py-3 font-semibold text-white transition-all duration-300 ease-in-out bg-gradient-to-r from-green-500 to-green-600 rounded-lg shadow-lg hover:shadow-xl active:scale-95">
                        <span class="mr-2 text-xl">➕</span> NUEVO ALBARAN
                    </a>
                    <a href="/titulares/enviados" class="group relative inline-flex items-center justify-center px-4 py-2.5 font-semibold text-white bg-primary-link rounded-lg shadow-md hover:bg-orange-600 active:scale-95">
                        <span class="mr-2">📧</span> ENVIADOS
                    </a>
                    <a href="/titulares/pendientes" class="group relative inline-flex items-center justify-center px-4 py-2.5 font-semibold text-black-pure bg-primary-pastel border-2 border-primary-pastel rounded-lg shadow-md hover:bg-orange-300 active:scale-95">
                        <span class="mr-2">🏁</span> PENDIENTES
                    </a>
                </div>
                
                <div class="flex space-x-3 mt-4 sm:mt-0">
                    <button title="Imprimir PDF" class="bg-gray-200 text-gray-700 hover:bg-gray-300 p-2 rounded-full shadow-md active:scale-95" onclick="handleGeneratePDF()">
                        <i data-lucide="printer" class="h-6 w-6"></i>
                    </button>
                    <button title="Exportar a Excel" class="bg-emerald-500 text-white hover:bg-emerald-600 p-2 rounded-full shadow-md active:scale-95" onclick="handleGenerateXLSX()">
                        <i data-lucide="file-spreadsheet" class="h-6 w-6"></i>
                    </button>
                    <button onclick="handleLogout()" title="Salir" class="bg-red-500 text-white hover:bg-red-600 p-2 rounded-full shadow-md active:scale-95">
                        <i data-lucide="log-out" class="h-6 w-6"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="card mb-8">
            <h2 class="text-xl font-bold text-black-pure mb-4 flex items-center">
                <span class="mr-2">🔍</span> Filtros de Búsqueda Avanzada
                <span class="ml-auto text-sm font-normal text-gray-500"><span id="activeFiltersCount">0</span> filtro(s) activo(s)</span>
            </h2>
            
            <form id="searchForm" onsubmit="handleSearch(event)">
                <div class="flex flex-wrap gap-3 mb-4 items-center">
                    <button type="button" id="btn-mode-campos" onclick="UI.setSearchModeManual('campos')" class="px-4 py-2 rounded-lg transition shadow-md bg-secondary-blue text-white">📝 Campos</button>
                    <button type="button" id="btn-mode-palabra" onclick="UI.setSearchModeManual('palabra')" class="px-4 py-2 rounded-lg transition shadow-md bg-primary-pastel text-black-pure">💬 Palabra</button>
                    <button type="button" onclick="handleClearAllFilters()" class="px-4 py-2 rounded-lg bg-blue-500 text-white hover:bg-blue-600">Limpiar</button>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-3 mb-6">
                    <div>
                        <label class="filter-label text-[10px] text-gray-500 font-bold uppercase">Mi Licencia</label>
                        <input type="text" id="licencia_display" class="input-field bg-gray-50 cursor-not-allowed" readonly>
                        <input type="hidden" id="licencia_ref" name="licencia_ref">
                    </div>
                    <div>
                        <label class="filter-label text-[10px] text-gray-500 font-bold uppercase">Empresa</label>
                        <select id="empresa" name="empresa_ref" class="input-field"></select>
                    </div>
                    <div>
                        <label class="filter-label text-[10px] text-gray-500 font-bold uppercase">Estado</label>
                        <select id="state" name="state" class="input-field">
                            <option value="">Todos</option>
                            <option value="creado">🆕 Creado</option>
                            <option value="enviado">📧 Enviado</option>
                            <option value="pagado">💰 Pagado</option>
                        </select>
                    </div>
                    <div>
                        <label class="filter-label text-[10px] text-gray-500 font-bold uppercase">Referencia</label>
                        <input type="text" id="referencia" name="referencia" class="input-field">
                    </div>
                    <div>
                        <label class="filter-label text-[10px] text-gray-500 font-bold uppercase">Desde</label>
                        <input type="date" id="fecha_desde" name="fecha_desde" class="input-field">
                    </div>
                    <div>
                        <label class="filter-label text-[10px] text-gray-500 font-bold uppercase">Hasta</label>
                        <input type="date" id="fecha_hasta" name="fecha_hasta" class="input-field">
                    </div>
                </div>

                <div class="bg-blue-50 p-4 rounded-lg">
                    <label class="filter-label text-[10px] text-gray-500 font-bold uppercase mb-2">Buscar por palabras</label>
                    <div class="flex gap-2">
                        <input type="text" id="palabra" name="palabra" placeholder="Ej: RACE Madrid..." class="input-field flex-1">
                        <button type="submit" class="bg-primary-link text-white px-8 py-2 rounded-lg font-bold">BUSCAR</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-black-pure flex items-center">
                    <span class="mr-2">📊</span> Resultados <span id="resultsCount" class="ml-3 text-sm font-normal bg-primary-link text-white px-3 py-1 rounded-full">0</span>
                </h2>
                <div class="flex items-center gap-4">
                    <select id="recordsPerPage" class="input-field w-auto"><option value="10">10</option><option value="25" selected>25</option><option value="50">50</option></select>
                    <div class="flex items-center space-x-2">
                        <button id="prevPageBtn" class="bg-gray-200 p-2 rounded-lg"><i data-lucide="chevron-left" class="h-4 w-4"></i></button>
                        <span id="pageInfo" class="text-sm font-bold">Pág 1 de 1</span>
                        <button id="nextPageBtn" class="bg-gray-200 p-2 rounded-lg"><i data-lucide="chevron-right" class="h-4 w-4"></i></button>
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto rounded-xl border border-gray-100">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-primary-link text-white">
                        <tr>
                            <th class="px-4 py-3 text-left text-[10px] font-bold uppercase cursor-pointer group" onclick="sortTable('numero_albaran')">
                                <div class="sortable">Nº Albarán <i id="sort-numero_albaran" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50"></i></div>
                            </th>
                            <th class="px-4 py-3 text-left text-[10px] font-bold uppercase cursor-pointer group" onclick="sortTable('fecha')">
                                <div class="sortable">Fecha <i id="sort-fecha" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50"></i></div>
                            </th>
                            <th class="px-4 py-3 text-left text-[10px] font-bold uppercase cursor-pointer group" onclick="sortTable('empresa')">
                                <div class="sortable">Empresa <i id="sort-empresa" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50"></i></div>
                            </th>
                            <th class="px-4 py-3 text-left text-[10px] font-bold uppercase cursor-pointer group" onclick="sortTable('referencia')">
                                <div class="sortable">Ref. <i id="sort-referencia" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50"></i></div>
                            </th>
                            <th class="px-4 py-3 text-left text-[10px] font-bold uppercase">Conductor</th>
                            <th class="px-4 py-3 text-right text-[10px] font-bold uppercase cursor-pointer group" onclick="sortTable('importe_total')">
                                <div class="sortable justify-end text-right">Importe <i id="sort-importe_total" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50 ml-1"></i></div>
                            </th>
                            <th class="px-4 py-3 text-center text-[10px] font-bold uppercase cursor-pointer group" onclick="sortTable('estado')">
                                <div class="sortable justify-center">Estado <i id="sort-estado" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50 ml-1"></i></div>
                            </th>
                            <th class="px-4 py-3 text-center text-[10px] font-bold uppercase">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="albaranResults" class="bg-white divide-y divide-gray-200 text-xs italic text-gray-500">
                        <tr><td colspan="8" class="text-center py-10">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="statusMessage" class="hidden status-message" role="alert"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });
        function handleActionModal(show, title = '', body = '') {
            const modal = document.getElementById('actionModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').textContent = body;
            modal.classList.toggle('hidden', !show);
        }
        function handleAction(title, desc) { handleActionModal(true, title, desc); }
    </script>
</body>
</html>
