<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚕 Búsqueda de Albaranes de Servicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/security.js"></script>    
    <script src="/js/busqueda.js" defer></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pastel': '#FFDAB9', 
                        'primary-link': '#FF8C00',  
                        'black-pure': '#000000',
                        'secondary-blue': '#3B82F6', 
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style type="text/tailwindcss">
        @layer components {
            .card { @apply bg-white p-6 rounded-xl shadow-lg border border-primary-pastel/50; }
            .input-field { @apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-link transition duration-150 text-sm; }
            .status-message { @apply mt-4 p-3 rounded-md font-medium text-center border; }
        }
        .sortable { @apply cursor-pointer select-none flex items-center justify-between; }
    </style>
</head>
<body class="bg-gray-50 p-4 sm:p-8 lg:p-12 font-inter">

    <div id="actionModal" class="fixed inset-0 z-50 bg-black bg-opacity-50 hidden flex items-center justify-center p-4" onclick="window.handleActionModal && window.handleActionModal(false)">
        <div class="bg-white rounded-xl p-6 shadow-2xl max-w-sm w-full transform transition-all duration-300 scale-90" onclick="event.stopPropagation()">
            <h3 id="modalTitle" class="text-xl font-bold mb-3 text-black-pure tracking-tight">Acción Realizada</h3>
            <p id="modalBody" class="text-gray-700 mb-4 text-sm"></p>
            <button onclick="window.handleActionModal && window.handleActionModal(false)" class="w-full bg-primary-link text-white font-bold py-2 rounded-lg hover:bg-orange-600 transition active:scale-95 text-xs uppercase tracking-widest">Aceptar</button>
        </div>
    </div>
    
    <div class="max-w-7xl mx-auto">
        <div class="card mb-6">
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 border-b border-gray-200 pb-4">
                <h1 class="text-3xl font-extrabold text-black-pure flex items-center gap-3 tracking-tight">
                    <span class="text-4xl">🚕</span>
                    <span class="text-2xl uppercase tracking-tighter">
                        ALBARANES LICENCIA <span id="num_licencia_header" class="text-primary-link">...</span>
                    </span>
                </h1>

                <div class="flex flex-col lg:flex-row items-end lg:items-center gap-4 w-full xl:w-auto justify-end">
                    <div class="flex flex-wrap gap-2">
                        <a href="/titulares/nuevo_albaran" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-white bg-gradient-to-r from-green-500 to-green-600 shadow hover:from-green-600 active:scale-95 transition"><span>➕ NUEVO</span></a>
                        <a href="/titulares/enviados" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-white bg-primary-link shadow hover:bg-orange-600 active:scale-95 transition"><span>📧 ENVIADOS</span></a>
                        <a href="/titulares/pendientes" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-black-pure bg-primary-pastel border border-primary-pastel hover:bg-orange-200 active:scale-95 transition"><span>🏁 PENDIENTES</span></a>
                    </div>
                    
                    <div class="flex items-center gap-2 border-l border-gray-300 pl-4">
                        <button onclick="handleGeneratePDF()" title="Imprimir PDF" class="bg-gray-200 text-gray-700 hover:bg-gray-300 p-2 rounded-full shadow-md transition active:scale-95"><i data-lucide="printer" class="h-5 w-5"></i></button>
                        <button onclick="handleGenerateXLSX()" title="Exportar a Excel" class="bg-emerald-500 text-white p-2 rounded-full shadow-md transition active:scale-95"><i data-lucide="file-spreadsheet" class="h-5 w-5"></i></button>
                        <button onclick="handleLogout()" title="Cerrar sesión" class="bg-red-500 text-white p-2 rounded-full shadow-md transition active:scale-95"><i data-lucide="log-out" class="h-5 w-5"></i></button>
                    </div>
                </div>
            </div>

            <div class="mt-6">
                <div class="flex flex-wrap gap-3 mb-4 items-center">
                    <button type="button" id="btn-mode-campos" onclick="UI.setSearchModeManual('campos')" class="px-4 py-2 rounded-lg transition shadow-md bg-secondary-blue text-white font-bold text-[10px] uppercase">📝 Búsqueda por Campos</button>
                    <button type="button" id="btn-mode-palabra" onclick="UI.setSearchModeManual('palabra')" class="px-4 py-2 rounded-lg transition shadow-md bg-primary-pastel text-black-pure font-bold text-[10px] uppercase">💬 Búsqueda por Palabra</button>
                    <button type="button" onclick="handleClearAllFilters()" class="px-4 py-2 rounded-lg bg-blue-500 text-white text-[10px] font-bold uppercase hover:bg-blue-600 ml-auto transition">Limpiar Filtros</button>
                </div>

                <form id="searchForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-3">
                    <div class="lg:col-span-1">
                        <label class="block text-[10px] text-gray-400 font-black uppercase mb-1">Mi Licencia</label>
                        <input type="text" id="licencia_display" class="input-field bg-gray-50 cursor-not-allowed py-1.5" readonly>
                        <input type="hidden" id="licencia_ref" name="licencia_ref">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 font-black uppercase mb-1">Empresa</label>
                        <select id="empresa" name="empresa_ref" class="input-field py-1.5"></select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 font-black uppercase mb-1">Estado</label>
                        <select id="state" name="state" class="input-field py-1.5">
                            <option value="">🎯 Todos</option>
                            <option value="creado">🆕 Creado</option>
                            <option value="enviado">📧 Enviado</option>
                            <option value="pagado">💰 Pagado</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 font-black uppercase mb-1">Referencia</label>
                        <input type="text" id="referencia" name="referencia" class="input-field py-1.5" placeholder="Ref...">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 font-black uppercase mb-1">Desde</label>
                        <input type="date" id="fecha_desde" name="fecha_desde" class="input-field py-1.5">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 font-black uppercase mb-1">Hasta</label>
                        <input type="date" id="fecha_hasta" name="fecha_hasta" class="input-field py-1.5">
                    </div>
                </form>

                <div id="palabraSection" class="bg-blue-50 p-4 rounded-lg hidden border border-blue-100 mt-4">
                    <div class="flex gap-2">
                        <input type="text" id="palabra" name="palabra" placeholder="Ej: RACE Madrid, Cliente 123..." class="input-field flex-1 py-1.5">
                        <button onclick="handleSearch(event)" class="bg-primary-link text-white px-8 py-1.5 rounded-lg font-black text-xs uppercase shadow hover:bg-orange-600 transition">BUSCAR</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h2 class="text-xl font-bold text-black-pure flex items-center">
                    <span class="mr-2">📊</span> Resultados 
                    <span id="resultsCount" class="ml-3 text-[10px] font-black bg-primary-link text-white px-2.5 py-1 rounded-full uppercase tracking-wider shadow-sm">
                        0 REGISTROS
                    </span>
                </h2>

                <div class="flex flex-wrap items-center gap-3 bg-gray-50 p-2 rounded-xl border border-gray-100 shadow-sm">
                    <div class="flex items-center gap-2 px-2 border-r border-gray-200">
                        <span class="text-[10px] font-black text-gray-400 uppercase">Mostrar:</span>
                        <select id="recordsPerPage" class="bg-transparent text-xs font-bold text-gray-700 focus:outline-none cursor-pointer">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="todos">Todos</option>
                        </select>
                    </div>
                    
                    <div class="flex items-center gap-1">
                        <button id="prevPageBtn" class="p-1.5 hover:bg-white hover:shadow-sm rounded-lg transition disabled:opacity-20" title="Anterior">
                            <i data-lucide="chevron-left" class="h-4 w-4 text-gray-600"></i>
                        </button>
                        
                        <div class="bg-white px-3 py-1 rounded-lg border border-gray-200 shadow-inner min-w-[60px] text-center">
                            <span id="pageInfo" class="text-xs font-black text-primary-link">1 / 1</span>
                        </div>

                        <button id="nextPageBtn" class="p-1.5 hover:bg-white hover:shadow-sm rounded-lg transition disabled:opacity-20" title="Siguiente">
                            <i data-lucide="chevron-right" class="h-4 w-4 text-gray-600"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto rounded-xl border border-gray-100 shadow-sm">
                <table class="min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="bg-primary-link text-white text-[10px] uppercase font-black tracking-widest">
                        <tr>
                            <th class="px-4 py-4 text-left cursor-pointer group" onclick="sortTable('numero_albaran')">
                                <div class="sortable">Nº Albarán <i id="sort-numero_albaran" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50"></i></div>
                            </th>
                            <th class="px-4 py-4 text-left cursor-pointer group" onclick="sortTable('fecha')">
                                <div class="sortable">Fecha <i id="sort-fecha" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50"></i></div>
                            </th>
                            <th class="px-4 py-4 text-left cursor-pointer group" onclick="sortTable('empresa')">
                                <div class="sortable">Empresa <i id="sort-empresa" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50"></i></div>
                            </th>
                            <th class="px-4 py-4 text-left cursor-pointer group" onclick="sortTable('referencia')">
                                <div class="sortable">Ref. <i id="sort-referencia" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50"></i></div>
                            </th>
                            <th class="px-4 py-4 text-left">Conductor</th>
                            <th class="px-4 py-4 text-right cursor-pointer group" onclick="sortTable('importe_total')">
                                <div class="sortable justify-end">Importe <i id="sort-importe_total" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50 ml-1"></i></div>
                            </th>
                            <th class="px-4 py-4 text-center cursor-pointer group" onclick="sortTable('estado')">
                                <div class="sortable justify-center">Estado <i id="sort-estado" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50 ml-1"></i></div>
                            </th>
                            <th class="px-4 py-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="albaranResults" class="bg-white divide-y divide-gray-200">
                        <tr><td colspan="8" class="text-center py-20 text-gray-400 italic">Cargando datos...</td></tr>
                    </tbody>
                    <tfoot id="tableFooter" class="bg-gray-50 border-t-2 border-gray-200 hidden">
                        <tr class="font-black text-gray-900">
                            <td colspan="5" class="px-4 py-4 text-right uppercase tracking-tighter text-[10px] text-gray-500">Total acumulado en vista:</td>
                            <td id="totalImporte" class="px-4 py-4 text-right text-primary-link text-base border-l border-gray-200 bg-orange-50 font-bold">€0.00</td>
                            <td colspan="2" class="bg-gray-50"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            
            <div id="statusMessage" class="hidden mt-4 status-message"></div>
            <div id="activeFiltersCount" class="hidden"></div> 
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => { 
            if (window.lucide) lucide.createIcons(); 
        });
        function handleActionModal(show, title = '', body = '') {
            const modal = document.getElementById('actionModal');
            const titleEl = document.getElementById('modalTitle');
            const bodyEl = document.getElementById('modalBody');
            if(titleEl) titleEl.textContent = title;
            if(bodyEl) bodyEl.textContent = body;
            if(modal) modal.classList.toggle('hidden', !show);
        }
    </script>
</body>
</html>
