<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚕 Búsqueda de Albaranes de Servicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/security.js"></script>    
    <script src="/js/busqueda.js" defer></script>
    
    <script>
        // Configuración para usar colores personalizados (Naranja Pastel)
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pastel': '#FFDAB9', // Naranja Pastel
                        'primary-link': '#FF8C00',  // Naranja más vivo para botones/links
                        'black-pure': '#000000',
                        'secondary-blue': '#3B82F6', // Azul para elementos secundarios
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Clases base */
        .card { @apply bg-white p-6 rounded-xl shadow-lg border border-primary-pastel/50; }
        .input-field { @apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-link focus:border-primary-link transition duration-150; }
        
        /* Estilos del mensaje de estado (usados por JS) */
        .status-message { 
            @apply mt-4 p-3 rounded-md font-medium text-center; 
        }
        .status-success { 
            @apply bg-green-100 text-green-700 border border-green-400; 
        }
        .status-error { 
            @apply bg-red-400 text-white border border-red-600; 
        }
        .status-info, .status-neutral { 
            @apply bg-gray-200 text-gray-700 border border-gray-400; 
        }

        /* Estilos específicos para la tabla y el pie */
        .total-row td {
            @apply bg-primary-pastel/70 font-extrabold text-gray-800 text-lg;
        }
        /* Estilo para los encabezados de tabla clickables */
        .sortable {
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
        }
        .sort-icon {
            margin-left: 0.5rem;
            width: 1rem;
            height: 1rem;
            display: inline-block;
        }
        
        /* Estilos mejorados para filtros */
        .filter-section {
            @apply transition-all duration-300 ease-in-out;
        }
        
        .filter-label {
            @apply block text-xs font-medium text-gray-700 mb-1 flex items-center;
        }
        
        .search-highlight {
            @apply bg-yellow-100 border border-yellow-300;
        }
    </style>
</head>
<body class="bg-gray-50 p-4 sm:p-8 lg:p-12 font-inter">

    <div id="actionModal" class="fixed inset-0 z-50 bg-black bg-opacity-50 hidden flex items-center justify-center p-4" onclick="handleActionModal(false)">
        <div class="bg-white rounded-xl p-6 shadow-2xl max-w-sm w-full transform transition-all duration-300 scale-90" onclick="event.stopPropagation()">
            <h3 id="modalTitle" class="text-xl font-bold mb-3 text-black-pure">Acción Realizada</h3>
            <p id="modalBody" class="text-gray-700 mb-4"></p>
            <button onclick="handleActionModal(false)" class="w-full bg-primary-link text-white font-semibold py-2 rounded-lg hover:bg-orange-600 transition active:scale-95">Aceptar</button>
        </div>
    </div>
    
    <div class="max-w-7xl mx-auto">

        <div class="card mb-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b border-gray-200 pb-4">
                <h1 class="text-3xl font-bold text-black-pure mb-4 sm:mb-0 flex items-center">
                    <span class="text-4xl mr-3">🚕</span>
                    <span class="text-2xl uppercase">
                        ALBARANES LICENCIA <span id="num_licencia_header" class="text-primary-link">...</span>
                    </span>
                </h1>

                <div class="flex flex-wrap gap-3">
                    <a href="/titulares/nuevo_albaran" 
                        class="group relative inline-flex items-center justify-center px-6 py-3 font-semibold text-white transition-all duration-300 ease-in-out bg-gradient-to-r from-green-500 to-green-600 rounded-lg shadow-lg hover:shadow-xl hover:shadow-green-500/50 hover:from-green-600 hover:to-green-700 active:scale-95 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
                        <span class="mr-2 text-xl transition-transform group-hover:scale-110">➕</span>
                        <span class="relative">NUEVO ALBARAN</span>
                        <span class="absolute inset-0 rounded-lg bg-white opacity-0 group-hover:opacity-10 transition-opacity"></span>
                    </a>

                    <a href="/titulares/enviados" 
                        class="group relative inline-flex items-center justify-center px-4 py-2.5 font-semibold text-white transition-all duration-300 ease-in-out bg-primary-link rounded-lg shadow-md hover:bg-orange-600 active:scale-95 focus:outline-none focus:ring-2 focus:ring-primary-link focus:ring-offset-2">
                        <span class="mr-2 transition-transform group-hover:scale-105">📧</span>
                        <span class="relative">VER ENVIADOS</span>
                    </a>

                    <a href="/titulares/pendientes" 
                        class="group relative inline-flex items-center justify-center px-4 py-2.5 font-semibold text-black-pure transition-all duration-300 ease-in-out bg-primary-pastel border-2 border-primary-pastel rounded-lg shadow-md hover:bg-orange-300 hover:border-orange-400 active:scale-95 focus:outline-none focus:ring-2 focus:ring-primary-pastel focus:ring-offset-2">
                        <span class="mr-2 transition-transform group-hover:rotate-6">🏁</span>
                        <span class="relative">VER PENDIENTES</span>
                    </a>
                </div>
                
                    <div class="flex space-x-3 mt-4 sm:mt-0">
                        <!-- Botón Pdf -->
                        <button 
                            title="Imprimir PDF" 
                            class="bg-gray-200 text-gray-700 hover:bg-gray-300 font-semibold p-2 rounded-full shadow-md transition duration-200 active:scale-95" 
                            onclick="handleGeneratePDF()"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 6 2 18 2 18 9"/>
                                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                                <rect width="12" height="8" x="6" y="14"/>
                            </svg>
                        </button>
                        <!-- Botón Doc -->
                        <button title="Exportar a Word" class="bg-indigo-500 text-white hover:bg-indigo-600 font-semibold p-2 rounded-full shadow-md transition duration-200 active:scale-95" onclick="handleAction('Exportar Word', 'Se exportará el listado actual a formato Word')">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
                        </button>
                        <!-- Botón Xlsx -->
                        <button 
                            title="Exportar a Excel" 
                            class="bg-emerald-500 text-white hover:bg-emerald-600 font-semibold p-2 rounded-full shadow-md transition duration-200 active:scale-95" 
                            onclick="handleGenerateXLSX()"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <path d="M11 15h6"/>
                                <path d="M14 12v6"/>
                                <path d="M8 12h2"/>
                                <path d="M8 15h2"/>
                                <path d="M8 18h2"/>
                            </svg>
                        </button>


                        <!-- Botón Salir -->
                        <button onclick="handleLogout()" 
                            title="Salir y cerrar sesión"
                            class="bg-red-500 text-white hover:bg-red-600 font-semibold p-2 rounded-full shadow-md transition duration-200 active:scale-95 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                        </button>
                    </div>
            </div>
        </div>

        <div class="card mb-8 filter-section">
            <h2 class="text-xl font-bold text-black-pure mb-4 flex items-center">
                <span class="mr-2">🔍</span>
                Filtros de Búsqueda Avanzada
                <span class="ml-auto text-sm font-normal text-gray-500">
                    <span id="activeFiltersCount">0</span> filtro(s) activo(s)
                </span>
            </h2>
            
            <form id="searchForm" onsubmit="handleSearch(event)">
                
                <div class="flex flex-wrap gap-3 mb-4 items-center">
                    <span class="font-medium text-gray-700">Modo de filtro:</span>
                    <button type="button" id="btn-mode-campos" onclick="UI.setSearchModeManual('campos')"
                            class="px-4 py-2 rounded-lg transition duration-200 shadow-md bg-secondary-blue text-white hover:bg-blue-600 active:scale-95">
                        <span class="mr-2">📝</span> Búsqueda por Campos
                    </button>

                    <button type="button" id="btn-mode-palabra" onclick="UI.setSearchModeManual('palabra')"
                            class="px-4 py-2 rounded-lg transition duration-200 shadow-md bg-primary-pastel text-black-pure hover:bg-orange-300 active:scale-95">
                        <span class="mr-2">💬</span> Búsqueda por Palabra
                    </button>

                    <button type="button" id="btn-limpiar" onclick="handleClearAllFilters()"
                            class="px-4 py-2 rounded-lg transition duration-200 shadow-md bg-blue-500 text-white hover:bg-blue-600 active:scale-95 ml-2">
                        Limpiar
                    </button>
                </div>
                
                <hr class="mb-6 border-gray-100">

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-3 mb-6">
                    <div>
                        <label class="filter-label">
                            <i data-lucide="lock" class="h-3 w-3 mr-1 text-blue-500"></i> MI LICENCIA
                        </label>
                        <input type="text" id="licencia_display" class="input-field bg-blue-50 text-blue-700 font-bold border-blue-200 text-xs cursor-not-allowed" readonly value="Cargando...">
                        <input type="hidden" id="licencia_ref" name="licencia_ref">
                    </div>

                    <div>
                        <label for="empresa" class="block text-sm font-medium text-gray-600 mb-1">Empresa</label>
                        <select id="empresa" name="empresa_ref" class="input-field appearance-none" onchange="handleSearch()">
                            <option value="">Todas las empresas</option>
                        </select>
                    </div>

                    <div>
                        <label for="state" class="filter-label">Estado</label>
                        <select id="state" name="state" class="input-field appearance-none text-xs" onchange="handleSearch()">
                            <option value="">🎯 Todos los estados</option>
                            <option value="creado">🆕 Creado</option>
                            <option value="enviado">📧 Enviado</option>
                            <option value="pagado">💰 Pagado</option>
                            <option value="finalizado">✅ Finalizado</option>
                        </select>
                    </div>

                    <div>
                        <label for="referencia" class="filter-label">Referencia</label>
                        <input type="text" id="referencia" name="referencia" placeholder="Ref..." class="input-field text-xs" oninput="handleSearch()">
                    </div>

                    <div>
                        <label for="fecha_desde" class="filter-label">Fecha (Desde)</label>
                        <input type="date" id="fecha_desde" name="fecha_desde" class="input-field text-xs">
                    </div>

                    <div>
                        <label for="fecha_hasta" class="filter-label">Fecha (Hasta)</label>
                        <input type="date" id="fecha_hasta" name="fecha_hasta" class="input-field text-xs">
                    </div>
                </div>

                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                    <label for="palabra" class="filter-label">🔍 Buscar por palabras</label>
                    <div class="flex gap-2">
                        <input type="text" id="palabra" name="palabra" placeholder="Ej: RACE Madrid cliente123..." class="input-field flex-1 search-highlight">
                        <button type="submit" class="bg-primary-link text-white px-6 py-2 rounded-lg font-bold hover:bg-orange-600 transition">BUSCAR</button>
                    </div>
                    <div class="flex flex-wrap gap-4 text-xs text-gray-700 mt-2">
                        <label class="inline-flex items-center"><input type="radio" name="search_type" value="exacta" checked class="form-radio text-primary-link h-4 w-4"> <span class="ml-2">Frase Exacta</span></label>
                        <label class="inline-flex items-center"><input type="radio" name="search_type" value="todas" class="form-radio text-primary-link h-4 w-4"> <span class="ml-2">Todas las palabras</span></label>
                    </div>
                </div>
            </form>
        </div>

        <div class="card">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6">
                <h2 class="text-xl font-bold text-black-pure mb-4 sm:mb-0 flex items-center">
                    <span class="mr-2">📊</span> Resultados <span id="resultsCount" class="ml-3 text-sm font-normal bg-primary-link text-white px-3 py-1 rounded-full">0</span>
                </h2>

                <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                    <div class="flex items-center space-x-2 text-sm text-gray-600">
                        <span>Registros:</span>
                        <select id="recordsPerPage" class="input-field w-auto px-3 py-2 border rounded-md">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                        </select>
                    </div>
                    
                    <div class="flex items-center space-x-2">
                        <button id="prevPageBtn" class="bg-gray-200 p-2 rounded-lg disabled:opacity-50"><i data-lucide="chevron-left" class="h-4 w-4"></i></button>
                        <span id="pageInfo" class="text-sm font-medium px-3 py-1 bg-gray-100 rounded">Pág 1 de 1</span>
                        <button id="nextPageBtn" class="bg-gray-200 p-2 rounded-lg disabled:opacity-50"><i data-lucide="chevron-right" class="h-4 w-4"></i></button>
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto shadow-lg rounded-xl border border-gray-100">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-primary-link text-white">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-bold uppercase cursor-pointer" onclick="sortTable('numero_albaran')">Nº Albarán</th>
                            <th class="px-4 py-3 text-left text-xs font-bold uppercase cursor-pointer" onclick="sortTable('fecha')">Fecha</th>
                            <th class="px-4 py-3 text-left text-xs font-bold uppercase">Empresa</th>
                            <th class="px-4 py-3 text-left text-xs font-bold uppercase">Ref.</th>
                            <th class="px-4 py-3 text-left text-xs font-bold uppercase">Conductor</th>
                            <th class="px-4 py-3 text-right text-xs font-bold uppercase">Importe</th>
                            <th class="px-4 py-3 text-center text-xs font-bold uppercase">Estado</th>
                            <th class="px-4 py-3 text-center text-xs font-bold uppercase">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="albaranResults" class="bg-white divide-y divide-gray-200 text-xs">
                        <tr><td colspan="8" class="text-center py-10 italic text-gray-400">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="statusMessage" class="hidden status-message" role="alert"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });
        function showModal(show, title = '', body = '') {
            const modal = document.getElementById('actionModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').textContent = body;
            modal.classList.toggle('hidden', !show);
        }
        function handleAction(title, desc) { showModal(true, title, desc); }
    </script>
</body>
</html>
