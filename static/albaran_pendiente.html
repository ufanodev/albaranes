<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚕 Búsqueda de Albaranes de Servicio</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'primary-pastel': '#FFDAB9',
            'primary-link': '#FF8C00',
            'black-pure': '#000000',
            'secondary-blue': '#3B82F6',
          },
          fontFamily: {
            sans: ['system-ui', 'ui-sans-serif', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Seguridad y lógica de albaranes -->
  <script src="/js/security.js"></script>
  <script src="/js/albaran_pendiente.js" defer></script>

  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-gray-50 font-sans flex justify-center">
  <div class="w-full max-w-7xl p-4 sm:p-8 lg:p-10">

    <!-- MODAL DE ACCIÓN -->
    <div id="actionModal"
         class="fixed inset-0 z-50 bg-black bg-opacity-50 hidden items-center justify-center p-4"
         onclick="window.handleActionModal && window.handleActionModal(false)">
      <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full transform transition-all duration-300"
           onclick="event.stopPropagation()">
        <h3 id="modalTitle" class="text-xl font-bold mb-3 text-black-pure">
          Acción realizada
        </h3>
        <p id="modalBody" class="text-gray-700 mb-4"></p>
        <button
          onclick="window.handleActionModal && window.handleActionModal(false)"
          class="w-full bg-primary-link text-white font-semibold py-2 rounded-lg hover:bg-orange-600 transition active:scale-95">
          Aceptar
        </button>
      </div>
    </div>

    <!-- CABECERA PRINCIPAL -->
    <div class="bg-white p-6 rounded-xl shadow-lg border border-primary-pastel/50 mb-6">
      <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 border-b border-gray-200 pb-4">
        <h1 class="text-3xl font-extrabold text-black-pure flex items-center gap-3 tracking-tight">
          <span class="text-4xl">🚕</span>
          <span class="text-2xl">Albaranes pendientes</span>
        </h1>

        <div class="flex flex-col lg:flex-row items-end lg:items-center gap-4 w-full xl:w-auto justify-end">

    <!-- Botones de navegación (reducidos) -->
    <div class="flex flex-wrap gap-2">
      <a href="/titulares/nuevo_albaran"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-white
                bg-gradient-to-r from-green-500 to-green-600 shadow-sm hover:shadow-md
                hover:from-green-600 hover:to-green-700 active:scale-95 transition">
        <span class="text-base">➕</span>
        <span>Nuevo albarán</span>
      </a>

      <a href="/titulares/enviados"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-white
                bg-primary-link shadow-sm hover:bg-orange-600 active:scale-95 transition">
        <span class="text-base">📧</span>
        <span>Ver enviados</span>
      </a>

      <a href="/titulares"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-gray-700
                bg-white border border-gray-300 shadow-sm hover:bg-gray-100 hover:border-gray-400
                active:scale-95 transition">
        <span class="text-base">📋</span>
        <span>Ver todos</span>
      </a>

      <a href="/titulares/pendientes"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold
                text-black-pure bg-primary-pastel border border-primary-pastel shadow-sm
                hover:bg-orange-300 hover:border-orange-400 active:scale-95 transition">
        <span class="text-base">🏁</span>
        <span>Ver pendientes</span>
      </a>
    </div>


              <!-- Botones redondos de acciones -->
              <div class="flex items-center gap-2 border-l border-gray-300 pl-4">
                <button title="Imprimir PDF"
                        class="bg-gray-200 text-gray-700 hover:bg-gray-300 font-semibold p-2 rounded-full shadow-md transition duration-200 active:scale-95"
                        onclick="handleAction('Imprimir PDF', 'Todo el listado')">
                  <i data-lucide="printer" class="h-5 w-5"></i>
                </button>

                <button title="Exportar a Word"
                        class="bg-indigo-500 text-white hover:bg-indigo-600 font-semibold p-2 rounded-full shadow-md transition duration-200 active:scale-95"
                        onclick="handleAction('Exportar Word', 'Todo el listado')">
                  <i data-lucide="file-text" class="h-5 w-5"></i>
                </button>

                <button title="Exportar a Excel"
                        class="bg-emerald-500 text-white hover:bg-emerald-600 font-semibold p-2 rounded-full shadow-md transition duration-200 active:scale-95"
                        onclick="handleAction('Exportar Excel', 'Todo el listado')">
                  <i data-lucide="file-spreadsheet" class="h-5 w-5"></i>
                </button>

                <button onclick="handleLogout()" title="Salir y cerrar sesión"
                        class="bg-red-500 text-white hover:bg-red-600 font-semibold p-2 rounded-full shadow-md transition duration-200 active:scale-95 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                  <i data-lucide="log-out" class="h-5 w-5"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- BOTONES DE ACCIÓN SUPERIORES -->
          <div class="mt-4 bg-white rounded-xl">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div class="flex flex-wrap gap-2">
                <button type="button"
                        onclick="window.handleEnviarSeleccionados && window.handleEnviarSeleccionados()"
                        class="inline-flex items-center justify-center px-4 py-2 text-xs font-semibold text-white
                              bg-gradient-to-r from-green-500 to-green-600 rounded-lg shadow-sm
                              hover:shadow-md hover:from-green-600 hover:to-green-700 active:scale-95 transition">
                  Enviar seleccionados
                </button>
              </div>
            </div>
          </div>
        </div>

<!-- TÍTULO DE LA TABLA -->
    <h2 class="text-xl font-bold text-black-pure mb-4 flex items-center gap-2">
      <span>📊</span>
      <span>Albaranes pendientes de cobro/pago</span>
    </h2>

    <!-- CONTROLES DE PAGINACIÓN / REGISTROS -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4 flex flex-col gap-4">
      <div class="flex justify-between items-center mb-2 flex-wrap gap-3">
        <div class="flex items-center space-x-2 text-sm text-gray-600">
          <span>Registros por página:</span>
          <select id="recordsPerPage"
                  class="px-3 py-1.5 text-sm border border-gray-300 rounded-md
                         focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="todos">Todos</option>
          </select>
          <span id="totalLabel" class="text-xs text-gray-500 ml-2"></span>
        </div>

        <div class="flex items-center space-x-2">
          <button id="prevPageBtn"
                  class="bg-gray-200 text-gray-700 hover:bg-gray-300 px-2 py-1 rounded-lg transition duration-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
                  title="Página anterior">
            <i data-lucide="chevron-left" class="h-4 w-4"></i>
          </button>
          <span id="pageInfo"
                class="text-sm text-gray-600 font-medium px-3 py-1 bg-gray-100 rounded">
            Página 1 de 1
          </span>
          <button id="nextPageBtn"
                  class="bg-gray-200 text-gray-700 hover:bg-gray-300 px-2 py-1 rounded-lg transition duration-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
                  title="Página siguiente">
            <i data-lucide="chevron-right" class="h-4 w-4"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- TABLA DE ALBARANES (10 columnas, sin checkbox) -->
    <div class="overflow-x-auto shadow-lg rounded-xl border border-gray-100 bg-white">
      <table class="min-w-full divide-y divide-gray-200 text-sm">
        <thead class="bg-primary-link text-white text-xs uppercase tracking-wider">
          <tr>
            <!-- 1. Nº albarán -->
            <th scope="col" class="px-4 py-3 text-left font-bold rounded-tl-xl">
              <button type="button"
                      class="flex items-center gap-1 w-full justify-between"
                      onclick="window.sortTable && window.sortTable('numero_albaran')">
                <span>Nº albarán</span>
                <i id="sort-numero_albaran" data-lucide="chevrons-up-down" class="h-4 w-4"></i>
              </button>
            </th>
            <!-- 2. Fecha -->
            <th scope="col" class="px-4 py-3 text-left font-bold">
              <button type="button"
                      class="flex items-center gap-1 w-full justify-between"
                      onclick="window.sortTable && window.sortTable('fecha')">
                <span>Fecha</span>
                <i id="sort-fecha" data-lucide="chevrons-up-down" class="h-4 w-4"></i>
              </button>
            </th>
            <!-- 3. Licencia -->
            <th scope="col" class="px-4 py-3 text-left font-bold">
              <button type="button"
                      class="flex items-center gap-1 w-full justify-between"
                      onclick="window.sortTable && window.sortTable('licencia')">
                <span>Licencia</span>
                <i id="sort-licencia" data-lucide="chevrons-up-down" class="h-4 w-4"></i>
              </button>
            </th>
            <!-- 4. Empresa -->
            <th scope="col" class="px-4 py-3 text-left font-bold">Empresa</th>
            <!-- 5. Referencia -->
            <th scope="col" class="px-4 py-3 text-left font-bold">Referencia</th>
            <!-- 6. Conductor -->
            <th scope="col" class="px-4 py-3 text-left font-bold">Conductor</th>
            <!-- 7. Importe total -->
            <th scope="col" class="px-4 py-3 text-right font-bold">
              <button type="button"
                      class="flex items-center gap-1 w-full justify-end"
                      onclick="window.sortTable && window.sortTable('importe_total')">
                <span>Importe total</span>
                <i id="sort-importe_total" data-lucide="chevrons-up-down" class="h-4 w-4"></i>
              </button>
            </th>
            <!-- 8. Estado -->
            <th scope="col" class="px-4 py-3 text-left font-bold">Estado</th>
            <!-- 9. Observaciones -->
            <th scope="col" class="px-4 py-3 text-left font-bold">Observaciones</th>
            <!-- 10. Acciones -->
            <th scope="col" class="px-4 py-3 text-center font-bold rounded-tr-xl">Acciones</th>
          </tr>
        </thead>
        
          <tbody id="albaranResults" class="bg-white divide-y divide-gray-100">
            <tr>
              <td colspan="10" class="text-center py-6 text-gray-500 italic">
                No tiene albaranes pendientes.
              </td>
            </tr>
          </tbody>

        <tfoot id="albaranTotal" class="bg-gray-50 font-semibold text-gray-800"></tfoot>
      </table>
    </div>

    <!-- MENSAJE DE ESTADO -->
    <div id="statusMessage"
         class="hidden mt-4 px-4 py-3 rounded-md text-sm font-medium text-center"
         role="alert"></div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
