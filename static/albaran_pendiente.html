<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚕 Albaranes Pendientes de Pago</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'primary-pastel': '#FFDAB9',
            'primary-link': '#FF8C00',
            'black-pure': '#000000',
            'secondary-blue': '#3B82F6',
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>

  <script src="/js/security.js"></script>
  <script src="/js/albaran_pendiente.js" defer></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style type="text/tailwindcss">
    @layer components {
      .card { @apply bg-white p-6 rounded-xl shadow-lg border border-primary-pastel/50; }
      .input-field { @apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-link transition duration-150 text-sm; }
    }
    .sortable { @apply cursor-pointer select-none flex items-center justify-between; }
  </style>
</head>

<body class="min-h-screen bg-gray-50 font-sans flex justify-center">
  <div class="w-full max-w-7xl p-4 sm:p-8 lg:p-10">

    <div id="actionModal" class="fixed inset-0 z-50 bg-black/60 hidden items-center justify-center p-4 backdrop-blur-sm">
      <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full transform transition-all border-t-4 border-primary-link">
        <h3 id="modalTitle" class="text-xl font-black mb-3 text-black-pure tracking-tight uppercase">Acción realizada</h3>
        <p id="modalBody" class="text-gray-600 mb-6 text-sm leading-relaxed font-medium"></p>
        <button onclick="UI.closeModal()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-black transition shadow-lg active:scale-95 uppercase text-xs tracking-widest">Aceptar</button>
      </div>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-lg border border-primary-pastel/50 mb-6">
      <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 border-b border-gray-200 pb-4">
        <h1 class="text-3xl font-extrabold text-black-pure flex items-center gap-3 tracking-tight">
          <span class="text-4xl">🚕</span>
          <span class="text-2xl uppercase tracking-tighter">Albaranes pendientes</span>
        </h1>


                <div class="flex flex-col lg:flex-row items-end lg:items-center gap-4 w-full xl:w-auto justify-end">
                    <div class="flex flex-wrap gap-2">
                        <a href="/titulares/nuevo_albaran" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-white bg-gradient-to-r from-green-500 to-green-600 shadow hover:from-green-600 active:scale-95 transition"><span>➕ NUEVO</span></a>
                        <a href="/titulares/enviados" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-white bg-primary-link shadow hover:bg-orange-600 active:scale-95 transition"><span>📧 ENVIADOS</span></a>
                        <a href="/titulares/pendientes" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-black-pure bg-primary-pastel border border-primary-pastel hover:bg-orange-200 active:scale-95 transition"><span>🏁 PENDIENTES</span></a>
                    </div>
                    
                    <div class="flex items-center gap-2 border-l border-gray-300 pl-4">
                        <button onclick="handleGeneratePDF()" title="Imprimir PDF" class="bg-gray-200 text-gray-700 hover:bg-gray-300 p-2 rounded-full shadow-md transition active:scale-95"><i data-lucide="printer" class="h-5 w-5"></i></button>
                        <button onclick="handleGenerateXLSX()" title="Exportar a Excel" class="bg-emerald-500 text-white p-2 rounded-full shadow-md transition active:scale-95"><i data-lucide="file-spreadsheet" class="h-5 w-5"></i></button>
                        <button onclick="handleLogout()" title="Cerrar sesión" class="bg-red-500 text-white p-2 rounded-full shadow-md transition active:scale-95"><i data-lucide="log-out" class="h-5 w-5"></i></button>
                    </div>
                </div>
            </div>

      <div class="mt-6 bg-slate-50 p-6 rounded-2xl border border-slate-100">
        <div class="flex flex-wrap gap-3 mb-6 items-center">
            <button type="button" id="btn-mode-campos" onclick="UI.setSearchModeManual('campos')" class="px-4 py-2 rounded-lg transition shadow-md bg-secondary-blue text-white font-black text-[10px] uppercase tracking-widest">📝 Búsqueda por Campos</button>
            <button type="button" id="btn-mode-palabra" onclick="UI.setSearchModeManual('palabra')" class="px-4 py-2 rounded-lg transition shadow-md bg-white text-slate-400 font-black text-[10px] uppercase tracking-widest border border-slate-200">💬 Búsqueda por Palabra</button>
            <button type="button" onclick="UI.handleClearAllFilters()" class="px-4 py-2 rounded-lg bg-slate-200 text-slate-600 text-[10px] font-black uppercase hover:bg-slate-300 ml-auto transition">Limpiar</button>
        </div>

        <form id="searchForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
            <div>
                <label class="block text-[10px] text-slate-400 font-black uppercase mb-1.5 ml-1">Empresa</label>
                <select id="empresa" class="input-field py-2 font-semibold text-slate-700"></select>
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-black uppercase mb-1.5 ml-1">Referencia</label>
                <input type="text" id="referencia_input" class="input-field py-2 font-semibold" placeholder="EXP-XXXX">
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-black uppercase mb-1.5 ml-1">Desde</label>
                <input type="date" id="fecha_desde" class="input-field py-2">
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-black uppercase mb-1.5 ml-1">Hasta</label>
                <input type="date" id="fecha_hasta" class="input-field py-2">
            </div>
            <div class="flex items-end">
                <button type="submit" class="w-full bg-primary-link text-white font-black py-2.5 rounded-lg text-[10px] uppercase tracking-[0.2em] hover:bg-orange-600 transition shadow-lg active:scale-95">Filtrar Albaranes</button>
            </div>
        </form>

        <div id="palabraSection" class="bg-blue-100/50 p-5 rounded-xl hidden border border-blue-200">
            <label class="block text-[10px] text-blue-600 font-black uppercase mb-2 ml-1">Búsqueda rápida (Cualquier campo)</label>
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-blue-400 w-4 h-4"></i>
                <input type="text" id="palabra" placeholder="Ej: RACE, Madrid, Cliente 123..." class="input-field pl-10 py-3 font-bold border-blue-200 focus:ring-blue-400">
            </div>
        </div>
      </div>

      <div class="mt-6 pt-4 border-t border-gray-100 flex flex-wrap justify-between items-center gap-4">
        <button type="button" id="btnEnviarMasivo" onclick="handleEnviarSeleccionados()"
                class="inline-flex items-center justify-center px-8 py-3 text-xs font-black text-white bg-slate-900 rounded-xl shadow-xl hover:bg-black active:scale-95 transition uppercase tracking-widest gap-2">
          <i data-lucide="send" class="w-4 h-4"></i> Enviar seleccionados
        </button>
        <div class="flex items-center gap-2">
            <span id="activeFiltersCount" class="text-[10px] font-black bg-orange-100 px-4 py-1.5 rounded-full text-orange-600 border border-orange-200">0 REGISTROS FILTRADOS</span>
        </div>
      </div>
    </div>

    <div class="card">
        <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
            <h2 class="text-xl font-black text-black-pure flex items-center gap-2 tracking-tight uppercase">
              <span class="p-2 bg-orange-100 rounded-lg text-orange-600">📊</span>
              <span>Listado de Pendientes</span>
            </h2>
            <div class="flex items-center space-x-3 bg-slate-50 p-2 rounded-xl border border-slate-100">
                <span class="text-[10px] text-slate-400 font-black uppercase">Ver:</span>
                <select id="recordsPerPage" class="px-2 py-1 text-xs font-bold border-none bg-transparent focus:ring-0 cursor-pointer">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                    <option value="todos">Todos</option>
                </select>
                <div class="flex items-center gap-2 border-l border-slate-200 pl-3">
                    <button id="prevPageBtn" class="bg-white border border-slate-200 p-1 rounded-md shadow-sm disabled:opacity-30 hover:bg-slate-50 transition"><i data-lucide="chevron-left" class="h-4 w-4"></i></button>
                    <span id="pageInfo" class="text-[10px] font-black px-2 text-slate-600">1 / 1</span>
                    <button id="nextPageBtn" class="bg-white border border-slate-200 p-1 rounded-md shadow-sm disabled:opacity-30 hover:bg-slate-50 transition"><i data-lucide="chevron-right" class="h-4 w-4"></i></button>
                </div>
            </div>
        </div>

        <div class="overflow-x-auto rounded-[1rem] border border-slate-100 shadow-inner bg-slate-50/30">
          <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead class="bg-slate-900 text-white text-[9px] uppercase font-black tracking-[0.15em]">
              <tr>
                <th class="px-4 py-5 text-center w-10"><input type="checkbox" id="selectAll" class="w-4 h-4 rounded cursor-pointer accent-primary-link"></th>
                <th class="px-4 py-5 text-left cursor-pointer group" onclick="sortTable('numero_albaran')">
                    <div class="flex items-center justify-between">Nº albarán <i id="sort-numero_albaran" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30 group-hover:opacity-100 transition"></i></div>
                </th>
                <th class="px-4 py-5 text-left cursor-pointer group" onclick="sortTable('fecha')">
                    <div class="flex items-center justify-between">Fecha <i id="sort-fecha" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30 group-hover:opacity-100 transition"></i></div>
                </th>
                <th class="px-4 py-5 text-left">Licencia</th>
                <th class="px-4 py-5 text-left cursor-pointer group" onclick="sortTable('empresa')">
                    <div class="flex items-center justify-between">Empresa <i id="sort-empresa" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30 group-hover:opacity-100 transition"></i></div>
                </th>
                <th class="px-4 py-5 text-left cursor-pointer group" onclick="sortTable('referencia')">
                    <div class="flex items-center justify-between">Ref. <i id="sort-referencia" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30 group-hover:opacity-100 transition"></i></div>
                </th>
                <th class="px-4 py-5 text-left">Asalariado</th>
                <th class="px-4 py-5 text-right cursor-pointer group" onclick="sortTable('importe_total')">
                    <div class="flex items-center justify-end">Importe <i id="sort-importe_total" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30 group-hover:opacity-100 ml-1 transition"></i></div>
                </th>
                <th class="px-4 py-5 text-center">Estado</th>
                <th class="px-4 py-5 text-left">Obs.</th>
                <th class="px-4 py-5 text-center">Gestión</th>
              </tr>
            </thead>
            <tbody id="albaranResults" class="bg-white divide-y divide-slate-100">
                <tr><td colspan="11" class="text-center py-24 italic text-slate-400 font-medium">Iniciando conexión con el servidor...</td></tr>
            </tbody>
            <tfoot id="albaranTotal" class="bg-slate-50/80 font-bold border-t-2 border-slate-200"></tfoot>
          </table>
        </div>
        
        <div class="mt-4 flex justify-between items-center px-2">
            <p id="totalLabel" class="text-[10px] text-slate-400 font-black uppercase tracking-[0.2em] italic"></p>
            <div class="flex gap-4">
                <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-500"></span><span class="text-[9px] font-bold text-slate-500 uppercase">Creado</span></div>
                <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-orange-500"></span><span class="text-[9px] font-bold text-slate-500 uppercase">Enviado</span></div>
            </div>
        </div>
    </div>

    <div id="statusMessage" class="hidden mt-6 px-6 py-4 rounded-2xl text-sm font-black text-center border shadow-xl transition-all duration-300 transform scale-95"></div>

  </div>

  <script>
    // Inicialización de Iconos global
    document.addEventListener('DOMContentLoaded', () => { 
        if (window.lucide) lucide.createIcons(); 
    });
  </script>
</body>
</html>
