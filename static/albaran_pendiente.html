<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚕 Albaranes Pendientes de Pago</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'primary-pastel': '#FFDAB9',
            'primary-link': '#FF8C00',
            'black-pure': '#000000',
            'secondary-blue': '#3B82F6',
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>

  <script src="/js/security.js"></script>
  <script src="/js/albaran_pendiente.js" defer></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style type="text/tailwindcss">
    @layer components {
      .card { @apply bg-white p-6 rounded-xl shadow-lg border border-primary-pastel/50; }
      .input-field { @apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-link transition duration-150 text-sm; }
    }
    .sortable { @apply cursor-pointer select-none flex items-center justify-between; }
  </style>
</head>

<body class="min-h-screen bg-gray-50 font-sans flex justify-center">
  <div class="w-full max-w-7xl p-4 sm:p-8 lg:p-10">

    <div id="actionModal" class="fixed inset-0 z-50 bg-black bg-opacity-50 hidden items-center justify-center p-4" onclick="window.handleActionModal && window.handleActionModal()">
      <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full transform transition-all duration-300" onclick="event.stopPropagation()">
        <h3 id="modalTitle" class="text-xl font-bold mb-3 text-black-pure tracking-tight">Acción realizada</h3>
        <p id="modalBody" class="text-gray-700 mb-4 text-sm"></p>
        <button onclick="window.handleActionModal && window.handleActionModal()" class="w-full bg-primary-link text-white font-semibold py-2 rounded-lg hover:bg-orange-600 transition active:scale-95">Aceptar</button>
      </div>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-lg border border-primary-pastel/50 mb-6">
      <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 border-b border-gray-200 pb-4">
        <h1 class="text-3xl font-extrabold text-black-pure flex items-center gap-3 tracking-tight">
          <span class="text-4xl">🚕</span>
          <span class="text-2xl uppercase tracking-tighter">Albaranes pendientes</span>
        </h1>

        <div class="flex flex-col lg:flex-row items-end lg:items-center gap-4 w-full xl:w-auto justify-end">
            <div class="flex flex-wrap gap-2">
                <a href="/titulares/nuevo_albaran" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-white bg-gradient-to-r from-green-500 to-green-600 shadow hover:from-green-600 active:scale-95 transition">
                    <span>➕ Nuevo</span>
                </a>
                <a href="/titulares" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 active:scale-95 transition">
                    <span>📋 Ver todos</span>
                </a>
                <a href="/titulares/pendientes" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-black-pure bg-primary-pastel border border-primary-pastel hover:bg-orange-200 active:scale-95 transition">
                    <span>🏁 Pendientes</span>
                </a>
            </div>

            <div class="flex items-center gap-2 border-l border-gray-300 pl-4">
              <button onclick="handleGeneratePDF()" title="Imprimir PDF" class="bg-gray-200 text-gray-700 hover:bg-gray-300 p-2 rounded-full shadow-md transition active:scale-95"><i data-lucide="printer" class="h-5 w-5"></i></button>
              <button onclick="handleGenerateXLSX()" title="Exportar a Excel" class="bg-emerald-500 text-white p-2 rounded-full shadow-md transition active:scale-95"><i data-lucide="file-spreadsheet" class="h-5 w-5"></i></button>
              <button onclick="handleLogout()" title="Cerrar sesión" class="bg-red-500 text-white p-2 rounded-full shadow-md transition active:scale-95"><i data-lucide="log-out" class="h-5 w-5"></i></button>
            </div>
        </div>
      </div>

      <div class="mt-6">
        <div class="flex flex-wrap gap-3 mb-4 items-center">
            <button type="button" id="btn-mode-campos" onclick="UI.setSearchModeManual('campos')" class="px-4 py-2 rounded-lg transition shadow-md bg-secondary-blue text-white font-bold text-[10px] uppercase">📝 Búsqueda por Campos</button>
            <button type="button" id="btn-mode-palabra" onclick="UI.setSearchModeManual('palabra')" class="px-4 py-2 rounded-lg transition shadow-md bg-primary-pastel text-black-pure font-bold text-[10px] uppercase">💬 Búsqueda por Palabra</button>
            <button type="button" onclick="UI.handleClearAllFilters()" class="px-4 py-2 rounded-lg bg-blue-500 text-white text-[10px] font-bold uppercase hover:bg-blue-600 ml-auto">Limpiar</button>
        </div>

        <form id="searchForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-3 mb-4">
            <div>
                <label class="block text-[10px] text-gray-400 font-black uppercase mb-1">Empresa</label>
                <select id="empresa" class="input-field py-1.5"></select>
            </div>
            <div>
                <label class="block text-[10px] text-gray-400 font-black uppercase mb-1">Referencia</label>
                <input type="text" id="referencia_input" class="input-field py-1.5" placeholder="Buscar...">
            </div>
            <div>
                <label class="block text-[10px] text-gray-400 font-black uppercase mb-1">Desde</label>
                <input type="date" id="fecha_desde" class="input-field py-1.5">
            </div>
            <div>
                <label class="block text-[10px] text-gray-400 font-black uppercase mb-1">Hasta</label>
                <input type="date" id="fecha_hasta" class="input-field py-1.5">
            </div>
            <div class="flex items-end">
                <button type="submit" class="w-full bg-primary-link text-white font-black py-2 rounded-lg text-xs uppercase tracking-widest hover:bg-orange-600 transition shadow">Filtrar</button>
            </div>
        </form>

        <div id="palabraSection" class="bg-blue-50 p-4 rounded-lg hidden border border-blue-100">
            <label class="block text-[10px] text-blue-500 font-black uppercase mb-2">Búsqueda rápida (Cualquier campo)</label>
            <input type="text" id="palabra" placeholder="Ej: RACE, Madrid, Cliente 123..." class="input-field">
        </div>
      </div>

      <div class="mt-6 pt-4 border-t border-gray-100 flex flex-wrap justify-between items-center gap-4">
        <button type="button" id="btnEnviarMasivo" onclick="handleEnviarSeleccionados()"
                class="inline-flex items-center justify-center px-6 py-2.5 text-xs font-bold text-white bg-gradient-to-r from-green-500 to-green-600 rounded-lg shadow hover:from-green-600 active:scale-95 transition uppercase tracking-widest">
          <i data-lucide="send" class="w-4 h-4 mr-2"></i> Enviar seleccionados
        </button>
        <div class="flex items-center gap-2">
            <span id="activeFiltersCount" class="text-[10px] font-black bg-orange-100 px-3 py-1 rounded-full text-orange-600">0 REGISTROS FILTRADOS</span>
        </div>
      </div>
    </div>

    <div class="card">
        <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
            <h2 class="text-xl font-bold text-black-pure flex items-center gap-2 tracking-tight">
              <span>📊</span><span>Listado de Resultados</span>
            </h2>
            <div class="flex items-center space-x-2">
                <span class="text-xs text-gray-500 font-bold">REGISTROS:</span>
                <select id="recordsPerPage" class="px-2 py-1 text-xs border rounded-md focus:ring-2 focus:ring-primary-link outline-none">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                    <option value="todos">Todos</option>
                </select>
                <div class="flex items-center gap-1 border-l pl-2">
                    <button id="prevPageBtn" class="bg-gray-100 p-1.5 rounded-lg disabled:opacity-30"><i data-lucide="chevron-left" class="h-4 w-4"></i></button>
                    <span id="pageInfo" class="text-xs font-black px-2 text-gray-600 underline">1 / 1</span>
                    <button id="nextPageBtn" class="bg-gray-100 p-1.5 rounded-lg disabled:opacity-30"><i data-lucide="chevron-right" class="h-4 w-4"></i></button>
                </div>
            </div>
        </div>

        <div class="overflow-x-auto rounded-xl border border-gray-100 shadow-sm">
          <table class="min-w-full divide-y divide-gray-200 text-sm">
            <thead class="bg-primary-link text-white text-[10px] uppercase font-black tracking-widest">
              <tr>
                <th class="px-4 py-4 text-center w-10"><input type="checkbox" id="selectAll" class="w-4 h-4 rounded cursor-pointer"></th>
                <th class="px-4 py-4 text-left cursor-pointer group" onclick="sortTable('numero_albaran')">
                    <div class="flex items-center justify-between">Nº albarán <i id="sort-numero_albaran" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50 group-hover:opacity-100"></i></div>
                </th>
                <th class="px-4 py-4 text-left cursor-pointer group" onclick="sortTable('fecha')">
                    <div class="flex items-center justify-between">Fecha <i id="sort-fecha" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50 group-hover:opacity-100"></i></div>
                </th>
                <th class="px-4 py-4 text-left">Licencia</th>
                <th class="px-4 py-4 text-left cursor-pointer group" onclick="sortTable('empresa')">
                    <div class="flex items-center justify-between">Empresa <i id="sort-empresa" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50 group-hover:opacity-100"></i></div>
                </th>
                <th class="px-4 py-4 text-left cursor-pointer group" onclick="sortTable('referencia')">
                    <div class="flex items-center justify-between">Referencia <i id="sort-referencia" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50 group-hover:opacity-100"></i></div>
                </th>
                <th class="px-4 py-4 text-left">Conductor</th>
                <th class="px-4 py-4 text-right cursor-pointer group" onclick="sortTable('importe_total')">
                    <div class="flex items-center justify-end">Importe <i id="sort-importe_total" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-50 group-hover:opacity-100 ml-1"></i></div>
                </th>
                <th class="px-4 py-4 text-center">Estado</th>
                <th class="px-4 py-4 text-left">Obs.</th>
                <th class="px-4 py-4 text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="albaranResults" class="bg-white divide-y divide-gray-100">
                <tr><td colspan="11" class="text-center py-24 italic text-gray-400">Cargando datos...</td></tr>
            </tbody>
            <tfoot id="albaranTotal" class="bg-primary-pastel/10 font-bold border-t-2 border-gray-100"></tfoot>
          </table>
        </div>
        <p id="totalLabel" class="mt-4 text-[10px] text-gray-400 font-black uppercase text-right tracking-[0.2em]"></p>
    </div>

    <div id="statusMessage" class="hidden mt-6 px-4 py-3 rounded-xl text-sm font-bold text-center border shadow-sm transition-all duration-300"></div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });
  </script>
</body>
</html>
