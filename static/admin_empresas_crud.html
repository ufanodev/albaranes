<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Empresa - Panel Maestro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/security.js"></script>
    <script src="/js/admin_empresas_crud.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pastel': '#FFDAB9', 
                        'primary-link': '#FF8C00',  
                        'black-pure': '#000000',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        @layer components {
            body { font-family: 'Inter', sans-serif; @apply bg-slate-50 p-4 sm:p-8; }
            .card { @apply bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100 max-w-5xl mx-auto; }
            .input-field { @apply w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl shadow-inner outline-none transition-all duration-200 text-slate-800 text-sm font-semibold; }
            .input-field:focus { @apply bg-white border-primary-link ring-4 ring-orange-100 shadow-none; }
            .label-style { @apply block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1 tracking-widest; }
            .section-title { @apply text-xs font-black text-slate-300 uppercase tracking-[0.2em] border-b pb-2 mb-6 mt-8 flex items-center gap-2; }
            
            .switch { @apply relative inline-block w-14 h-7; }
            .switch input { @apply opacity-0 w-0 h-0; }
            .slider { @apply absolute cursor-pointer inset-0 bg-slate-200 transition-all duration-300 rounded-full; }
            .slider:before { @apply absolute content-[''] h-5 w-5 left-1 bottom-1 bg-white transition-all duration-300 rounded-full shadow-md; }
            input:checked + .slider { @apply bg-green-500; }
            input:checked + .slider:before { @apply translate-x-7; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="bg-slate-900 -m-6 mb-10 p-8 rounded-t-[2rem] flex justify-between items-center border-b border-slate-800">
            <div class="flex items-center gap-4">
                <div class="bg-primary-link p-3 rounded-2xl shadow-lg text-white">
                    <i data-lucide="building-2" class="w-8 h-8"></i>
                </div>
                <div>
                    <h1 id="mainTitle" class="text-2xl font-black text-white uppercase tracking-tighter leading-none">Editor de Empresa</h1>
                    <span class="text-[9px] font-bold text-orange-400 uppercase tracking-widest opacity-80">Ficha técnica de cliente</span>
                </div>
            </div>
            <button onclick="window.location.href='/admin/empresas'" 
                    class="bg-white/10 text-white px-6 py-2.5 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-white/20 transition flex items-center gap-2 backdrop-blur-md">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver
            </button>
        </div>

        <form id="empresaForm" onsubmit="handleFormSubmit(event)" class="space-y-8">
            <input type="hidden" id="empresaId" name="empresaId" value="">
            <input type="hidden" id="currentMode" name="currentMode" value="create">

            <div class="bg-slate-50 p-6 rounded-3xl border border-slate-200 flex items-center justify-between">
                <div>
                    <h3 class="text-sm font-black text-slate-800 uppercase tracking-tight">Estado de Facturación</h3>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Habilitar o suspender servicios</p>
                </div>
                <div class="flex items-center gap-3">
                    <label class="switch">
                        <input type="checkbox" id="estado" name="estado" checked>
                        <span class="slider"></span>
                    </label>
                    <span id="estadoTexto" class="text-[10px] font-black text-green-600 uppercase tracking-widest">Activa</span>
                </div>
            </div>

            <div class="section-title"><i data-lucide="id-card" class="w-4 h-4 text-primary-link"></i> Datos Legales</div>
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                <div class="md:col-span-4">
                    <label class="label-style">NIF / CIF *</label>
                    <input type="text" id="nif" name="nif" required placeholder="A12345678" class="input-field uppercase font-black">
                </div>
                <div class="md:col-span-8">
                    <label class="label-style">Razón Social *</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Nombre fiscal de la empresa" class="input-field">
                </div>
            </div>

            <div class="section-title"><i data-lucide="map-pin" class="w-4 h-4 text-primary-link"></i> Ubicación</div>
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                <div class="md:col-span-8">
                    <label class="label-style">Dirección Fiscal</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Calle, número, oficina..." class="input-field">
                </div>
                <div class="md:col-span-4">
                    <label class="label-style">Población / Localidad</label>
                    <input type="text" id="poblacion" name="poblacion" placeholder="Ej: Valencia" class="input-field uppercase">
                </div>
            </div>

            <div class="section-title"><i data-lucide="contact" class="w-4 h-4 text-primary-link"></i> Contacto</div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="label-style">Teléfono Principal</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="9XXXXXXXX" class="input-field">
                </div>
                <div class="md:col-span-2">
                    <label class="label-style">Email de Facturación</label>
                    <input type="email" id="email" name="email" placeholder="administracion@empresa.com" class="input-field">
                </div>
            </div>

            <div class="pt-10 flex flex-col items-center border-t border-slate-100 gap-6">
                <button type="submit" id="submitBtn"
                    class="bg-slate-900 text-white font-black py-5 px-24 rounded-3xl shadow-2xl hover:bg-primary-link transform transition-all hover:scale-105 active:scale-95 flex items-center gap-4 text-lg uppercase tracking-[0.2em]">
                    <i data-lucide="save" class="w-6 h-6"></i> Guardar Empresa
                </button>
                <div id="statusMessage" class="hidden w-full p-4 rounded-2xl text-center font-bold text-xs uppercase tracking-widest border-2"></div>
            </div>
        </form>
    </div>

    <script>
        window.addEventListener('load', () => { if (window.lucide) lucide.createIcons(); });
    </script>
</body>
</html>
