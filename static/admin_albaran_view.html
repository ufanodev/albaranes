<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizar Albarán - Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/security.js"></script>
    <script src="/js/admin_albaran_cargar.js" defer></script>
    <script src="/js/admin_albaran_view.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        'primary-pastel': '#FFDAB9', 
                        'primary-link': '#FF8C00' 
                    } 
                } 
            } 
        }
    </script>
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        @layer base {
            body { font-family: 'Inter', sans-serif; @apply bg-slate-50 text-slate-900; }
        }
        @layer components {
            .input-field { @apply w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl shadow-inner outline-none transition-all duration-200 text-gray-800 text-sm; }
            .input-view { @apply bg-slate-100 border-slate-200 cursor-default font-bold text-slate-500 shadow-none outline-none ring-0; }
            .label-style { @apply block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1 tracking-tighter; }
            .checkbox-inline-view { @apply flex items-center space-x-2 bg-slate-100 px-3 py-2 rounded-lg border border-slate-200 opacity-80 h-full; }
            .section-title { @apply text-xl font-bold text-slate-700 mb-4 border-b-2 border-orange-100 pb-2 mt-8 uppercase tracking-widest flex items-center gap-2; }
            .badge-status { @apply px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest border-2 shadow-sm flex items-center gap-2; }
        }
    </style>
</head>
<body class="p-4 sm:p-8 lg:p-12">

    <div class="max-w-7xl mx-auto bg-white shadow-2xl rounded-[2.5rem] overflow-hidden border border-slate-100">
        
        <div class="bg-gradient-to-r from-slate-200 to-slate-100 p-8 flex justify-between items-center border-b border-slate-300">
            <div>
                <h1 class="text-3xl font-black text-slate-800 flex items-center tracking-tighter uppercase">
                    <i data-lucide="eye" class="mr-3 text-slate-500 w-8 h-8"></i> 
                    DETALLE REGISTRO <span id="header_num" class="text-primary-link ml-2"></span>
                </h1>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1 opacity-70">Consulta de Albarán Maestro (Modo Lectura)</p>
            </div>
            <div class="flex gap-2">
                <button id="btn_edit_direct" class="bg-primary-link text-white px-6 py-2.5 rounded-2xl font-bold hover:bg-orange-600 transition flex items-center shadow-lg text-xs tracking-widest uppercase">
                    <i data-lucide="pencil" class="w-4 h-4 mr-2"></i> Ir a Editar
                </button>
                <button onclick="window.location.href='/admin'" class="bg-slate-800 text-white px-6 py-2.5 rounded-2xl font-bold hover:bg-black transition flex items-center shadow-lg text-xs tracking-widest uppercase">
                    <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Volver al Panel
                </button>
            </div>
        </div>

        <form id="albaranForm" class="p-6 md:p-12 space-y-8">

            <!-- SECCIÓN 1: Datos de Control -->
            <div>
                <div class="section-title !mt-0"><i data-lucide="shield-check" class="w-5 h-5 text-primary-link"></i> Datos de Control</div>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                    <div class="md:col-span-2">
                        <label class="label-style">Licencia Titular</label>
                        <input type="text" id="licencia_ref" name="licencia_ref" readonly class="input-field input-view text-blue-600">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style">Nº Albarán</label>
                        <input type="text" name="numero_albaran" id="n_albaran" readonly class="input-field input-view text-primary-link">
                    </div>
                    <div class="md:col-span-3">
                        <label class="label-style">Fecha Servicio</label>
                        <input type="text" name="fecha" id="fecha" readonly class="input-field input-view">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style">Hora Inicio</label>
                        <input type="text" name="hora_ini" id="hora_ini" readonly class="input-field input-view">
                    </div>
                    <div class="md:col-span-3">
                        <label class="label-style">Hora Fin</label>
                        <input type="text" name="hora_fin" id="hora_fin" readonly class="input-field input-view">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 2: Detalles de Facturación -->
            <div>
                <div class="section-title"><i data-lucide="users" class="w-5 h-5 text-primary-link"></i> Detalles de Facturación</div>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                    <div class="md:col-span-3">
                        <label class="label-style">Empresa Asociada</label>
                        <input type="text" id="empresa_nombre_view" readonly class="input-field input-view">
                        <select id="empresa_ref" name="empresa_ref" class="hidden"></select>
                    </div>
                    <div class="md:col-span-3">
                        <label class="label-style">Pasajero / Cliente</label>
                        <input type="text" name="nombre_pasajero" id="nombre_pasajero" readonly class="input-field input-view">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style">Teléfono</label>
                        <input type="text" name="tlf_pasajero" id="tlf_pasajero" readonly class="input-field input-view">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style">DNI Pasajero</label>
                        <input type="text" name="dni_pasajero" id="dni_pasajero" readonly class="input-field input-view uppercase">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style">Matrícula</label>
                        <input type="text" name="matricula" id="matricula" readonly class="input-field input-view uppercase">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 3: Itinerario del Viaje -->
            <div>
                <div class="section-title"><i data-lucide="map-pinned" class="w-5 h-5 text-primary-link"></i> Itinerario del Viaje</div>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                    <div class="md:col-span-4">
                        <label class="label-style">Origen</label>
                        <input type="text" name="origen" id="origen" readonly class="input-field input-view">
                    </div>
                    <div class="md:col-span-4">
                        <label class="label-style">Parada / Vía</label>
                        <input type="text" name="parada" id="parada" readonly class="input-field input-view">
                    </div>
                    <div class="md:col-span-4">
                        <label class="label-style">Destino</label>
                        <input type="text" name="destino" id="destino" readonly class="input-field input-view">
                    </div>
                    <div class="md:col-span-3">
                        <label class="label-style">Referencia Expediente</label>
                        <input type="text" name="referencia" id="referencia" readonly class="input-field input-view font-black uppercase">
                    </div>
                    <div class="md:col-span-3">
                        <label class="label-style">Espera Inicio</label>
                        <input type="text" name="espera_ini" id="espera_ini" readonly class="input-field input-view">
                    </div>
                    <div class="md:col-span-3">
                        <label class="label-style">Espera Fin</label>
                        <input type="text" name="espera_fin" id="espera_fin" readonly class="input-field input-view">
                    </div>
                    <div class="md:col-span-3">
                        <label class="label-style text-orange-600">Espera Total (min)</label>
                        <input type="text" name="hora_total" id="hora_total" readonly class="input-field input-view text-right text-orange-600">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 4: Kilometraje -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 bg-slate-50 p-6 rounded-[2rem] border border-slate-200 shadow-inner">
                <div class="md:col-span-2">
                    <label class="label-style">Km Inicio</label>
                    <input type="text" id="km_ini" readonly class="input-field input-view">
                </div>
                <div class="md:col-span-2">
                    <label class="label-style">Km Fin</label>
                    <input type="text" id="km_fin" readonly class="input-field input-view">
                </div>
                <div class="md:col-span-2">
                    <label class="label-style">Km Totales</label>
                    <input type="text" id="km_totales" readonly class="input-field bg-white border-slate-300 font-black text-right text-slate-700">
                </div>
                <div class="md:col-span-6 flex flex-wrap gap-2">
                    <div class="checkbox-inline-view flex-1"><i data-lucide="check-circle-2" class="w-3 h-3 text-slate-400"></i> <span id="urbano_val" class="text-[9px] font-bold uppercase">Urbano</span></div>
                    <div class="checkbox-inline-view flex-1"><i data-lucide="check-circle-2" class="w-3 h-3 text-slate-400"></i> <span id="diurno_val" class="text-[9px] font-bold uppercase">Diurno</span></div>
                    <div class="checkbox-inline-view flex-1"><i data-lucide="check-circle-2" class="w-3 h-3 text-slate-400"></i> <span id="noct_fest_val" class="text-[9px] font-bold uppercase">Noche/Fest.</span></div>
                    <div class="checkbox-inline-view flex-1"><i data-lucide="check-circle-2" class="w-3 h-3 text-slate-400"></i> <span id="remolque_val" class="text-[9px] font-bold uppercase">Remolque</span></div>
                </div>
            </div>

            <!-- SECCIÓN 5: Economía y Conductor -->
            <div>
                <div class="section-title"><i data-lucide="banknote" class="w-5 h-5 text-primary-link"></i> Economía y Conductor</div>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                    <div class="md:col-span-3">
                        <label class="label-style">Nombre Conductor</label>
                        <input type="text" name="asalariado" id="asalariado" readonly class="input-field input-view uppercase">
                    </div>
                    <div class="md:col-span-3">
                        <label class="label-style">Autorizado Por</label>
                        <input type="text" name="autorizado_por" id="autorizado_por" readonly class="input-field input-view uppercase">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style text-orange-600">Suplidos (€)</label>
                        <input type="text" id="importe_suplidos" readonly class="input-field input-view text-right">
                    </div>
                    <div class="md:col-span-4 bg-slate-900 p-4 rounded-3xl border-4 border-primary-pastel shadow-2xl">
                        <label class="block text-[9px] font-black text-primary-pastel uppercase mb-1 text-center tracking-tighter">Importe Total Liquidado</label>
                        <div class="flex items-center justify-center">
                            <span class="text-2xl font-black text-white mr-2">€</span>
                            <span id="importe_total_view" class="font-black text-4xl text-primary-link">0.00</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 6: Estado Administrativo -->
            <div class="p-8 bg-blue-50 rounded-[2.5rem] border border-blue-200 shadow-lg space-y-5">
                <h3 class="text-blue-800 font-black uppercase text-xs tracking-[0.2em] flex items-center gap-2">
                    <i data-lucide="file-text" class="w-4 h-4"></i> Estado Administrativo
                </h3>

                <!-- Nº Factura -->
                <div class="max-w-sm">
                    <label class="label-style text-blue-400">Nº Factura Asignada</label>
                    <div class="input-field input-view bg-white border-blue-200 font-black" id="num_factura_view">—</div>
                </div>

                <!-- Fila: Cobrado + Fecha | Pagado + Fecha | Finalizado -->
                <div class="flex flex-wrap items-end gap-4 pt-4 border-t border-blue-100">

                    <!-- Cobrado -->
                    <div class="shrink-0">
                        <div id="badge_cobrado" class="badge-status border-slate-200 bg-slate-100 text-slate-400">
                            <i data-lucide="circle" class="w-4 h-4"></i> Cobrado (Empresa)
                        </div>
                    </div>
                    <div class="w-44 shrink-0">
                        <label class="label-style text-blue-400">Fecha de Cobro</label>
                        <div class="input-field input-view bg-white border-blue-200 font-black" id="fecha_cobro_view">—</div>
                    </div>

                    <!-- Pagado -->
                    <div class="shrink-0">
                        <div id="badge_pagado" class="badge-status border-slate-200 bg-slate-100 text-slate-400">
                            <i data-lucide="circle" class="w-4 h-4"></i> Pagado (Conductor)
                        </div>
                    </div>
                    <div class="w-44 shrink-0">
                        <label class="label-style text-green-500">Fecha de Pago</label>
                        <div class="input-field input-view bg-white border-green-200 font-black" id="fecha_pago_view">—</div>
                    </div>

                    <!-- Finalizado -->
                    <div class="shrink-0">
                        <div id="badge_finalizado" class="badge-status border-slate-200 bg-slate-100 text-slate-400">
                            <i data-lucide="circle" class="w-4 h-4"></i> Servicio Cerrado
                        </div>
                    </div>

                </div>
            </div>

            <!-- Observaciones -->
            <div class="w-full">
                <label class="label-style tracking-widest text-slate-500 mb-2 block uppercase">Observaciones Registradas</label>
                <div id="observaciones_view" class="input-field input-view min-h-[100px] italic p-6 text-sm"></div>
            </div>

        </form>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
