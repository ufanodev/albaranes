<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva Contraseña - Albaranes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { 'primary-pastel': '#FFDAB9', 'primary-link': '#FF8C00' } }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-sm w-full bg-white p-8 rounded-xl shadow-lg border border-primary-pastel">
        <h1 class="text-2xl font-bold text-center mb-6">🔒 Restablecer Clave</h1>
        
        <form id="resetForm">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Tu Correo Electrónico</label>
                <input type="email" id="email" required placeholder="ejemplo@email.com"
                       class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-primary-pastel outline-none" />
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Código de Seguridad (6 dígitos)</label>
                <input type="text" id="code" required maxlength="6" placeholder="000000"
                       class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-primary-pastel outline-none text-center text-xl tracking-widest font-bold" />
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Nueva Contraseña</label>
                <input type="password" id="password" required minlength="6"
                       class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-primary-pastel outline-none" />
            </div>
            
            <button type="submit" id="btnCambiar"
                    class="w-full py-3 bg-primary-pastel font-bold rounded-lg hover:bg-orange-200 transition shadow-md">
                Actualizar Contraseña
            </button>

            <div id="statusMessage" class="hidden text-center mt-4 p-3 rounded-md font-medium text-sm"></div>

            <div class="text-center mt-6">
                <a href="/login" class="text-sm font-medium text-primary-link hover:underline">Volver al inicio</a>
            </div>
        </form>
    </div>

    <script src="/js/resetpwd.js"></script>
</body>
</html>
