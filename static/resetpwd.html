<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva Contraseña - Albaranes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { 'primary-pastel': '#FFDAB9' } }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-sm w-full bg-white p-8 rounded-xl shadow-lg border border-primary-pastel">
        <h1 class="text-2xl font-bold text-center mb-6">🔒 Nueva Contraseña</h1>
        
        <form id="resetForm">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Nueva Contraseña</label>
                <input type="password" id="password" required minlength="6"
                       class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-primary-pastel outline-none" />
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium mb-1">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" required minlength="6"
                       class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-primary-pastel outline-none" />
            </div>
            
            <button type="submit" id="btnCambiar"
                    class="w-full py-3 bg-primary-pastel font-bold rounded-lg hover:bg-orange-200 transition">
                Actualizar Contraseña
            </button>

            <div id="statusMessage" class="hidden text-center mt-4 p-3 rounded-md font-medium"></div>
        </form>
    </div>

    <script src="/js/resetpwd.js"></script>
</body>
</html>
