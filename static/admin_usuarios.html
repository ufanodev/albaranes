<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Usuarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/security.js"></script>
    <script src="/js/utils.js"></script>
    
    <style>
        /* 🎨 Configuración de Fuente y Estilos Base */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f9; /* Fondo suave */
            color: #1f2937; /* Texto oscuro */
            line-height: 1.6;
        }

        /* 🧩 INPUTS Y FORMULARIOS */
        .input-field {
            @apply w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-800
                   transition duration-150 ease-in-out text-base shadow-sm;
        }

        .input-field:focus {
            /* Foco estandarizado: Color Principal (Violeta) */
            @apply outline-none border-violet-500 ring-2 ring-violet-300;
        }

        /* 🏷️ TÍTULOS DE SECCIÓN */
        .section-title {
            @apply text-xl font-bold text-violet-700 mb-4 border-b-2 border-violet-200 pb-2 mt-8;
        }
        
        /* 🎛️ BOTONES GENERALES (Usamos Violeta como color principal) */
        .action-button {
            @apply inline-flex items-center justify-center font-semibold py-2.5 px-6 rounded-lg 
                   shadow-md cursor-pointer transition duration-300 transform text-white focus:outline-none 
                   hover:scale-[1.02] focus:ring-4 text-sm;
        }
        
        /* Botones específicos */
        .btn-crear {
            @apply bg-violet-600 hover:bg-violet-700 focus:ring-violet-300 shadow-violet-400/50;
        }

        .btn-modificar {
            /* Color de Edición: Indigo/Blue */
            @apply bg-indigo-600 hover:bg-indigo-700 focus:ring-indigo-300 shadow-indigo-400/50;
        }

        .btn-borrar {
            /* Color Peligro: Red */
            @apply bg-red-600 hover:bg-red-700 focus:ring-red-300 shadow-red-400/50;
        }

        .btn-volver {
            /* Color Gris Neutral */
            @apply bg-gray-500 hover:bg-gray-600 focus:ring-gray-300 shadow-gray-400/50;
        }

        /* 💬 MENSAJES DE ESTADO */
        .status-message {
            @apply mt-6 p-4 text-center font-medium rounded-lg;
        }

        .status-success { @apply bg-green-100 text-green-800 border border-green-300; }
        .status-error { @apply bg-red-100 text-red-800 border border-red-300; }
        .status-info { @apply bg-blue-100 text-blue-800 border border-blue-300; }
    </style>
</head>
<body class="p-4 sm:p-8 lg:p-12">

    <div class="max-w-3xl mx-auto bg-white shadow-2xl rounded-xl p-6 md:p-10">
        <h1 class="text-3xl font-extrabold text-violet-800 text-center mb-8 border-b pb-3">
            Administración de Usuarios 🔐
        </h1>

        <form id="usuarioForm" onsubmit="handleAction('crear', event)">

            <div class="section-title !mt-0">Credenciales</div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>
                    <label for="id" class="block text-sm font-medium text-gray-600 mb-1">
                        ID
                    </label>
                    <input type="text" id="id" name="id"
                               value=""
                               placeholder="ID del usuario (Ej: 150)"
                               class="input-field bg-gray-100 text-gray-500" readonly>
                    <p class="text-xs text-gray-400 mt-1">El ID se asigna automáticamente al crear.</p>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-600 mb-1">
                        EMAIL *
                    </label>
                    <input type="email" id="email" name="email" required
                               placeholder="usuario@ejemplo.com"
                               class="input-field">
                </div>
            </div>

            <div class="mt-6">
                <label for="password" class="block text-sm font-medium text-gray-600 mb-1">
                    PASSWORD *
                </label>
                <input type="password" id="password" name="password" required
                           placeholder="Mínimo 8 caracteres"
                           class="input-field">
            </div>


            <div class="mt-10 pt-6 border-t border-gray-200 flex flex-wrap justify-center gap-4">
                
                <button type="submit"
                        class="action-button btn-crear">
                    <span class="mr-2">💾</span> Guardar Usuario (Crear)
                </button>

                <button type="button" onclick="handleAction('modificar')"
                        class="action-button btn-modificar">
                    <span class="mr-2">✏️</span> Modificar
                </button>

                <button type="button" onclick="handleAction('borrar')"
                        class="action-button btn-borrar">
                    <span class="mr-2">🗑️</span> Borrar
                </button>
                
                <button type="button" onclick="handleAction('volver')"
                        class="action-button btn-volver">
                    <span class="mr-2">🔙</span> Volver
                </button>
            </div>
            
            <div id="statusMessage" class="hidden status-message" role="alert"></div>

        </form>
    </div>

    <script>
        // Función central para manejar todas las acciones de los botones
        function handleAction(actionType, event = null) {
            const statusMessage = document.getElementById('statusMessage');
            
            // Ocultar y limpiar mensaje de estado anterior
            statusMessage.classList.add('hidden');
            statusMessage.classList.remove('status-success', 'status-error', 'status-info');

            switch (actionType) {
                case 'crear':
                    if (event) {
                        event.preventDefault(); // Previene el envío por defecto del formulario
                    }
                    const form = document.getElementById('usuarioForm');
                    const data = {};

                    // Recoger datos
                    new FormData(form).forEach((value, key) => {
                        data[key] = value;
                    });
                    
                    // Simulación de validación simple
                    if (!document.getElementById('email').value || !document.getElementById('password').value) {
                        statusMessage.textContent = '❌ Error: EMAIL y PASSWORD son obligatorios.';
                        statusMessage.classList.add('status-error');
                        statusMessage.classList.remove('hidden');
                        return;
                    }

                    statusMessage.textContent = '✅ ¡CREACIÓN exitosa simulada! El usuario se guardaría en el backend.';
                    statusMessage.classList.add('status-success');
                    statusMessage.classList.remove('hidden');

                    console.log("--- DATOS DEL USUARIO A ENVIAR/GUARDAR ---");
                    console.log(JSON.stringify(data, null, 2));
                    break;
                
                case 'modificar':
                    statusMessage.textContent = '✏️ Simulación: Los datos del usuario se modificarían en el sistema.';
                    statusMessage.classList.add('status-info'); 
                    statusMessage.classList.remove('hidden');
                    break;
                
                case 'borrar':
                    if (confirm('⚠️ ¿Está seguro que desea borrar este Usuario? Esta acción es irreversible.')) {
                        statusMessage.textContent = '🗑️ Simulación: El Usuario se borraría del sistema.';
                        statusMessage.classList.add('status-error'); 
                        statusMessage.classList.remove('hidden');
                    }
                    break;
                
                case 'volver':
                    // Redirige al usuario a la página 'admin.html'
                    window.location.href = 'admin.html';
                    return; 
                default:
                    return;
            }
        }
    </script>
</body>
</html>
