<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Modificar Albarán - Panel Titular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/security.js"></script>
    <script src="/js/albaran_cargar.js"></script>
    <script src="/js/albaran_update.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'primary-pastel': '#FFDAB9', 'primary-link': '#FF8C00' } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .input-field { @apply w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl shadow-inner outline-none transition-all duration-200 text-gray-800; }
        .input-field:focus { @apply bg-white border-primary-link ring-4 ring-orange-100 shadow-none; }
        .readonly-field { @apply bg-slate-200 text-slate-500 cursor-not-allowed border-slate-300 shadow-none font-bold opacity-75; }
        .section-title { @apply text-lg font-black text-slate-700 mb-6 border-b-4 border-primary-pastel pb-2 flex items-center mt-10 uppercase tracking-tighter; }
        .checkbox-inline { @apply flex items-center space-x-2 bg-slate-50 px-3 py-2 rounded-lg shadow-inner border border-slate-200 hover:bg-white transition cursor-pointer; }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="max-w-6xl mx-auto bg-white shadow-2xl rounded-[2rem] overflow-hidden border border-slate-100">
        <div class="bg-primary-pastel p-6 flex justify-between items-center border-b border-orange-200">
            <div>
                <h1 class="text-2xl font-black text-slate-800 flex items-center">
                    <i data-lucide="edit-3" class="mr-3 text-primary-link"></i> MODIFICAR ALBARÁN
                </h1>
                <span id="loadingIndicator" class="text-[10px] font-black animate-pulse text-primary-link uppercase">Cargando datos...</span>
            </div>
            <button onclick="window.history.back()" class="bg-slate-800 text-white px-5 py-2 rounded-xl font-bold hover:bg-black transition flex items-center shadow-lg active:scale-95">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> VOLVER
            </button>
        </div>

        <form id="albaranForm" class="p-6 md:p-10" onsubmit="handleAction('modificar', event)">
            <div class="section-title !mt-0 text-slate-800">Identificación y Trayecto</div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div><label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Nº Albarán</label>
                    <input type="text" name="numero_albaran" id="n_albaran" readonly class="input-field readonly-field"></div>
                <div><label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Fecha</label>
                    <input type="date" name="fecha" id="fecha" class="input-field"></div>
                <div><label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Licencia Ref</label>
                    <input type="text" id="licencia" name="licencia_ref" readonly class="input-field readonly-field"></div>
                <div><label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Empresa *</label>
                    <select id="empresa" name="empresa_ref" required class="input-field"></select></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div><label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Referencia</label>
                    <input type="text" name="referencia" id="referencia" class="input-field"></div>
                <div><label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Conductor</label>
                    <select id="asalariado_select" name="asalariado" class="input-field"></select></div>
                <div class="flex items-end gap-2">
                    <label class="checkbox-inline flex-1"><input type="checkbox" id="festivo" name="festivo"> <span class="text-[10px] font-black uppercase">Festivo</span></label>
                    <label class="checkbox-inline flex-1"><input type="checkbox" id="finalizado" name="finalizado"> <span class="text-[10px] font-black uppercase">Finalizado</span></label>
                </div>
            </div>

            <div class="mb-6"><label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Cliente</label>
                <input type="text" name="cliente" id="cliente" class="input-field"></div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <div><label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Origen</label>
                    <textarea name="origen" id="origen" rows="1" class="input-field resize-none"></textarea></div>
                <div><label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Destino</label>
                    <textarea name="destino" id="destino" rows="1" class="input-field resize-none"></textarea></div>
                <div><label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Parada</label>
                    <input type="text" name="parada" id="parada" class="input-field"></div>
            </div>

            <div class="section-title text-slate-800">Tarifas y Datos Técnicos</div>
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-8 items-end">
                <div class="lg:col-span-6 flex gap-2">
                    <label class="checkbox-inline flex-1"><input type="checkbox" id="urbano" name="urbano"> <span class="text-[10px] font-bold">Urbano</span></label>
                    <label class="checkbox-inline flex-1"><input type="checkbox" id="diurno" name="diurno"> <span class="text-[10px] font-bold">Diurno</span></label>
                    <label class="checkbox-inline flex-1"><input type="checkbox" id="noct_fest" name="noct_fest"> <span class="text-[10px] font-bold">Noct/Fest</span></label>
                </div>
                <div class="lg:col-span-3">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">DNI Pasajero</label>
                    <input type="text" name="dni_pasajero" id="dni_pasajero" class="input-field uppercase"></div>
                <div class="lg:col-span-3">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Matrícula</label>
                    <input type="text" name="matricula" id="matricula" class="input-field uppercase"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 bg-slate-100 p-4 rounded-2xl shadow-inner">
                <div><label class="block text-[10px] font-black text-slate-500 mb-1">Km Totales</label>
                    <input type="number" step="0.01" name="km_totales" id="km_totales" class="input-field text-right font-black"></div>
                <div><label class="block text-[10px] font-black text-slate-500 mb-1">Km Nacionales</label>
                    <input type="number" step="0.01" name="km_nacionales" id="km_nacionales" class="input-field text-right"></div>
                <div><label class="block text-[10px] font-black text-slate-500 mb-1">Km Internac.</label>
                    <input type="number" step="0.01" name="km_internacionales" id="km_internacionales" class="input-field text-right"></div>
            </div>

            <div class="section-title text-slate-800">Liquidación e Importes</div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div><label class="block text-[10px] font-black text-slate-400 mb-1">Hora Recogida</label>
                    <input type="time" name="hora" id="hora" class="input-field"></div>
                <div><label class="block text-[10px] font-black text-slate-400 mb-1">Espera</label>
                    <input type="time" name="tiempo_espera" id="tiempo_espera" class="input-field"></div>
                <div><label class="block text-[10px] font-black text-slate-400 mb-1">Nº Plazas</label>
                    <input type="number" name="num_plazas" id="num_plazas" class="input-field text-center font-bold"></div>
                <div class="flex items-center pt-4">
                    <label class="checkbox-inline w-full"><input type="checkbox" id="enganche" name="enganche"> <span class="text-[10px] font-black uppercase">Enganche</span></label>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 items-end">
                <div><label class="block text-[10px] font-black text-orange-600 uppercase mb-1">Suplidos (€)</label>
                    <input type="number" step="0.01" name="importe_suplidos" id="importe_suplidos" class="input-field text-right bg-orange-50 font-bold"></div>
                <div><label class="block text-[10px] font-black text-slate-400 mb-1">Autorizado Por</label>
                    <input type="text" name="autorizado_por" id="autorizado_por" class="input-field"></div>
                <div class="bg-slate-900 p-4 rounded-2xl border-4 border-primary-pastel">
                    <label class="block text-[10px] font-black text-primary-pastel mb-1 text-center">Total</label>
                    <div class="flex items-center justify-center">
                        <span class="text-xl font-black text-white mr-2">€</span>
                        <input type="number" step="0.01" name="importe_total" id="importe_total" required class="bg-transparent border-none w-full text-right font-black text-3xl text-primary-link focus:ring-0">
                    </div>
                </div>
            </div>

            <div class="w-full mt-8">
                <label class="block text-[11px] font-black text-slate-400 uppercase mb-2 ml-1">Observaciones</label>
                <textarea name="observaciones" id="observaciones" rows="4" class="input-field italic w-full resize-none p-4"></textarea>
                <div class="flex justify-end mt-2"><p id="wordCount" class="text-[10px] font-black text-slate-400 bg-slate-100 px-3 py-1 rounded-full shadow-inner border border-slate-200">0 palabras</p></div>
            </div>

            <div class="mt-10 flex justify-center">
                <button type="submit" class="bg-primary-link text-white font-black py-4 px-16 rounded-2xl shadow-2xl hover:bg-slate-800 transition-all active:scale-95 flex items-center gap-3 text-lg">
                    <i data-lucide="save" class="w-6 h-6"></i> GUARDAR CAMBIOS
                </button>
            </div>
            <div id="statusMessage" class="hidden mt-6 p-4 rounded-lg text-center font-bold"></div>
        </form>
    </div>
</body>
</html>
