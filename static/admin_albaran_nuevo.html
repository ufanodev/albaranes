<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo Albarán Maestro - Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/security.js"></script>
    <script src="/js/admin_albaran_nuevo.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        'primary-pastel': '#FFDAB9', 
                        'primary-link': '#FF8C00' 
                    } 
                } 
            } 
        }
    </script>
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        @layer base {
            body { font-family: 'Inter', sans-serif; @apply bg-slate-50 text-slate-900; }
        }
        @layer components {
            .input-field { @apply w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl shadow-inner outline-none transition-all duration-200 text-gray-800 text-sm font-bold; }
            .input-field:focus { @apply bg-white border-primary-link ring-4 ring-orange-100 shadow-none; }
            .label-style { @apply block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1 tracking-tighter; }
            .checkbox-inline { @apply flex items-center space-x-2 bg-slate-100 px-3 py-2 rounded-lg shadow-inner border border-slate-200 hover:bg-white transition cursor-pointer h-full; }
            .section-header { @apply text-[11px] font-black text-slate-300 uppercase tracking-[0.2em] border-b border-slate-100 pb-2 mb-4 flex items-center gap-2; }
            .input-dark { @apply bg-transparent border-none text-right font-black text-primary-link outline-none focus:ring-0 p-0; }
        }
    </style>
</head>
<body class="p-4 sm:p-8 lg:p-12">

    <div class="max-w-7xl mx-auto bg-white shadow-2xl rounded-[2.5rem] overflow-hidden border border-slate-100">
        
        <div class="bg-gradient-to-r from-primary-pastel to-orange-100 p-8 flex justify-between items-center border-b border-orange-200">
            <div>
                <h1 class="text-3xl font-black text-slate-800 flex items-center tracking-tighter italic">
                    <i data-lucide="file-plus-2" class="mr-3 text-primary-link w-8 h-8"></i> 
                    GESTIÓN ADMIN <span class="text-primary-link ml-2">ALBARÁN</span>
                </h1>
                <p class="text-[10px] font-bold text-orange-700 uppercase tracking-widest mt-1 opacity-70">Módulo de Inserción Administrativa Rápida</p>
            </div>
            <button onclick="window.location.href='/admin'" class="bg-slate-800 text-white px-6 py-2.5 rounded-2xl font-bold hover:bg-black transition flex items-center shadow-lg text-xs tracking-widest uppercase">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Volver al Panel
            </button>
        </div>

        <form id="albaranForm" class="p-6 md:p-10 space-y-8" onsubmit="handleAction('crear', event)">
            
            <div class="space-y-4">
                <h2 class="section-header">1. Identificación del Servicio</h2>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                    <div class="md:col-span-2">
                        <label class="label-style text-orange-600">Licencia Titular *</label>
                        <select id="licencia_ref" name="licencia_ref" required class="input-field font-bold text-blue-600 border-orange-300 bg-orange-50/30"></select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style text-orange-600">Nº Albarán *</label>
                        <input type="text" name="numero_albaran" id="n_albaran" required class="input-field font-black text-primary-link uppercase border-orange-300 bg-orange-50/30" placeholder="000-0000">
                    </div>
                    <div class="md:col-span-4">
                        <label class="label-style">Referencia / Expediente</label>
                        <input type="text" name="referencia" class="input-field font-bold uppercase" placeholder="EJ: REF-999888">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style text-orange-600">Fecha *</label>
                        <input type="date" name="fecha" id="fecha" required class="input-field border-orange-300 bg-orange-50/30">
                    </div>
                    <div class="md:col-span-1">
                        <label class="label-style text-primary-link font-black">Hora Ini *</label>
                        <input type="time" name="hora_ini" required class="input-field">
                    </div>
                    <div class="md:col-span-1">
                        <label class="label-style">Hora Fin</label>
                        <input type="time" name="hora_fin" class="input-field">
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="section-header">2. Cliente y Pasajero</h2>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                    <div class="md:col-span-3">
                        <label class="label-style text-orange-600">Empresa Cliente *</label>
                        <select id="empresa_ref" name="empresa_ref" required class="input-field font-semibold border-orange-300 bg-orange-50/30"></select>
                    </div>
                    <div class="md:col-span-3">
                        <label class="label-style">Nombre Pasajero</label>
                        <input type="text" name="nombre_pasajero" class="input-field" placeholder="Nombre completo">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style">Teléfono</label>
                        <input type="text" name="tlf_pasajero" class="input-field" placeholder="Móvil">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style">DNI Pasajero</label>
                        <input type="text" name="dni_pasajero" class="input-field uppercase" placeholder="DNI/NIE">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style">Matrícula</label>
                        <input type="text" name="matricula" maxlength="15" class="input-field font-bold uppercase" placeholder="PLACA">
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="section-header">3. Ruta y Tiempos de Espera</h2>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                    <div class="md:col-span-4">
                        <label class="label-style">Origen</label>
                        <input type="text" name="origen" class="input-field" placeholder="Lugar de recogida">
                    </div>
                    <div class="md:col-span-4">
                        <label class="label-style">Parada / Vía</label>
                        <input type="text" name="parada" class="input-field" placeholder="Punto intermedio">
                    </div>
                    <div class="md:col-span-4">
                        <label class="label-style">Destino</label>
                        <input type="text" name="destino" class="input-field" placeholder="Lugar de llegada">
                    </div>
                    <div class="md:col-span-4">
                        <label class="label-style text-orange-600">Espera Total (HH.mm)</label>
                        <input type="text" inputmode="decimal" name="hora_total" class="input-field font-bold text-orange-600" placeholder="0.00">
                    </div>
                    <div class="md:col-span-4">
                        <label class="label-style">Espera Inicio</label>
                        <input type="time" name="espera_ini" class="input-field">
                    </div>
                    <div class="md:col-span-4">
                        <label class="label-style">Espera Fin</label>
                        <input type="time" name="espera_fin" class="input-field">
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="section-header">4. Control de Kilometraje y Tipo Servicio</h2>
                <div class="bg-slate-50 p-6 rounded-3xl border border-slate-200 space-y-4 shadow-inner">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <label class="checkbox-inline">
                            <input type="checkbox" name="urbano" class="w-4 h-4 text-orange-500">
                            <span class="text-[10px] font-black uppercase">Servicio Urbano</span>
                        </label>
                        <label class="checkbox-inline">
                            <input type="checkbox" name="diurno" class="w-4 h-4 text-blue-500" checked>
                            <span class="text-[10px] font-black uppercase">Servicio Diurno</span>
                        </label>
                        <label class="checkbox-inline">
                            <input type="checkbox" name="noct_fest" class="w-4 h-4 text-purple-600">
                            <span class="text-[10px] font-black uppercase">Nocturno / Festivo</span>
                        </label>
                        <label class="checkbox-inline">
                            <input type="checkbox" name="remolque" class="w-4 h-4 text-slate-600">
                            <span class="text-[10px] font-black uppercase">Remolque</span>
                        </label>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                        <div class="md:col-span-3">
                            <label class="label-style text-primary-link font-black">Kms Totales *</label>
                            <input type="number" step="0.01" name="km_totales" required class="input-field bg-white border-primary-link text-right" placeholder="0.00">
                        </div>
                        <div class="md:col-span-3">
                            <label class="label-style">Kms Nacionales</label>
                            <input type="number" step="0.01" name="km_nacionales" class="input-field text-right" placeholder="0.00">
                        </div>
                        <div class="md:col-span-3">
                            <label class="label-style">Kms Internacionales</label>
                            <input type="number" step="0.01" name="km_internacionales" class="input-field text-right" placeholder="0.00">
                        </div>
                        <div class="md:col-span-3">
                            <label class="label-style">Plazas Vehículo</label>
                            <select name="num_plazas" class="input-field font-bold">
                                <option value="4" selected>4 Plazas</option>
                                <option value="5">5 Plazas</option>
                                <option value="6">6 Plazas</option>
                                <option value="7">7 Plazas</option>
                                <option value="8">8 Plazas</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="section-header">5. Facturación y Liquidación Administrativa</h2>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                    <div class="md:col-span-9 space-y-6">
                        
                        <div class="p-8 bg-blue-50 rounded-[2.5rem] border border-blue-200 shadow-lg space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div>
                                    <label class="label-style text-blue-500">Nº Factura</label>
                                    <input type="text" name="num_factura" class="input-field bg-white border-blue-200 font-bold" placeholder="Pendiente">
                                </div>
                                <div>
                                    <label class="label-style text-blue-500">Fecha Cobro</label>
                                    <input type="date" name="fecha_cobro" class="input-field bg-white border-blue-200">
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-3 pt-4 border-t border-blue-100">
                                <label class="checkbox-inline flex-1 border-blue-200 bg-blue-100/30">
                                    <input type="checkbox" name="cobrado" class="w-5 h-5 accent-blue-600">
                                    <span class="text-[10px] font-black uppercase text-blue-800">Cobrado</span>
                                </label>
                                <label class="checkbox-inline flex-1 border-green-200 bg-green-50">
                                    <input type="checkbox" name="pagado" class="w-5 h-5 accent-green-600">
                                    <span class="text-[10px] font-black uppercase text-green-800">Pagado</span>
                                </label>
                                <label class="checkbox-inline flex-1 border-teal-200 bg-teal-50">
                                    <input type="checkbox" name="finalizado" checked class="w-5 h-5 accent-teal-600">
                                    <span class="text-[10px] font-black uppercase text-teal-800">Finalizado</span>
                                </label>
                                <label class="checkbox-inline flex-1 border-blue-200 bg-blue-50">
                                    <input type="checkbox" name="adjuntos_bool" class="w-4 h-4 text-blue-600">
                                    <span class="text-[10px] font-black uppercase text-blue-800">Adjuntos</span>
                                </label>
                                <div class="flex-[2]">
                                    <input type="text" name="adjuntos" class="input-field h-full" placeholder="Ref. Adjuntos">
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                            <div class="md:col-span-3">
                                <label class="label-style text-orange-600">Suplidos (€)</label>
                                <input type="number" step="0.01" name="importe_suplidos" class="input-field border-orange-100" value="0.00">
                            </div>
                            <div class="md:col-span-4">
                                <label class="label-style">Asalariado (Conductor)</label>
                                <input type="text" name="asalariado" class="input-field uppercase font-bold" placeholder="NOMBRE DEL CONDUCTOR">
                            </div>
                            <div class="md:col-span-5">
                                <label class="label-style">Autorizado Por</label>
                                <input type="text" name="autorizado_por" class="input-field uppercase" placeholder="QUIEN AUTORIZA">
                            </div>
                        </div>

                        <div>
                            <label class="label-style tracking-widest text-slate-500 block uppercase">Observaciones del Servicio</label>
                            <textarea name="observaciones" rows="4" class="input-field italic w-full resize-none p-6" placeholder="Notas internas o detalles adicionales..."></textarea>
                        </div>
                    </div>

                    <div class="md:col-span-3 bg-slate-900 p-6 rounded-[2.5rem] border-4 border-primary-pastel shadow-2xl h-fit self-start mt-4">
                        <div class="flex flex-col items-center">
                            <label class="text-[11px] font-black text-white uppercase tracking-tighter mb-2">Importe Total *</label>
                            <div class="flex items-center justify-center">
                                <span class="text-2xl font-black text-white mr-2">€</span>
                                <input type="number" step="0.01" id="importe_total" name="importe_total" required class="input-dark text-4xl w-full text-center" placeholder="0.00">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col items-center pt-10 border-t border-slate-100">
                <button type="submit" class="bg-primary-link text-white font-black py-5 px-24 rounded-[2rem] shadow-2xl hover:bg-slate-800 transform transition-all hover:scale-105 active:scale-95 flex items-center gap-4 text-xl uppercase tracking-widest">
                    <i data-lucide="save" class="w-7 h-7"></i> Guardar Albarán Maestro
                </button>
                <div id="statusMessage" class="hidden mt-8 p-5 rounded-2xl text-center font-black w-full max-w-2xl border-2 uppercase text-xs tracking-widest"></div>
            </div>
        </form>
    </div>

    <script>
        window.addEventListener('load', () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
