<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Empresas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="/js/security.js"></script>
    <script src="/js/utils.js"></script>
    
    <style>
        /* Definición de la Paleta de Colores Estandarizada */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        /* 🌐 BASE DEL DOCUMENTO */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f9; /* Fondo suave */
            color: #1f2937; /* Texto oscuro (gray-800) */
            line-height: 1.6;
        }

        /* 🧩 INPUTS Y FORMULARIOS (Clase reutilizable: .input-field) */
        .input-field {
            /* Estilo base */
            @apply w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-800
                   transition duration-200 ease-in-out text-base shadow-sm; 
        }

        .input-field:focus {
            /* Foco estandarizado: Color Primario (Indigo) */
            @apply outline-none border-indigo-600 ring-2 ring-indigo-300;
        }

        /* 🏷️ TÍTULOS DE SECCIÓN (Estandarizado con color primario) */
        .section-title {
            @apply text-xl font-bold text-indigo-700 mb-4 border-b-2 border-indigo-200 pb-2 mt-8;
        }

        /* 🎛️ BOTONES GENERALES */
        .action-button {
            /* Estilo base mejorado */
            @apply inline-flex items-center justify-center font-semibold py-2.5 px-6 rounded-lg 
                   shadow-md cursor-pointer transition duration-300 transform text-white focus:outline-none 
                   hover:scale-[1.02] focus:ring-4 text-sm;
        }
        
        /* Botones específicos (Usando la paleta estandarizada) */
        .btn-crear {
            @apply bg-green-600 hover:bg-green-700 focus:ring-green-300 shadow-green-400/50;
        }

        .btn-modificar {
            /* Color Primario: Indigo */
            @apply bg-indigo-600 hover:bg-indigo-700 focus:ring-indigo-300 shadow-indigo-400/50;
        }

        .btn-borrar {
            /* Color Peligro: Red */
            @apply bg-red-600 hover:bg-red-700 focus:ring-red-300 shadow-red-400/50;
        }

        .btn-volver {
            /* Color Gris Neutral */
            @apply bg-gray-500 hover:bg-gray-600 focus:ring-gray-300 shadow-gray-400/50;
        }

        /* 💬 MENSAJES DE ESTADO */
        .status-message {
            @apply mt-6 p-4 text-center font-medium rounded-lg;
        }

        .status-success { @apply bg-green-100 text-green-800 border border-green-300; }
        .status-error { @apply bg-red-100 text-red-800 border border-red-300; }
        .status-info { @apply bg-indigo-100 text-indigo-800 border border-indigo-300; }
        .status-neutral { @apply bg-gray-200 text-gray-700 border border-gray-300; }

    </style>
</head>
<body class="p-4 sm:p-8 lg:p-12">

    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-xl p-6 md:p-10">
        <h1 class="text-4xl font-extrabold text-indigo-800 text-center mb-10 border-b pb-3">
            Gestión de Empresas/Clientes 🏢
        </h1>

        <form id="enterpriseForm" onsubmit="handleFormSubmit(event)">

            <div class="section-title">🔑 Datos de Identificación y Contacto</div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <div>
                    <label for="nif" class="block text-sm font-medium text-gray-700 mb-1">
                        NIF / CIF <span class="text-red-600 text-lg">*</span>
                    </label>
                    <input type="text" id="nif" name="nif" required
                            placeholder="A12345678"
                            class="input-field border-indigo-400 focus:border-indigo-600 focus:ring-indigo-300 font-bold uppercase">
                </div>

                <div class="md:col-span-2">
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">
                        Nombre / Razón Social
                    </label>
                    <input type="text" id="nombre" name="nombre" required
                            placeholder="Nombre comercial o razón social"
                            class="input-field">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                        Email
                    </label>
                    <input type="email" id="email" name="email"
                            placeholder="contacto@empresa.com"
                            class="input-field">
                </div>

                <div>
                    <label for="telefono" class="block text-sm font-medium text-gray-700 mb-1">
                        Teléfono
                    </label>
                    <input type="tel" id="telefono" name="telefono"
                            placeholder="9XX XXX XXX"
                            class="input-field">
                </div>
                
                <div class="hidden md:block"></div>
            </div>

            <div class="section-title">📍 Datos de Domicilio</div>
            
            <div class="p-4 bg-indigo-50 rounded-lg border border-indigo-200">
              <label for="direccion" class="block text-sm font-medium text-gray-700 mb-1">
                Dirección (Calle y Número)
              </label>
              <input type="text" id="direccion" name="direccion"
                    placeholder="Calle Mayor, 123"
                    class="input-field w-full">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
                
                <div>
                    <label for="cp" class="block text-sm font-medium text-gray-700 mb-1">
                        Código Postal (CP)
                    </label>
                    <input type="text" id="cp" name="cp"
                            placeholder="46001"
                            class="input-field">
                </div>

                <div class="md:col-span-2">
                    <p class="text-sm text-gray-500 mt-2">
                        Nota: Los campos de Población/Provincia se omiten en este formulario base, solo se registra la dirección y CP.
                    </p>
                </div>
            </div>

            <div class="mt-8 p-4 bg-gray-100 rounded-lg border border-gray-300 shadow-inner">
              <label for="observaciones" class="block text-sm font-medium text-gray-700 mb-1">
                Observaciones
              </label>
              <textarea id="observaciones" name="observaciones" rows="4"
                        placeholder="Escriba aquí cualquier nota relevante sobre esta empresa..."
                        class="input-field w-full"></textarea>
              <p id="wordCount" class="text-right text-xs text-gray-500 mt-1">0 palabras</p>
            </div>

            <div class="mt-10 pt-6 border-t border-gray-200 flex flex-wrap justify-center gap-4">
                
                <button type="submit"
                        class="action-button btn-crear">
                    <span class="mr-2">➕</span> Crear
                </button>

                <button type="button" onclick="handleAction('modificar')"
                        class="action-button btn-modificar">
                    <span class="mr-2">✏️</span> Modificar
                </button>

                <button type="button" onclick="handleAction('borrar')"
                        class="action-button btn-borrar">
                    <span class="mr-2">🗑️</span> Borrar
                </button>
                
                <button type="button" onclick="handleAction('volver')"
                        class="action-button btn-volver">
                    <span class="mr-2">🔙</span> Volver
                </button>
            </div>
            
            <div id="statusMessage" class="hidden status-message" role="alert"></div>

        </form>
    </div>

    <script>
        // Función de simulación para todos los botones
        function handleAction(actionType) {
            const statusMessage = document.getElementById('statusMessage');
            
            // Ocultar mensaje de estado anterior
            statusMessage.classList.add('hidden');
            statusMessage.classList.remove('status-success', 'status-error', 'status-info', 'status-neutral');

            switch (actionType) {
                case 'crear':
                    return; // La función handleFormSubmit maneja el "crear"
                case 'modificar':
                    statusMessage.textContent = '✏️ Simulación: Datos listos para ser modificados en el sistema.';
                    statusMessage.classList.add('status-info'); 
                    statusMessage.classList.remove('hidden');
                    break;
                case 'borrar':
                    if (confirm('¿Está seguro que desea borrar este registro? Esta acción es irreversible.')) {
                        statusMessage.textContent = '🗑️ Simulación: El registro se borraría del sistema.';
                        statusMessage.classList.add('status-error'); 
                        statusMessage.classList.remove('hidden');
                    }
                    break;
                case 'volver':
                    // Redirigir a la página principal de administración (se asume 'admin.html' o similar)
                    window.location.href = '/busqueda'; 
                    return; // Detiene la ejecución
                default:
                    return;
            }
        }

        // Simulación de función de envío/creación (enlazada al botón "Crear")
        function handleFormSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const statusMessage = document.getElementById('statusMessage');
            
            statusMessage.classList.add('hidden');
            statusMessage.classList.remove('status-success', 'status-error', 'status-info', 'status-neutral');
            
            if (!document.getElementById('nif').value || !document.getElementById('nombre').value) {
                statusMessage.classList.add('status-error');
                statusMessage.textContent = '❌ Error: Los campos NIF/CIF y Nombre son obligatorios.';
                statusMessage.classList.remove('hidden');
                return;
            }

            const data = {};
            new FormData(form).forEach((value, key) => {
                data[key] = value;
            });

            statusMessage.classList.add('status-success');
            statusMessage.textContent = '✅ ¡CREACIÓN exitosa simulada! Datos listos para ser enviados al backend.';
            statusMessage.classList.remove('hidden');

            console.log("--- DATOS DE EMPRESA A ENVIAR ---");
            console.log(JSON.stringify(data, null, 2));
        }

        // Contador de palabras para Observaciones
        document.getElementById('observaciones').addEventListener('input', function() {
            const text = this.value.trim();
            const wordCount = text ? text.split(/\s+/).filter(word => word.length > 0).length : 0;
            document.getElementById('wordCount').textContent = `${wordCount} palabras`;
        });
    </script>
</body>
</html>
