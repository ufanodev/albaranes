<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏢 Administración - Gestión de Empresas</title>
    
    <script src="/js/security.js"></script>    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/admin_empresas.js" defer></script> 

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pastel': '#FFDAB9', 
                        'primary-link': '#FF8C00',  
                        'black-pure': '#000000',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        @layer components {
            body { font-family: 'Inter', sans-serif; @apply bg-slate-50 text-slate-900; }
            .card { @apply bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100; }
            
            /* BARRA DE BÚSQUEDA - ALTO CONTRASTE */
            .input-search-dark { @apply w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl shadow-inner outline-none transition-all duration-200 text-white font-bold text-xs placeholder-slate-500; }
            .input-search-dark:focus { @apply bg-slate-700 border-primary-link ring-4 ring-orange-900/20 shadow-none; }

            /* TABLA MAESTRA FIJA */
            .compact-table { @apply w-full table-fixed border-separate border-spacing-0; }
            .compact-table th { @apply px-4 py-4 bg-slate-900 text-white text-[9px] font-black uppercase tracking-[0.15em] cursor-pointer hover:bg-slate-800 transition-colors; }
            .compact-table td { @apply px-4 py-3 text-[11px] border-b border-slate-50 font-medium text-slate-600 overflow-hidden text-ellipsis whitespace-nowrap; }
            
            .dropdown-content { @apply hidden absolute bg-white min-w-[220px] shadow-2xl z-[1000] rounded-2xl mt-2 border border-orange-100 overflow-hidden; }
            .dropdown.active .dropdown-content { @apply block; }
        }
    </style>
</head>
<body class="bg-slate-50">

    <header class="bg-gradient-to-r from-slate-800 to-slate-900 text-white shadow-2xl sticky top-0 z-50 border-b border-slate-700">
        <div class="max-w-[1800px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-3 cursor-pointer group" onclick="window.location.href='/admin/'">
                    <div class="bg-primary-link p-2 rounded-xl shadow-lg transform group-hover:rotate-12 transition text-white">
                        <i data-lucide="building-2" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-black uppercase tracking-tighter leading-none">Gestión Empresas</h1>
                        <span class="text-[9px] font-bold text-orange-400 uppercase tracking-widest opacity-80">Administración de Clientes</span>
                    </div>
                </div>

                <nav class="hidden md:flex items-center space-x-2">
                    <button onclick="handleCreateActionEmpresa()" class="bg-primary-link text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-orange-600 transition shadow-lg flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Nueva Empresa
                    </button>
                    <div class="flex items-center gap-2 border-l border-slate-700 pl-4 ml-4">
                        <button onclick="handleGeneratePDF()" class="bg-white/5 hover:bg-white/10 p-2.5 rounded-xl transition text-orange-400"><i data-lucide="printer" class="h-4 w-4"></i></button>
                        <button onclick="handleGenerateXLSX()" class="bg-emerald-500/20 hover:bg-emerald-500/40 p-2.5 rounded-xl transition text-emerald-400"><i data-lucide="file-spreadsheet" class="h-4 w-4"></i></button>
                        <button onclick="handleLogout()" class="bg-red-500/20 hover:bg-red-500 p-2.5 rounded-xl transition text-red-400 hover:text-white"><i data-lucide="log-out" class="h-4 w-4"></i></button>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <main class="p-4 sm:p-6 lg:p-8 max-w-[1800px] mx-auto space-y-6">
        
        <div class="card bg-slate-900 border-none shadow-2xl">
            <form id="searchForm" onsubmit="Events.handleSearch(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                    <div>
                        <label class="block text-[9px] font-black text-slate-500 uppercase mb-1.5 ml-1 tracking-widest">NIF / CIF</label>
                        <input type="text" name="nif" id="nif" placeholder="Buscar NIF..." class="input-search-dark h-11 uppercase">
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-500 uppercase mb-1.5 ml-1 tracking-widest">Razón Social</label>
                        <input type="text" name="nombre" id="nombre" placeholder="Nombre empresa..." class="input-search-dark h-11">
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-500 uppercase mb-1.5 ml-1 tracking-widest">Teléfono</label>
                        <input type="text" name="telefono" id="telefono" placeholder="96..." class="input-search-dark h-11">
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-slate-500 uppercase mb-1.5 ml-1 tracking-widest">Estado</label>
                        <select name="estado" id="estadoFiltro" class="input-search-dark h-11 cursor-pointer">
                            <option value="">TODOS</option>
                            <option value="1">ACTIVOS</option>
                            <option value="0">INACTIVOS</option>
                        </select>
                    </div>
                    <div class="flex items-end gap-2">
                        <button type="submit" class="flex-1 bg-primary-link text-white h-11 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg hover:bg-orange-600 transition active:scale-95">Filtrar</button>
                        <button type="button" onclick="handleClearAllFilters()" class="px-4 bg-slate-700 text-slate-300 h-11 rounded-xl font-black text-[10px] uppercase hover:bg-slate-600 transition"><i data-lucide="refresh-ccw" class="w-4 h-4"></i></button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                <div class="flex items-center gap-3">
                    <h2 id="dynamicTitle" class="font-black text-slate-800 tracking-tighter text-xl uppercase italic">Sincronizando...</h2>
                </div>

                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                        <span class="text-[9px] font-black text-slate-400 uppercase px-2">Ver:</span>
                        <select id="recordsPerPage" class="bg-transparent border-none text-[10px] font-bold focus:ring-0 cursor-pointer outline-none">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="50">50</option>
                            <option value="todos">Todos</option>
                        </select>
                    </div>
                    <div class="flex items-center bg-slate-900 rounded-2xl p-1 shadow-xl">
                        <button id="prevPageBtn" class="p-2 text-white hover:bg-white/10 rounded-xl transition disabled:opacity-20"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                        <span id="pageInfo" class="px-4 text-[10px] font-black text-primary-pastel min-w-[100px] text-center tracking-widest uppercase">Página 1</span>
                        <button id="nextPageBtn" class="p-2 text-white hover:bg-white/10 rounded-xl transition disabled:opacity-20"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                    </div>
                </div>
            </div>

            <div class="overflow-hidden rounded-[2rem] border border-slate-200 shadow-2xl">
                <table class="compact-table">
                    <thead>
                        <tr>
                            <th class="w-[8%]" onclick="sortTable('id')">
                                <div class="flex items-center justify-between">ID <i id="sort-id" class="sort-icon opacity-30 group-hover:opacity-100 transition"></i></div>
                            </th>
                            <th class="w-[12%]" onclick="sortTable('nif')">
                                <div class="flex items-center justify-between">NIF/CIF <i id="sort-nif" class="sort-icon opacity-30 group-hover:opacity-100 transition"></i></div>
                            </th>
                            <th class="w-[22%]" onclick="sortTable('nombre')">
                                <div class="flex items-center justify-between">Razón Social <i id="sort-nombre" class="sort-icon opacity-30 group-hover:opacity-100 transition"></i></div>
                            </th>
                            <th class="w-[18%] text-left">Dirección</th>
                            <th class="w-[12%] text-left">Teléfono</th>
                            <th class="w-[13%] text-left">Email</th>
                            <th class="w-[5%] text-center">Est.</th>
                            <th class="w-[10%] text-center">Gestión</th>
                        </tr>
                    </thead>
                    <tbody id="empresaResults" class="bg-white divide-y divide-slate-100">
                        <tr><td colspan="8" class="p-20 text-center italic text-slate-400 font-bold uppercase tracking-widest animate-pulse">Cargando base de datos...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="totalLabel" class="text-[9px] text-slate-400 mt-6 text-center font-bold uppercase tracking-[0.3em]"></div>
        </div>
    </main>

    <div id="statusMessage" class="hidden fixed bottom-5 right-5 z-[2000] p-4 rounded-xl shadow-2xl border-2 bg-white font-black text-xs uppercase tracking-widest transition-all duration-300"></div>

    <script>
        function toggleDropdown(button) {
            const dropdown = button.parentElement;
            document.querySelectorAll('.dropdown').forEach(d => { if (d !== dropdown) d.classList.remove('active'); });
            dropdown.classList.toggle('active');
        }
        document.addEventListener('click', (e) => { if (!e.target.closest('.dropdown')) { document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active')); } });
        window.addEventListener('load', () => { if (window.lucide) lucide.createIcons(); });
    </script>
</body>
</html>
