<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚕 Albaranes Enviados - Gestión</title>
    
    <script src="/js/security.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pastel': '#FFDAB9',
                        'primary-link': '#FF8C00',
                        'black-pure': '#000000',
                        'secondary-blue': '#3B82F6',
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                },
            },
        };
    </script>

    <style type="text/tailwindcss">
        @layer components {
            .card { @apply bg-white p-6 rounded-xl shadow-lg border border-primary-pastel/50; }
            .input-field { @apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-link transition duration-150 text-sm font-bold text-gray-700; }
        }
        .sortable { @apply cursor-pointer select-none flex items-center justify-between; }
    </style>
</head>

<body class="bg-gray-50 font-sans p-4 sm:p-8">

    <div class="max-w-7xl mx-auto">
        <div class="card mb-6">
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 border-b border-gray-200 pb-4">
                <h1 class="text-3xl font-extrabold text-black-pure flex items-center gap-3 tracking-tight">
                    <span class="text-4xl">📤</span>
                    <span class="text-2xl uppercase tracking-tighter">Histórico Enviados</span>
                </h1>

                <div class="flex flex-col lg:flex-row items-end lg:items-center gap-4 w-full xl:w-auto justify-end">
                    <div class="flex flex-wrap gap-2">
                        <a href="/titulares/nuevo_albaran" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-bold text-white bg-green-500 shadow hover:bg-green-600 transition uppercase"><span>➕ Nuevo</span></a>
                        <a href="/titulares" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-bold text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 transition uppercase"><span>📋 Ver todos</span></a>
                        <a href="/titulares/pendientes" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-bold text-black-pure bg-primary-pastel hover:bg-orange-200 transition uppercase"><span>🏁 Pendientes</span></a>
                    </div>
                    <div class="flex items-center gap-2 border-l border-gray-300 pl-4">
                        <button onclick="handleGeneratePDF()" title="Imprimir PDF" class="bg-gray-200 text-gray-700 hover:bg-gray-300 p-2.5 rounded-xl shadow transition active:scale-95"><i data-lucide="printer" class="h-5 w-5"></i></button>
                        <button onclick="handleGenerateXLSX()" title="Exportar a Excel" class="bg-emerald-500 text-white p-2.5 rounded-xl shadow transition active:scale-95"><i data-lucide="file-spreadsheet" class="h-5 w-5"></i></button>
                        <button onclick="handleLogout()" title="Cerrar sesión" class="bg-red-500 text-white p-2.5 rounded-xl shadow transition active:scale-95"><i data-lucide="log-out" class="h-5 w-5"></i></button>
                    </div>
                </div>
            </div>

            <div class="mt-6 bg-slate-50 p-6 rounded-2xl border border-slate-100">
                <div class="flex flex-wrap gap-3 mb-4 items-center">
                    <button id="btn-mode-campos" onclick="UI.setSearchModeManual('campos')" class="px-4 py-2 rounded-lg bg-secondary-blue text-white font-black text-[10px] uppercase shadow-md transition-all">📝 Por Campos</button>
                    <button id="btn-mode-palabra" onclick="UI.setSearchModeManual('palabra')" class="px-4 py-2 rounded-lg bg-white text-slate-400 font-black text-[10px] uppercase border hover:bg-slate-50 transition-all">💬 Por Palabra</button>
                    
                    <button type="button" id="btn-buscar-accion" onclick="handleSearch(event)" class="px-6 py-2 rounded-lg bg-primary-link text-white text-[10px] font-black uppercase hover:bg-orange-600 transition shadow-lg flex items-center gap-2">
                        <i data-lucide="search" class="w-3 h-3"></i> Buscar ahora
                    </button>

                    <button type="button" onclick="UI.handleClearAllFilters()" class="px-4 py-2 rounded-lg bg-slate-200 text-slate-600 text-[10px] font-black uppercase hover:bg-slate-300 ml-auto transition">Limpiar Filtros</button>
                </div>

                <form id="searchForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-3">
                    <select id="empresa" name="empresa_ref" class="input-field py-2 font-bold text-slate-700"></select>
                    <input type="text" id="referencia_input" class="input-field py-2 uppercase" placeholder="Referencia...">
                    <input type="date" id="fecha_desde" class="input-field py-2">
                    <input type="date" id="fecha_hasta" class="input-field py-2">
                    <button type="submit" class="bg-slate-900 text-white font-black rounded-lg text-[10px] uppercase hover:bg-black transition shadow-md">Filtrar</button>
                </form>

                <div id="palabraSection" class="mt-4 hidden">
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                        <input type="text" id="palabra" placeholder="Buscar por número, empresa, referencia..." class="input-field pl-10 py-3 font-bold border-blue-100 focus:ring-blue-400">
                    </div>
                </div>
            </div>
        </div>

        <div class="card overflow-hidden">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-3">
                    <span id="activeFiltersCount" class="text-[10px] font-black bg-blue-100 px-4 py-1.5 rounded-full text-blue-600 border border-blue-200 uppercase tracking-widest">0 REGISTROS</span>
                </div>
                <div class="flex items-center gap-3 bg-slate-50 p-1.5 rounded-xl border">
                    <span class="text-[10px] text-slate-400 font-black uppercase ml-2">Ver:</span>
                    <select id="recordsPerPage" class="text-xs font-bold border-none bg-transparent focus:ring-0 cursor-pointer">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="50">50</option>
                        <option value="todos">Todos</option>
                    </select>
                </div>
            </div>

            <div class="overflow-x-auto rounded-xl border border-slate-100 shadow-inner">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-900 text-white text-[9px] uppercase font-black tracking-[0.15em]">
                        <tr>
                            <th class="px-4 py-5 text-left cursor-pointer group" onclick="sortTable('numero_albaran')">
                                <div class="sortable">Nº albarán <i id="sort-numero_albaran" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30"></i></div>
                            </th>
                            <th class="px-4 py-5 text-left cursor-pointer group" onclick="sortTable('fecha')">
                                <div class="sortable">Fecha <i id="sort-fecha" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30"></i></div>
                            </th>
                            <th class="px-4 py-5 text-left">Licencia</th>
                            <th class="px-4 py-5 text-left cursor-pointer group" onclick="sortTable('empresa')">
                                <div class="sortable">Empresa <i id="sort-empresa" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30"></i></div>
                            </th>
                            <th class="px-4 py-5 text-left cursor-pointer group" onclick="sortTable('referencia')">
                                <div class="sortable">Ref. <i id="sort-referencia" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30"></i></div>
                            </th>
                            <th class="px-4 py-5 text-left">Conductor</th>
                            <th class="px-4 py-5 text-right cursor-pointer group" onclick="sortTable('importe_total')">
                                <div class="sortable justify-end">Importe <i id="sort-importe_total" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30 ml-1"></i></div>
                            </th>
                            <th class="px-4 py-5 text-center cursor-pointer group" onclick="sortTable('estado')">
                                <div class="sortable justify-center">ESTADO <i id="sort-estado" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30"></i></div>
                            </th>
                            <th class="px-4 py-5 text-center">Ver</th>
                        </tr>
                    </thead>
                    <tbody id="albaranResults" class="bg-white divide-y divide-slate-100 text-xs font-medium">
                        </tbody>
                </table>
            </div>
            
            <div class="mt-6 flex justify-between items-center px-2">
                <p id="totalLabel" class="text-[10px] text-slate-400 font-black uppercase tracking-widest italic"></p>
                <div class="flex items-center gap-2">
                    <button id="prevPageBtn" class="p-2 bg-slate-100 rounded-lg hover:bg-slate-200 disabled:opacity-30"><i data-lucide="chevron-left" class="h-4 w-4"></i></button>
                    <span id="pageInfo" class="px-4 py-2 text-[10px] font-black text-slate-600 bg-white border rounded-lg shadow-sm">1 / 1</span>
                    <button id="nextPageBtn" class="p-2 bg-slate-100 rounded-lg hover:bg-slate-200 disabled:opacity-30"><i data-lucide="chevron-right" class="h-4 w-4"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script src="/js/search.js"></script>

    <script src="/js/albaran_enviado.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });
    </script>
</body>
</html>
