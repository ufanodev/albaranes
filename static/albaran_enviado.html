<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚕 Albaranes Enviados - Gestión</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pastel': '#FFDAB9',
                        'primary-link': '#FF8C00',
                        'black-pure': '#000000',
                        'secondary-blue': '#3B82F6',
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                },
            },
        };
    </script>

    <script src="/js/security.js"></script>
    <script src="/js/albaran_enviado.js" defer></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @layer components {
            .card { @apply bg-white p-6 rounded-xl shadow-lg border border-primary-pastel/50; }
            .input-field { @apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-link transition duration-150 text-sm; }
        }
    </style>
</head>

<body class="bg-gray-50 font-sans p-4 sm:p-8">

    <div class="max-w-7xl mx-auto">
        <div class="card mb-6">
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 border-b border-gray-200 pb-4">
                <h1 class="text-3xl font-extrabold text-black-pure flex items-center gap-3 tracking-tight">
                    <span class="text-4xl">📤</span>
                    <span class="text-2xl uppercase tracking-tighter">Histórico Enviados</span>
                </h1>

                <div class="flex flex-col lg:flex-row items-end lg:items-center gap-4 w-full xl:w-auto justify-end">
                    <div class="flex flex-wrap gap-2">
                        <a href="/titulares/nuevo_albaran" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-bold text-white bg-green-500 shadow hover:bg-green-600 transition uppercase"><span>➕ Nuevo</span></a>
                        <a href="/titulares" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-bold text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 transition uppercase"><span>📋 Ver todos</span></a>
                        <a href="/titulares/pendientes" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-bold text-black-pure bg-primary-pastel hover:bg-orange-200 transition uppercase"><span>🏁 Pendientes</span></a>
                    </div>
                    <div class="flex items-center gap-2 border-l border-gray-300 pl-4">
                        <button onclick="handleGeneratePDF()" title="Imprimir PDF" class="bg-gray-200 text-gray-700 hover:bg-gray-300 p-2.5 rounded-xl shadow transition active:scale-95"><i data-lucide="printer" class="h-5 w-5"></i></button>
                        <button onclick="handleGenerateXLSX()" title="Exportar a Excel" class="bg-emerald-500 text-white p-2.5 rounded-xl shadow transition active:scale-95"><i data-lucide="file-spreadsheet" class="h-5 w-5"></i></button>
                        <button onclick="handleLogout()" title="Cerrar sesión" class="bg-red-500 text-white p-2.5 rounded-xl shadow transition active:scale-95"><i data-lucide="log-out" class="h-5 w-5"></i></button>
                    </div>
                </div>
            </div>

            <div class="mt-6 bg-slate-50 p-6 rounded-2xl border border-slate-100">
                <div class="flex flex-wrap gap-3 mb-4">
                    <button id="btn-mode-campos" onclick="UI.setSearchModeManual('campos')" class="px-4 py-2 rounded-lg bg-secondary-blue text-white font-black text-[10px] uppercase">📝 Por Campos</button>
                    <button id="btn-mode-palabra" onclick="UI.setSearchModeManual('palabra')" class="px-4 py-2 rounded-lg bg-white text-slate-400 font-black text-[10px] uppercase border">💬 Por Palabra</button>
                </div>
                <form id="searchForm" class="grid grid-cols-1 md:grid-cols-5 gap-3">
                    <select id="empresa" class="input-field py-2 font-bold"></select>
                    <input type="text" id="referencia_input" class="input-field py-2" placeholder="Referencia...">
                    <input type="date" id="fecha_desde" class="input-field py-2">
                    <input type="date" id="fecha_hasta" class="input-field py-2">
                    <button type="submit" class="bg-primary-link text-white font-black rounded-lg text-xs uppercase hover:bg-orange-600 transition">Filtrar</button>
                </form>
                <div id="palabraSection" class="mt-4 hidden"><input type="text" id="palabra" placeholder="Buscar en cualquier campo..." class="input-field py-3 font-bold border-blue-200"></div>
            </div>
        </div>

        <div class="card overflow-hidden">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-3">
                    <span id="activeFiltersCount" class="text-[10px] font-black bg-blue-100 px-4 py-1.5 rounded-full text-blue-600 border border-blue-200 uppercase">0 ENVIADOS</span>
                </div>
                <div class="flex items-center gap-3">
                    <select id="recordsPerPage" class="text-xs font-bold border-none bg-slate-100 rounded-lg px-3 py-1.5">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="50">50</option>
                        <option value="todos">Todos</option>
                    </select>
                </div>
            </div>

            <div class="overflow-x-auto rounded-xl border border-slate-100">
                <table class="min-w-full divide-y divide-slate-200">
<thead class="bg-slate-900 text-white text-[9px] uppercase font-black tracking-[0.15em]">
  <tr>
    <th class="px-4 py-5 text-left cursor-pointer group" onclick="sortTable('numero_albaran')">
        <div class="flex items-center justify-between">Nº albarán <i id="sort-numero_albaran" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30 group-hover:opacity-100 transition"></i></div>
    </th>
    <th class="px-4 py-5 text-left cursor-pointer group" onclick="sortTable('fecha')">
        <div class="flex items-center justify-between">Fecha <i id="sort-fecha" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30 group-hover:opacity-100 transition"></i></div>
    </th>
    <th class="px-4 py-5 text-left cursor-pointer group" onclick="sortTable('licencia')">
        <div class="flex items-center justify-between">Licencia <i id="sort-licencia" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30 group-hover:opacity-100 transition"></i></div>
    </th>
    <th class="px-4 py-5 text-left cursor-pointer group" onclick="sortTable('empresa')">
        <div class="flex items-center justify-between">Empresa <i id="sort-empresa" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30 group-hover:opacity-100 transition"></i></div>
    </th>
    <th class="px-4 py-5 text-left cursor-pointer group" onclick="sortTable('referencia')">
        <div class="flex items-center justify-between">Ref. <i id="sort-referencia" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30 group-hover:opacity-100 transition"></i></div>
    </th>
    <th class="px-4 py-5 text-left cursor-pointer group" onclick="sortTable('asalariado')">
        <div class="flex items-center justify-between">Conductor <i id="sort-asalariado" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30 group-hover:opacity-100 transition"></i></div>
    </th>
    <th class="px-4 py-5 text-right cursor-pointer group" onclick="sortTable('importe_total')">
        <div class="flex items-center justify-end">Importe <i id="sort-importe_total" data-lucide="chevrons-up-down" class="h-3 w-3 opacity-30 group-hover:opacity-100 ml-1 transition"></i></div>
    </th>
    <th class="px-4 py-5 text-center">Estado</th>
    <th class="px-4 py-5 text-center">Ver</th>
  </tr>
</thead>
                    <tbody id="albaranResults" class="bg-white divide-y divide-slate-100">
                        <tr><td colspan="9" class="text-center py-20 italic text-slate-400">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <div class="mt-6 flex justify-between items-center">
                <p id="totalLabel" class="text-[10px] text-slate-400 font-black uppercase tracking-widest"></p>
                <div class="flex gap-2">
                    <button id="prevPageBtn" class="p-2 bg-slate-100 rounded-lg hover:bg-slate-200 transition"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                    <span id="pageInfo" class="px-4 py-2 text-xs font-black text-slate-600 bg-slate-50 rounded-lg border">1 / 1</span>
                    <button id="nextPageBtn" class="p-2 bg-slate-100 rounded-lg hover:bg-slate-200 transition"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>
</body>
</html>
