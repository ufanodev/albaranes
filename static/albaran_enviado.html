<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚕 Albaranes Enviados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 1. Seguridad Global -->
    <script src="/js/security.js"></script>
    
    <!-- 2. Lógica específica para Enviados -->
    <script src="/js/albaran_enviado.js" defer></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pastel': '#FFDAB9', // Naranja Pastel
                        'primary-link': '#FF8C00',   // Naranja más vivo
                        'black-pure': '#000000',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .card { @apply bg-white p-6 rounded-xl shadow-lg border border-primary-pastel/50; }
        .input-field { @apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-link focus:border-primary-link transition duration-150; }
        
        .status-message { @apply mt-4 p-3 rounded-md font-medium text-center; }
        .status-success { @apply bg-green-100 text-green-700 border border-green-400; }
        .status-error { @apply bg-red-400 text-white border border-red-600; }
        .status-info { @apply bg-gray-200 text-gray-700 border border-gray-400; }

        .total-row td { @apply bg-primary-pastel/70 font-extrabold text-gray-800 text-lg; }
        
        .sortable {
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body class="bg-gray-50 p-4 sm:p-8 lg:p-12 font-inter">

    <!-- Modal de Acción -->
    <div id="actionModal" class="fixed inset-0 z-50 bg-black bg-opacity-50 hidden flex items-center justify-center p-4" onclick="window.handleActionModal && window.handleActionModal(false)">
        <div class="bg-white rounded-xl p-6 shadow-2xl max-w-sm w-full transform transition-all duration-300 scale-90" onclick="event.stopPropagation()">
            <h3 id="modalTitle" class="text-xl font-bold mb-3 text-black-pure">Acción Realizada</h3>
            <p id="modalBody" class="text-gray-700 mb-4"></p>
            <button onclick="window.handleActionModal && window.handleActionModal(false)" class="w-full bg-primary-link text-white font-semibold py-2 rounded-lg hover:bg-orange-600 transition active:scale-95">Aceptar</button>
        </div>
    </div>
    
    <div class="max-w-7xl mx-auto">

        <!-- Header -->
        <div class="card mb-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b border-gray-200 pb-4">
                <h1 class="text-3xl font-bold text-black-pure mb-4 sm:mb-0 flex items-center">
                    <span class="text-4xl mr-3">📤</span>
                    <span class="text-2xl">ALBARANES ENVIADOS</span>
                </h1>

                <div class="flex flex-col sm:flex-row items-end sm:items-center gap-3">
                    <!-- Grupo de Navegación -->
                    <div class="flex flex-wrap gap-3 order-2 sm:order-1">
                        <a href="/titulares/nuevo_albaran" 
                           class="group relative inline-flex items-center justify-center px-6 py-3 font-semibold text-white transition-all duration-300 ease-in-out bg-gradient-to-r from-green-500 to-green-600 rounded-lg shadow-lg hover:shadow-xl hover:shadow-green-500/50 hover:from-green-600 hover:to-green-700 active:scale-95 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
                            <span class="mr-2 text-xl transition-transform group-hover:scale-110">➕</span>
                            <span class="relative">NUEVO</span>
                        </a>

                        <!-- Botón para volver a TODOS -->
                        <a href="/titulares" 
                           class="group relative inline-flex items-center justify-center px-4 py-2.5 font-semibold text-gray-700 transition-all duration-300 ease-in-out bg-white border-2 border-gray-300 rounded-lg shadow-md hover:bg-gray-100 hover:border-gray-400 active:scale-95 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2">
                            <span class="mr-2 transition-transform group-hover:scale-105">📋</span>
                            <span class="relative">VER TODOS</span>
                        </a>

                        <a href="/titulares/pendientes" 
                           class="group relative inline-flex items-center justify-center px-4 py-2.5 font-semibold text-black-pure transition-all duration-300 ease-in-out bg-primary-pastel border-2 border-primary-pastel rounded-lg shadow-md hover:bg-orange-300 hover:border-orange-400 active:scale-95 focus:outline-none focus:ring-2 focus:ring-primary-pastel focus:ring-offset-2">
                            <span class="mr-2 transition-transform group-hover:rotate-6">🏁</span>
                            <span class="relative">PENDIENTES</span>
                        </a>
                    </div>

                    <!-- Grupo de Herramientas -->
                    <div class="flex items-center gap-3 order-1 sm:order-2">
                        <div class="flex flex-col items-center">
                            <button title="Exportar a Excel" class="bg-emerald-500 text-white hover:bg-emerald-600 font-semibold p-2 rounded-full shadow-md transition duration-200 active:scale-95" onclick="window.handleAction && window.handleAction('Exportar Excel', 'Listado Enviados')">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M11 15h6"/><path d="M14 12v6"/><path d="M8 12h2"/><path d="M8 15h2"/><path d="M8 18h2"/></svg>
                            </button>
                            <span class="text-xs text-gray-500 mt-1 hidden sm:inline">Exportar</span>
                        </div>
                        
                        <div class="flex flex-col items-center">
                            <button onclick="handleLogout()" title="Cerrar Sesión"
                                class="bg-red-500 text-white hover:bg-red-600 font-semibold p-2 rounded-full shadow-md transition duration-200 active:scale-95 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                            </button>
                            <span class="text-xs text-gray-500 mt-1 hidden sm:inline">Salir</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filtros -->
            <div class="card mb-8">
                <h2 class="text-xl font-bold text-black-pure mb-4">🔍 Filtros (Enviados)</h2>
                <form id="searchForm" onsubmit="window.handleSearch(event)">
                    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-2">
                        <div>
                            <label for="licencia" class="block text-xs font-medium text-gray-700 mb-1">LICENCIA</label>
                            <input type="text" id="licencia" name="licencia" placeholder="Auto" class="input-field bg-gray-100 text-xs" readonly>
                        </div>
                        <div>
                            <label for="empresa" class="block text-xs font-medium text-gray-700 mb-1">Empresa</label>
                            <select id="empresa" name="empresa" class="input-field appearance-none text-xs">
                                <option value="">Seleccione</option>
                                <option value="race">RACE</option>
                                <option value="mapfre">Mapfre</option>
                                <option value="mutua">Mutua</option>
                            </select>
                        </div>
                        <div>
                            <label for="state" class="block text-xs font-medium text-gray-700 mb-1">Estado</label>
                            <!-- ESTADO FIJO Y DESHABILITADO: Indica que solo se ven ENVIADOS -->
                            <select id="state" name="state" class="input-field appearance-none text-xs bg-blue-50 border-blue-300 text-blue-700 font-bold cursor-not-allowed" disabled>
                                <option value="enviado" selected>Enviado</option>
                            </select>
                            <!-- Campo oculto para enviar si fuera necesario, aunque JS lo fuerza -->
                            <input type="hidden" name="state" value="enviado">
                        </div>
                        <div>
                            <label for="referencia" class="block text-xs font-medium text-gray-700 mb-1">Referencia</label>
                            <input type="text" id="referencia" name="referencia" placeholder="Ref..." class="input-field text-xs">
                        </div>
                        <div>
                            <label for="fecha_desde" class="block text-xs font-medium text-gray-700 mb-1">Fecha (Desde)</label>
                            <input type="date" id="fecha_desde" name="fecha_desde" class="input-field text-xs">
                        </div>
                        <div>
                            <label for="fecha_hasta" class="block text-xs font-medium text-gray-700 mb-1">Fecha (Hasta)</label>
                            <input type="date" id="fecha_hasta" name="fecha_hasta" class="input-field text-xs">
                        </div>
                    </div>

                    <div class="mt-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex flex-wrap gap-x-4 text-xs text-gray-700">
                            <label class="inline-flex items-center">
                                <input type="radio" name="search_type" value="exacta" class="form-radio text-primary-link h-3 w-3 border-gray-300 focus:ring-primary-link" checked>
                                <span class="ml-1">Frase Exacta</span>
                            </label>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button type="button" onclick="document.getElementById('searchForm').reset();" 
                                class="group relative inline-flex items-center justify-center px-3 py-2 font-semibold text-blue-600 transition-all duration-300 ease-in-out bg-white border-2 border-blue-500 rounded-lg shadow-sm hover:bg-blue-50 hover:border-blue-600 active:scale-95 text-xs">
                                <span class="relative">Limpiar</span>
                            </button>
                            
                            <button type="submit" 
                                class="group relative inline-flex items-center justify-center px-4 py-2 font-semibold text-white transition-all duration-300 ease-in-out bg-gradient-to-r from-blue-500 to-blue-600 rounded-lg shadow-md hover:shadow-lg hover:from-blue-600 hover:to-blue-700 active:scale-95 text-xs">
                                <span class="relative">Buscar</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Tabla de Resultados -->
            <h2 class="text-xl font-bold text-black-pure mb-4">📊 Listado de Enviados</h2>

            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center space-x-2 text-sm text-gray-600">
                    <span>Registros por página:</span>
                    <select id="recordsPerPage" class="input-field w-auto px-2 py-1">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>

            <div class="overflow-x-auto shadow-lg rounded-xl border border-gray-100">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-primary-link text-white">
                        <tr>
                            <!-- 1. Nº Albarán -->
                            <th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider rounded-tl-xl">
                                <div class="sortable flex justify-between items-center cursor-pointer" onclick="window.sortTable('numero_albaran')">
                                    Nº Albarán <i id="sort-numero_albaran" data-lucide="chevrons-up-down" class="h-4 w-4 ml-1"></i>
                                </div>
                            </th>
                            <!-- 2. Fecha -->
                            <th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider">
                                <div class="sortable flex justify-between items-center cursor-pointer" onclick="window.sortTable('fecha')">
                                    Fecha <i id="sort-fecha" data-lucide="chevrons-up-down" class="h-4 w-4 ml-1"></i>
                                </div>
                            </th>
                            <!-- 3. Licencia -->
                            <th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider">
                                <div class="sortable flex justify-between items-center cursor-pointer" onclick="window.sortTable('licencia')">
                                    Licencia <i id="sort-licencia" data-lucide="chevrons-up-down" class="h-4 w-4 ml-1"></i>
                                </div>
                            </th>
                            <!-- 4. Empresa -->
                            <th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider">Empresa</th>
                            <!-- 5. Referencia -->
                            <th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider">Referencia</th>
                            <!-- 6. Conductor -->
                            <th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider">
                                <div class="sortable flex justify-between items-center cursor-pointer" onclick="window.sortTable('conductor')">
                                    Conductor <i id="sort-conductor" data-lucide="chevrons-up-down" class="h-4 w-4 ml-1"></i>
                                </div>
                            </th>
                            <!-- 7. Importe Total -->
                            <th scope="col" class="px-4 py-3 text-right text-xs font-bold uppercase tracking-wider">
                                <div class="sortable flex justify-end items-center cursor-pointer" onclick="window.sortTable('importe_total')">
                                    Importe Total <i id="sort-importe_total" data-lucide="chevrons-up-down" class="h-4 w-4 ml-1"></i>
                                </div>
                            </th>
                            <!-- 8. Estado -->
                            <th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider">
                                <div class="sortable flex justify-between items-center cursor-pointer" onclick="window.sortTable('enviado')">
                                    Estado <i id="sort-enviado" data-lucide="chevrons-up-down" class="h-4 w-4 ml-1"></i>
                                </div>
                            </th>
                            <!-- 9. Observaciones -->
                            <th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider">Observaciones</th>
                            <!-- 10. Acciones -->
                            <th scope="col" class="px-4 py-3 text-center text-xs font-bold uppercase tracking-wider rounded-tr-xl">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="albaranResults" class="bg-white divide-y divide-gray-200">
                        <!-- Placeholder de carga (colspan 10) -->
                        <tr><td colspan="10" class="text-center py-6 text-gray-500 italic">Cargando datos de la API...</td></tr>
                    </tbody>
                    <tfoot id="albaranTotal">
                        <!-- Totales inyectados por JS -->
                    </tfoot>
                </table>
            </div>
            <div id="statusMessage" class="hidden status-message" role="alert"></div>
        </div>
    </div>
</body>
</html>
