<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚕 Albaranes Enviados - Gestión</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pastel': '#FFDAB9', // Naranja Pastel
                        'primary-link': '#FF8C00',   // Naranja Vivo
                        'black-pure': '#000000',
                        'secondary-blue': '#3B82F6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            },
        };
    </script>

    <script src="/js/security.js"></script>
    <script src="/js/albaran_enviado.js" defer></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @layer components {
            .card { @apply bg-white p-6 rounded-xl shadow-lg border border-primary-pastel/50; }
            .input-field { @apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-link transition duration-150; }
            .status-message { @apply mt-4 p-3 rounded-md font-medium text-center border; }
        }
        .sortable { cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between; }
    </style>
</head>

<body class="bg-gray-50 font-inter p-4 sm:p-8 lg:p-12">

    <div id="actionModal" class="fixed inset-0 z-50 bg-black bg-opacity-50 hidden flex items-center justify-center p-4" onclick="window.handleActionModal && window.handleActionModal(false)">
        <div class="bg-white rounded-xl p-6 shadow-2xl max-w-sm w-full transform transition-all duration-300 scale-90" onclick="event.stopPropagation()">
            <h3 id="modalTitle" class="text-xl font-bold mb-3 text-black-pure tracking-tight">Acción Realizada</h3>
            <p id="modalBody" class="text-gray-700 mb-4 text-sm"></p>
            <button onclick="window.handleActionModal && window.handleActionModal(false)" class="w-full bg-primary-link text-white font-bold py-2 rounded-lg hover:bg-orange-600 transition active:scale-95">Aceptar</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto">

        <div class="card mb-6">
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 border-b border-gray-200 pb-4">
                <h1 class="text-3xl font-extrabold text-black-pure flex items-center gap-3 tracking-tight">
                    <span class="text-4xl">📤</span>
                    <span class="text-2xl uppercase tracking-tighter">Albaranes Enviados</span>
                </h1>

                <div class="flex flex-col lg:flex-row items-end lg:items-center gap-4 w-full xl:w-auto justify-end">
                    <div class="flex flex-wrap gap-2">
                        <a href="/titulares/nuevo_albaran" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-white bg-gradient-to-r from-green-500 to-green-600 shadow hover:from-green-600 active:scale-95 transition">
                            <span>➕ Nuevo</span>
                        </a>
                        <a href="/titulares" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 active:scale-95 transition">
                            <span>📋 Ver todos</span>
                        </a>
                        <a href="/titulares/pendientes" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold text-black-pure bg-primary-pastel border border-primary-pastel hover:bg-orange-200 active:scale-95 transition">
                            <span>🏁 Pendientes</span>
                        </a>
                    </div>

                    <div class="flex items-center gap-2 border-l border-gray-300 pl-4">
                        <button onclick="handleGeneratePDF()" title="Imprimir PDF" class="bg-gray-200 text-gray-700 hover:bg-gray-300 p-2 rounded-full shadow-md transition active:scale-95">
                            <i data-lucide="printer" class="h-5 w-5"></i>
                        </button>
                        <button onclick="handleGenerateXLSX()" title="Exportar a Excel" class="bg-emerald-500 text-white hover:bg-emerald-600 p-2 rounded-full shadow-md transition active:scale-95">
                            <i data-lucide="file-spreadsheet" class="h-5 w-5"></i>
                        </button>
                        <button onclick="handleLogout()" title="Cerrar sesión" class="bg-red-500 text-white hover:bg-red-600 p-2 rounded-full shadow-md transition active:scale-95">
                            <i data-lucide="log-out" class="h-5 w-5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="text-xl font-bold text-black-pure mb-4 flex items-center gap-2">
            <span>📊</span><span>Histórico de Albaranes Enviados (enviado=1)</span>
        </h2>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4 flex justify-between items-center flex-wrap gap-3">
            <div class="flex items-center space-x-2 text-sm text-gray-600">
                <span class="font-medium">Mostrar:</span>
                <select id="recordsPerPage" class="px-3 py-1.5 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-primary-link outline-none transition">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                    <option value="todos">Todos</option>
                </select>
                <span id="totalLabel" class="text-xs text-gray-400 ml-4 font-bold uppercase tracking-widest">Calculando...</span>
            </div>

            <div class="flex items-center space-x-2">
                <button id="prevPageBtn" class="bg-gray-200 text-gray-700 hover:bg-gray-300 px-3 py-1.5 rounded-lg transition disabled:opacity-30">
                    <i data-lucide="chevron-left" class="h-4 w-4"></i>
                </button>
                <span id="pageInfo" class="text-sm text-gray-700 font-bold px-4 py-1.5 bg-gray-100 rounded-lg border border-gray-200">Página 1 / 1</span>
                <button id="nextPageBtn" class="bg-gray-200 text-gray-700 hover:bg-gray-300 px-3 py-1.5 rounded-lg transition disabled:opacity-30">
                    <i data-lucide="chevron-right" class="h-4 w-4"></i>
                </button>
            </div>
        </div>

        <div class="overflow-x-auto shadow-2xl rounded-xl border border-gray-100 bg-white">
            <table class="min-w-full divide-y divide-gray-200 text-sm">
                <thead class="bg-primary-link text-white text-[11px] uppercase tracking-widest font-black">
                    <tr>
                        <th class="px-4 py-4 text-left cursor-pointer" onclick="sortTable('numero_albaran')">
                            <div class="sortable">Nº Albarán <i data-lucide="chevrons-up-down" class="w-3 h-3"></i></div>
                        </th>
                        <th class="px-4 py-4 text-left cursor-pointer" onclick="sortTable('fecha')">
                            <div class="sortable">Fecha <i data-lucide="chevrons-up-down" class="w-3 h-3"></i></div>
                        </th>
                        <th class="px-4 py-4 text-left">Licencia</th>
                        <th class="px-4 py-4 text-left">Empresa</th>
                        <th class="px-4 py-4 text-left">Referencia</th>
                        <th class="px-4 py-4 text-left">Conductor</th>
                        <th class="px-4 py-4 text-right">Importe</th>
                        <th class="px-4 py-4 text-center">Estado</th>
                        <th class="px-4 py-4 text-left">Observaciones</th>
                        <th class="px-4 py-4 text-center">Acciones</th>
                    </tr>
                </thead>
                
                <tbody id="albaranResults" class="bg-white divide-y divide-gray-100">
                    <tr>
                        <td colspan="10" class="text-center py-20 text-gray-400 italic">
                            Cargando albaranes enviados...
                        </td>
                    </tr>
                </tbody>

                <tfoot id="albaranTotal" class="bg-primary-pastel/10 font-bold text-gray-800"></tfoot>
            </table>
        </div>

        <div id="statusMessage" class="hidden status-message"></div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });
    </script>
</body>
</html>
