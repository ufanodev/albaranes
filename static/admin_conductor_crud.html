<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Conductores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="/js/security.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/conductores_cargar.js"></script> 
    <script src="/js/admin_conductor_crud.js" defer></script> 
    
    <style>
        /* 🎨 Configuración de Fuente y Estilos Base */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; color: #1f2937; line-height: 1.6; }
        /* 🧩 INPUTS Y FORMULARIOS */
        .input-field { @apply w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-800 transition duration-150 ease-in-out text-base shadow-sm; }
        .input-field:focus { @apply outline-none border-teal-500 ring-2 ring-teal-300; }
        .input-field:disabled, .input-field[readonly] { @apply bg-gray-100 text-gray-500 cursor-default; }
        /* 🏷️ TÍTULOS DE SECCIÓN */
        .section-title { @apply text-xl font-bold text-teal-700 mb-4 border-b-2 border-teal-200 pb-2 mt-8; }
        /* 🎛️ BOTONES GENERALES */
        .action-button { @apply inline-flex items-center justify-center font-semibold py-2.5 px-6 rounded-lg shadow-md cursor-pointer transition duration-300 transform text-white focus:outline-none hover:scale-[1.02] focus:ring-4 text-sm; }
        /* Botones específicos */
        .btn-crear { @apply bg-teal-600 hover:bg-teal-700 focus:ring-teal-300 shadow-teal-400/50; }
        .btn-modificar { @apply bg-indigo-600 hover:bg-indigo-700 focus:ring-indigo-300 shadow-indigo-400/50; }
        .btn-borrar { @apply bg-red-600 hover:bg-red-700 focus:ring-red-300 shadow-red-400/50; }
        .btn-volver { @apply bg-gray-500 hover:bg-gray-600 focus:ring-gray-300 shadow-gray-400/50; }
        /* 💬 MENSAJES DE ESTADO */
        .status-message { @apply mt-6 p-4 text-center font-medium rounded-lg; }
        .status-success { @apply bg-green-100 text-green-800 border border-green-300; }
        .status-error { @apply bg-red-100 text-red-800 border border-red-300; }
        .status-info { @apply bg-blue-100 text-blue-800 border border-blue-300; }
    </style>
</head>
<body class="p-4 sm:p-8 lg:p-12">

    <div class="max-w-3xl mx-auto bg-white shadow-2xl rounded-xl p-6 md:p-10">
        <h1 id="mainTitle" class="text-3xl font-extrabold text-teal-800 text-center mb-8 border-b pb-3">
            Administración de Conductores 🧑‍✈️
        </h1>

        <form id="conductorForm"> 

            <div class="section-title !mt-0">Datos de Identificación</div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>
                    <label for="licencia" class="block text-sm font-medium text-gray-600 mb-1">
                        LICENCIA *
                    </label>
                    <input type="text" id="licencia" name="licencia" required
                            placeholder="Ej: 007"
                            class="input-field font-bold text-teal-700">
                </div>

                <div>
                    <label for="conductor" class="block text-sm font-medium text-gray-600 mb-1">
                        Nº CONDUCTOR *
                    </label>
                    <input type="text" id="conductor" name="conductor" required
                            placeholder="Ej: 15"
                            class="input-field">
                </div>
            </div>

            <div class="mt-6">
                <label for="nombre" class="block text-sm font-medium text-gray-600 mb-1">
                    NOMBRE Y APELLIDOS *
                </label>
                <input type="text" id="nombre" name="nombre" required
                        placeholder="Nombre completo del conductor"
                        class="input-field">
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-600 mb-1">EMAIL</label>
                    <input type="email" id="email" name="email"
                            placeholder="correo@ejemplo.com"
                            class="input-field">
                </div>

                <div>
                    <label for="telefono" class="block text-sm font-medium text-gray-600 mb-1">TELÉFONO</label>
                    <input type="tel" id="telefono" name="telefono" 
                            placeholder="Ej: 600123456"
                            class="input-field">
                </div>
            </div>


            <div class="mt-10 pt-6 border-t border-gray-200 flex flex-wrap justify-center gap-4">
                
                <button type="submit" id="btnCrear"
                        class="action-button btn-crear" style="display:none;">
                    <span class="mr-2">💾</span> Guardar Conductor (Crear)
                </button>

                <button type="button" id="btnModificar" onclick="handleAction('modificar')"
                        class="action-button btn-modificar" style="display:none;">
                    <span class="mr-2">✏️</span> Guardar Cambios
                </button>

                <button type="button" id="btnBorrar" onclick="handleAction('borrar')"
                        class="action-button btn-borrar" style="display:none;">
                    <span class="mr-2">🗑️</span> Borrar
                </button>
                
                <button type="button" id="btnVolver" onclick="handleAction('volver')"
                        class="action-button btn-volver" style="display:none;">
                    <span class="mr-2">🔙</span> Volver
                </button>
            </div>
            
            <div id="statusMessage" class="hidden status-message" role="alert"></div>

        </form>
    </div>

    <script src="/js/conductores_cargar.js"></script> 
    <script src="/js/admin_conductor_crud.js" defer></script> 
</body>
</html>
