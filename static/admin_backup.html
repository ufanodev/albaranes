<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administración de Backup</title>
    <script src="https://cdn.tailwindcss.com"></script>

        <script src="/js/security.js"></script>
    <script src="/js/utils.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'backup-primary': '#059669', // Emerald 600
                        'backup-hover': '#047857', // Emerald 700
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f9;
            color: #1f2937;
        }

        /* Estilo general de los botones de la página principal */
        .admin-button {
            @apply flex flex-col items-center justify-center p-6 rounded-xl shadow-lg 
                   transition duration-300 transform text-center font-bold text-sm
                   hover:scale-[1.03] hover:shadow-xl focus:outline-none focus:ring-4;
        }

        /* Estilo para el mensaje de estado */
        .status-message {
            @apply mt-8 p-4 text-center font-semibold rounded-lg text-lg border-2;
        }
        .status-success { @apply bg-green-100 text-green-800 border-green-300; }
        .status-info { @apply bg-blue-100 text-blue-800 border-blue-300; }
        .status-error { @apply bg-red-100 text-red-800 border-red-300; }

        /* Colores de los botones de CRUD para consistencia */
        .action-button {
            @apply inline-flex items-center justify-center font-semibold py-2.5 px-6 rounded-lg 
                   shadow-md cursor-pointer transition duration-300 transform text-white focus:outline-none 
                   hover:scale-[1.02] focus:ring-4 text-sm;
        }
        
        .btn-crear {
            @apply bg-violet-600 hover:bg-violet-700 focus:ring-violet-300 shadow-violet-400/50 text-white;
        }
        .btn-modificar {
            @apply bg-indigo-600 hover:bg-indigo-700 focus:ring-indigo-300 shadow-indigo-400/50 text-white;
        }
        .btn-borrar {
            @apply bg-red-600 hover:bg-red-700 focus:ring-red-300 shadow-red-400/50 text-white;
        }
        .btn-volver {
            @apply bg-gray-500 text-white hover:bg-gray-600 focus:ring-gray-300;
        }
    </style>
</head>
<body class="p-4 sm:p-8 lg:p-12">

    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-xl p-6 md:p-10">
        <h1 class="text-3xl font-extrabold text-backup-primary text-center mb-10 border-b pb-3">
            Administración: Copias de Seguridad (Backup) 💾
        </h1>

        <div id="statusMessage" class="hidden status-message status-success"></div>

        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-6">
            
            <button type="button" onclick="handleBackup('Titulares')"
                    class="admin-button bg-backup-primary text-white hover:bg-backup-hover focus:ring-green-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                Titulares
            </button>

            <button type="button" onclick="handleBackup('Albaranes')"
                    class="admin-button bg-backup-primary text-white hover:bg-backup-hover focus:ring-green-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
                Albaranes
            </button>

            <button type="button" onclick="handleBackup('Conductores')"
                    class="admin-button bg-backup-primary text-white hover:bg-backup-hover focus:ring-green-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
                Conductores
            </button>

            <button type="button" onclick="handleBackup('Usuarios')"
                    class="admin-button bg-backup-primary text-white hover:bg-backup-hover focus:ring-green-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5L16 19L11.5 14.5"/><path d="M16 19.001V5.001"/><path d="M3.5 12h-2"/><path d="M22.5 12h-2"/><path d="M12 2.5v-2"/><path d="M12 21.5v-2"/></svg>
                Usuarios
            </button>

             <button type="button" onclick="handleBackup('Todas las Categorías')"
                     class="admin-button bg-green-700 text-white hover:bg-green-800 focus:ring-green-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Todas
            </button>
            
            <button type="button" onclick="handleAction('volver')"
                    class="admin-button btn-volver">
                <span class="mr-2">🔙</span> Volver
            </button>

        </div>
        
    </div>

    <script>
        const statusMessage = document.getElementById('statusMessage');

        // Función para limpiar el estado y mostrar el mensaje
        function displayMessage(text, type) {
            statusMessage.textContent = text;
            statusMessage.classList.remove('hidden', 'status-success', 'status-info', 'status-error');
            
            if (type === 'success') {
                statusMessage.classList.add('status-success');
            } else if (type === 'info') {
                statusMessage.classList.add('status-info');
            } else if (type === 'error') {
                statusMessage.classList.add('status-error');
            }
            
            // Ocultar el mensaje después de 5 segundos
            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 5000);
        }

        // Maneja la acción de backup para una categoría específica
        function handleBackup(category) {
            // El mensaje ahora NO incluye las llaves {}
            const message = `✅ Backup de ${category} realizado`;
            displayMessage(message, 'success');
        }

        // Maneja las acciones genéricas (Crear, Modificar, Borrar, Volver)
        function handleAction(actionType) {
            let message = '';
            let type = 'info'; // Por defecto es info para acciones generales

            switch (actionType) {
                case 'crear':
                    message = '➕ Simulación: Proceso de creación/inicialización iniciado correctamente.';
                    type = 'success';
                    break;
                case 'modificar':
                    message = '⚙️ Simulación: Configuración modificada. Se requieren permisos de administrador.';
                    type = 'info';
                    break;
                case 'borrar':
                    if (confirm('⚠️ ¿Desea continuar con la acción de limpieza?')) {
                        message = '❌ Simulación: Logs o datos temporales han sido limpiados.';
                        type = 'error';
                    } else {
                        return;
                    }
                    break;
                case 'volver':
                    // Redirige al usuario a la página 'admin.html'
                    window.location.href = 'admin.html';
                    return; 
                default:
                    return;
            }
            // Muestra el mensaje solo si no es la acción 'volver'
            if (actionType !== 'volver') {
                displayMessage(message, type);
            }
        }
    </script>
</body>
</html>
