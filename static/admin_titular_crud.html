<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Titulares</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/security.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/licencias_cargar.js"></script>
    <script src="/js/admin_titular_crud.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Definición de la Paleta de Colores Estandarizada */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        /* 🌐 BASE DEL DOCUMENTO */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f9; /* Fondo suave */
            color: #1f2937; /* Texto oscuro (gray-800) */
            line-height: 1.6;
        }

        /* 🧩 INPUTS Y FORMULARIOS (Clase reutilizable: .input-field) */
        .input-field {
            /* Estilo base */
            @apply w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-800
                   transition duration-200 ease-in-out text-base shadow-sm; 
        }

        .input-field:focus {
            /* Foco estandarizado: Color Primario (Indigo) */
            @apply outline-none border-indigo-600 ring-2 ring-indigo-300;
        }

        /* 🏷️ TÍTULOS DE SECCIÓN (Estandarizado con color primario) */
        .section-title {
            @apply text-xl font-bold text-indigo-700 mb-4 border-b-2 border-indigo-200 pb-2 mt-8;
        }

        /* 🎛️ BOTONES GENERALES */
        .action-button {
            /* Estilo base mejorado */
            @apply inline-flex items-center justify-center font-semibold py-2.5 px-6 rounded-lg 
                   shadow-md cursor-pointer transition duration-300 transform text-white focus:outline-none 
                   hover:scale-[1.02] focus:ring-4 text-sm;
        }
        
        /* Botones específicos (Usando la paleta estandarizada) */
        .btn-crear {
            @apply bg-green-600 hover:bg-green-700 focus:ring-green-300 shadow-green-400/50;
        }

        .btn-modificar {
            /* Color Primario: Indigo */
            @apply bg-indigo-600 hover:bg-indigo-700 focus:ring-indigo-300 shadow-indigo-400/50;
        }

        .btn-borrar {
            /* Color Peligro: Red */
            @apply bg-red-600 hover:bg-red-700 focus:ring-red-300 shadow-red-400/50;
        }

        .btn-volver {
            /* Color Gris Neutral */
            @apply bg-gray-500 hover:bg-gray-600 focus:ring-gray-300 shadow-gray-400/50;
        }
        
        /* Estado deshabilitado para botones */
        .action-button:disabled {
            @apply opacity-50 cursor-not-allowed transform-none shadow-none hover:scale-100;
        }

        /* 💬 MENSAJES DE ESTADO */
        .status-message {
            @apply mt-6 p-4 text-center font-medium rounded-lg;
        }

        .status-success { @apply bg-green-100 text-green-800 border border-green-300; }
        .status-error { @apply bg-red-100 text-red-800 border border-red-300; }
        .status-info { @apply bg-indigo-100 text-indigo-800 border border-indigo-300; }
        .status-neutral { @apply bg-gray-200 text-gray-700 border border-gray-300; }

    </style>
</head>
<body class="p-4 sm:p-8 lg:p-12">

    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-xl p-6 md:p-10">
        <h1 id="mainTitle" class="text-4xl font-extrabold text-indigo-800 text-center mb-10 border-b pb-3">
            Gestión Datos de Titulares 👤
        </h1>

        <form id="titularForm" onsubmit="handleFormSubmit(event)">

            <input type="hidden" id="titularId" name="titularId" value="">
            <input type="hidden" id="currentMode" name="currentMode" value="create">

            <div class="section-title">🔑 Datos de Identificación</div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <div>
                    <label for="licencia" class="block text-sm font-medium text-gray-700 mb-1">
                        LICENCIA <span class="text-red-600 text-lg">*</span>
                    </label>
                    <input type="number" id="licencia" name="licencia" required
                            placeholder="Ej: 804"
                            class="input-field border-indigo-400 focus:border-indigo-600 focus:ring-indigo-300 font-bold">
                </div>

                <div>
                    <label for="dni" class="block text-sm font-medium text-gray-700 mb-1">
                        DNI / CIF
                    </label>
                    <input type="text" id="dni" name="dni"
                            placeholder="12345678Z"
                            class="input-field uppercase">
                </div>

                <div class="md:col-span-1">
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">
                        Nombre / Razón Social
                    </label>
                    <input type="text" id="nombre" name="nombre"
                            placeholder="Nombre completo o empresa"
                            class="input-field">
                </div>
            </div>

            <div class="section-title">📞 Contacto y Acceso</div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                        Email
                    </label>
                    <input type="email" id="email" name="email"
                            placeholder="usuario@ejemplo.com"
                            class="input-field">
                </div>

                <div>
                    <label for="telefono" class="block text-sm font-medium text-gray-700 mb-1">
                        Teléfono Fijo
                    </label>
                    <input type="tel" id="telefono" name="telefono"
                            placeholder="9XX XXX XXX"
                            class="input-field">
                </div>

                <div>
                    <label for="movil" class="block text-sm font-medium text-gray-700 mb-1">
                        Móvil
                    </label>
                    <input type="tel" id="movil" name="movil"
                            placeholder="6XX XXX XXX"
                            class="input-field">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
                <div>
                    <label for="userlevel" class="block text-sm font-medium text-gray-700 mb-1">
                        Nivel de Usuario (Userlevel)
                    </label>
                    <select id="userlevel" name="userlevel"
                            class="input-field appearance-none">
                        <option value="" disabled selected>Seleccione un nivel</option>
                        <option value="1">Administrador</option>
                        <option value="2">Operador</option>
                        <option value="3">Solo Lectura</option>
                    </select>
                </div>

                <div>
                    <label for="pwd" class="block text-sm font-medium text-gray-700 mb-1">
                        Contraseña (PWD)
                    </label>
                    <input type="password" id="pwd" name="pwd"
                            placeholder="**********"
                            class="input-field">
                </div>
                <div class="hidden md:block"></div> 
            </div>

            <div class="section-title">📍 Datos de Domicilio</div>
            
            <div class="p-4 bg-indigo-50 rounded-lg border border-indigo-200">
              <label for="direccion" class="block text-sm font-medium text-gray-700 mb-1">
                Dirección (Calle y Número)
              </label>
              <input type="text" id="direccion" name="direccion"
                      placeholder="Calle Mayor, 123"
                      class="input-field w-full">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mt-6">
                
                <div>
                    <label for="cp" class="block text-sm font-medium text-gray-700 mb-1">
                        Código Postal (CP)
                    </label>
                    <input type="text" id="cp" name="cp"
                            placeholder="46001"
                            class="input-field">
                </div>

                <div class="md:col-span-1">
                    <label for="poblacion" class="block text-sm font-medium text-gray-700 mb-1">
                        Población
                    </label>
                    <input type="text" id="poblacion" name="poblacion"
                            placeholder="Valencia"
                            class="input-field">
                </div>

                <div class="md:col-span-2">
                    <label for="provincia" class="block text-sm font-medium text-gray-700 mb-1">
                        Provincia
                    </label>
                    <input type="text" id="provincia" name="provincia"
                            placeholder="Valencia / València"
                            class="input-field">
                </div>
            </div>

            <div class="section-title">🧾 Facturación y Vehículo</div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label for="serie_factura" class="block text-sm font-medium text-gray-700 mb-1">
                        Serie Factura
                    </label>
                    <input type="text" id="serie_factura" name="serie_factura"
                            placeholder="Ej: SFTX"
                            class="input-field uppercase">
                </div>

                <div>
                    <label for="n_proxima_factura" class="block text-sm font-medium text-gray-700 mb-1">
                        Nº Próxima Factura
                    </label>
                    <input type="number" id="n_proxima_factura" name="n_proxima_factura"
                            placeholder="1"
                            class="input-field text-right">
                </div>

                <div>
                    <label for="matricula_taxi" class="block text-sm font-medium text-gray-700 mb-1">
                        Matrícula Taxi
                    </label>
                    <input type="text" id="matricula_taxi" name="matricula_taxi"
                            placeholder="1234ABC"
                            class="input-field uppercase">
                </div>
            </div>

            <div class="mt-8 p-4 bg-gray-100 rounded-lg border border-gray-300 shadow-inner">
              <label for="observaciones" class="block text-sm font-medium text-gray-700 mb-1">
                Observaciones
              </label>
              <textarea id="observaciones" name="observaciones" rows="4"
                        placeholder="Escriba aquí cualquier nota relevante sobre este usuario/cliente..."
                        class="input-field w-full"></textarea>
              <p id="wordCount" class="text-right text-xs text-gray-500 mt-1">0 palabras</p>
            </div>

            <div class="mt-10 pt-6 border-t border-gray-200 flex flex-wrap justify-center gap-4">
                
                <button type="submit" id="btn-crear"
                        class="action-button btn-crear">
                    <span class="mr-2">➕</span> Crear
                </button>

                <button type="button" id="btn-modificar" onclick="handleAction('modificar')"
                        class="action-button btn-modificar">
                    <span class="mr-2">✏️</span> Modificar
                </button>

                <button type="button" id="btn-borrar" onclick="handleAction('borrar')"
                        class="action-button btn-borrar">
                    <span class="mr-2">🗑️</span> Borrar
                </button>
                
                <button type="button" onclick="handleAction('volver')"
                        class="action-button btn-volver">
                    <span class="mr-2">🔙</span> Volver
                </button>
            </div>
            
            <div id="statusMessage" class="hidden status-message" role="alert"></div>

        </form>
    </div>
</body>
</html>
