<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo Albarán - Panel Titular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/security.js"></script>
    <script src="/js/albaran_nuevo.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'primary-pastel': '#FFDAB9', 'primary-link': '#FF8C00' }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        @layer components {
            body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
            .input-field { @apply w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl shadow-inner outline-none transition-all duration-200 text-gray-800 text-sm font-bold; }
            .input-field:focus { @apply bg-white border-primary-link ring-4 ring-orange-100 shadow-none; }
            .label-style { @apply block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1 tracking-tighter; }
            .checkbox-inline { @apply flex items-center space-x-2 bg-slate-100 px-3 py-2 rounded-lg shadow-inner border border-slate-200 hover:bg-white transition cursor-pointer h-full; }
            .input-dark { @apply bg-transparent border-none text-right font-black text-primary-link outline-none focus:ring-0 p-0; }
        }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="max-w-7xl mx-auto bg-white shadow-2xl rounded-[2rem] overflow-hidden border border-slate-100">
        <div class="bg-gradient-to-r from-primary-pastel to-orange-100 p-6 flex justify-between items-center border-b border-orange-200">
            <h1 class="text-2xl font-black text-slate-800 flex items-center italic">
                <i data-lucide="file-plus-2" class="mr-3 text-primary-link"></i> REGISTRO DE ALBARÁN
            </h1>
            <button onclick="window.location.href='/titulares'" class="bg-slate-800 text-white px-5 py-2 rounded-xl font-bold hover:bg-black transition flex items-center shadow-lg text-sm">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> VOLVER
            </button>
        </div>

        <form id="albaranForm" class="p-6 md:p-10 space-y-8" onsubmit="handleAction('crear', event)">
            <div class="space-y-4">
                <h2 class="text-xs font-black text-slate-300 uppercase tracking-[0.2em] border-b pb-1">1. Identificación del Servicio</h2>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                    <div class="md:col-span-1">
                        <label class="label-style">Lic. Ref</label>
                        <input type="text" id="licencia" readonly class="input-field bg-slate-200 cursor-not-allowed text-center p-1">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style">Nº Albarán *</label>
                        <input type="text" name="numero_albaran" id="n_albaran" required class="input-field font-black text-primary-link uppercase">
                    </div>
                    <div class="md:col-span-3">
                        <label class="label-style">Referencia / Expediente</label>
                        <input type="text" name="referencia" class="input-field uppercase" placeholder="Ej: REF-999888">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style">Fecha *</label>
                        <input type="date" name="fecha" id="fecha" required class="input-field">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style text-primary-link font-black">Hora Ini *</label>
                        <input type="time" name="hora_ini" required class="input-field">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style">Hora Fin</label>
                        <input type="time" name="hora_fin" class="input-field">
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="text-xs font-black text-slate-300 uppercase tracking-[0.2em] border-b pb-1">2. Cliente y Pasajero</h2>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                    <div class="md:col-span-3">
                        <label class="label-style">Empresa Ref *</label>
                        <select id="empresa" name="empresa_ref" required class="input-field font-semibold"></select>
                    </div>
                    <div class="md:col-span-3">
                        <label class="label-style">Nombre Pasajero</label>
                        <input type="text" name="nombre_pasajero" class="input-field" placeholder="Nombre completo">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style">Teléfono</label>
                        <input type="text" name="tlf_pasajero" class="input-field" placeholder="Móvil">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style">DNI Pasajero</label>
                        <input type="text" name="dni_pasajero" class="input-field uppercase" placeholder="DNI/NIE">
                    </div>
                    <div class="md:col-span-2">
                        <label class="label-style">Matrícula</label>
                        <input type="text" name="matricula" maxlength="15" class="input-field font-bold uppercase" placeholder="Placa">
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="text-xs font-black text-slate-300 uppercase tracking-[0.2em] border-b pb-1">3. Ruta y Tiempos de Espera</h2>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                    <div class="md:col-span-4">
                        <label class="label-style">Origen *</label>
                        <input type="text" name="origen" required class="input-field" placeholder="Lugar de recogida">
                    </div>
                    <div class="md:col-span-4">
                        <label class="label-style">Parada / Vía</label>
                        <input type="text" name="parada" class="input-field" placeholder="Punto intermedio">
                    </div>
                    <div class="md:col-span-4">
                        <label class="label-style">Destino *</label>
                        <input type="text" name="destino" required class="input-field" placeholder="Lugar de llegada">
                    </div>
                    <div class="md:col-span-4">
                        <label class="label-style">Espera Total (HH.mm)</label>
                        <input type="text" inputmode="decimal" name="hora_total" class="input-field font-bold text-orange-600" placeholder="0.00">
                    </div>
                    <div class="md:col-span-4">
                        <label class="label-style">Espera Inicio</label>
                        <input type="time" name="espera_ini" class="input-field">
                    </div>
                    <div class="md:col-span-4">
                        <label class="label-style">Espera Fin</label>
                        <input type="time" name="espera_fin" class="input-field">
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="text-xs font-black text-slate-300 uppercase tracking-[0.2em] border-b pb-1">4. Control de Kilometraje</h2>
                <div class="bg-slate-50 p-6 rounded-3xl border border-slate-200 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <label class="checkbox-inline">
                            <input type="checkbox" name="urbano" class="w-4 h-4 text-orange-500">
                            <span class="text-[10px] font-black uppercase ml-2">Servicio Urbano</span>
                        </label>
                        <label class="checkbox-inline">
                            <input type="checkbox" name="diurno" class="w-4 h-4 text-blue-500" checked>
                            <span class="text-[10px] font-black uppercase ml-2">Servicio Diurno</span>
                        </label>
                        <label class="checkbox-inline">
                            <input type="checkbox" name="noct_fest" class="w-4 h-4 text-purple-600">
                            <span class="text-[10px] font-black uppercase ml-2">Nocturno / Festivo</span>
                        </label>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                        <div>
                            <label class="label-style text-primary-link font-black">Kms Totales *</label>
                            <input type="number" step="0.01" name="km_totales" required class="input-field bg-white border-primary-link text-right" placeholder="0.00">
                        </div>
                        <div>
                            <label class="label-style">Kms Nacionales</label>
                            <input type="number" step="0.01" name="km_nacionales" class="input-field text-right" placeholder="0.00">
                        </div>
                        <div>
                            <label class="label-style">Kms Internacionales</label>
                            <input type="number" step="0.01" name="km_internacionales" class="input-field text-right" placeholder="0.00">
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="text-xs font-black text-slate-300 uppercase tracking-[0.2em] border-b pb-1">5. Liquidación e Importes</h2>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                    <div class="md:col-span-9 space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                            <div class="md:col-span-2">
                                <label class="label-style text-orange-600">Suplidos (€)</label>
                                <input type="number" step="0.01" name="importe_suplidos" class="input-field border-orange-100" value="0.00">
                            </div>
                            <div class="md:col-span-5">
                                <label class="label-style">Autorizado Por</label>
                                <input type="text" name="autorizado_por" class="input-field uppercase font-bold" placeholder="QUIEN AUTORIZA">
                            </div>
                            <div class="md:col-span-5">
                                <label class="label-style text-primary-link font-black">Nombre Conductor</label>
                                <input type="text" name="asalariado" class="input-field border-orange-200 uppercase" placeholder="NOMBRE DEL CONDUCTOR">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                            <div class="md:col-span-3">
                                <label class="checkbox-inline w-full">
                                    <input type="checkbox" name="remolque" class="w-4 h-4">
                                    <span class="text-[9px] font-black uppercase ml-2">Remolque</span>
                                </label>
                            </div>
                            <div class="md:col-span-3">
                                <label class="label-style">Plazas Vehículo</label>
                                <select name="num_plazas" class="input-field font-bold">
                                    <option value="4" selected>4 Plazas</option>
                                    <option value="5">5 Plazas</option>
                                    <option value="7">7 Plazas</option>
                                    <option value="8">8 Plazas</option>
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label class="checkbox-inline w-full border-blue-200 bg-blue-50">
                                    <input type="checkbox" name="adjuntos_bool" class="w-4 h-4 text-blue-600">
                                    <span class="text-[9px] font-black uppercase ml-2">Adjuntos</span>
                                </label>
                            </div>
                            <div class="md:col-span-4">
                                <label class="label-style">Referencia / Nº Adjuntos</label>
                                <input type="text" name="adjuntos" class="input-field border-blue-100" placeholder="Ej: 3 tickets">
                            </div>
                        </div>

                        <div>
                            <label class="label-style">Observaciones</label>
                            <textarea name="observaciones" rows="3" class="input-field italic w-full resize-none p-4" placeholder="Desglose detallado..."></textarea>
                        </div>
                    </div>

                    <div class="md:col-span-3 bg-slate-900 p-6 rounded-[2rem] border-4 border-primary-pastel shadow-2xl h-fit self-start mt-5">
                        <div class="flex flex-col items-center">
                            <label class="text-[11px] font-black text-white uppercase tracking-tighter mb-2">Importe Total *</label>
                            <div class="flex items-center justify-center">
                                <span class="text-2xl font-black text-white mr-2">€</span>
                                <input type="number" step="0.01" id="importe_total" name="importe_total" required class="input-dark text-4xl w-full text-center" placeholder="0.00">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col items-center pt-8 border-t border-slate-100">
                <button type="submit" class="bg-primary-link text-white font-black py-5 px-24 rounded-2xl shadow-2xl hover:bg-slate-800 transition-all hover:scale-105 active:scale-95 flex items-center gap-4 text-xl uppercase tracking-[0.2em]">
                    <i data-lucide="save" class="w-7 h-7"></i> Guardar Albarán
                </button>
                <div id="statusMessage" class="hidden mt-6 p-4 rounded-xl text-center font-bold w-full max-w-md border-2"></div>
            </div>
        </form>
    </div>
    <script>if(window.lucide) lucide.createIcons();</script>
</body>
</html>
