<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Nuevo Albarán - Panel Titular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/security.js"></script>
    <script src="/js/albaran_nuevo.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'primary-pastel': '#FFDAB9', 'primary-link': '#FF8C00' } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        
        /* Inputs con fondo sombreado y profundidad */
        .input-field { 
            @apply w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl shadow-inner outline-none transition-all duration-200 text-gray-800; 
        }
        .input-field:focus { 
            @apply bg-white border-primary-link ring-4 ring-orange-100 shadow-none; 
        }
        .section-title { @apply text-lg font-black text-slate-700 mb-6 border-b-4 border-primary-pastel pb-2 flex items-center mt-10 uppercase tracking-tighter; }
        
        /* Checkboxes integrados */
        .checkbox-inline { @apply flex items-center space-x-2 bg-slate-100 px-3 py-2 rounded-lg shadow-inner border border-slate-200 hover:bg-white transition cursor-pointer; }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="max-w-6xl mx-auto bg-white shadow-2xl rounded-[2rem] overflow-hidden border border-slate-100">
        
        <div class="bg-gradient-to-r from-primary-pastel to-orange-100 p-6 flex justify-between items-center border-b border-orange-200">
            <h1 class="text-2xl font-black text-slate-800 flex items-center">
                <i data-lucide="file-plus-2" class="mr-3 text-primary-link"></i> NUEVO ALBARÁN
            </h1>
            <button onclick="window.location.href='/titulares'" class="bg-slate-800 text-white px-5 py-2 rounded-xl font-bold hover:bg-black transition flex items-center shadow-lg">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> VOLVER
            </button>
        </div>

        <form id="albaranForm" class="p-6 md:p-10" onsubmit="handleAction('crear', event)">
            
            <div class="section-title !mt-0 text-slate-800">
                <span class="bg-primary-link text-white w-7 h-7 rounded-full flex items-center justify-center mr-3 text-xs">1</span>
                Identificación y Trayecto
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Nº Albarán *</label>
                    <input type="text" name="numero_albaran" id="n_albaran" required class="input-field font-black text-primary-link">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Fecha *</label>
                    <input type="date" name="fecha" id="fecha" required class="input-field">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Licencia Ref</label>
                    <input type="text" id="licencia" name="licencia_ref" readonly class="input-field bg-slate-200 cursor-not-allowed font-bold">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Empresa Ref *</label>
                    <select id="empresa" name="empresa_ref" required class="input-field font-semibold"></select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Referencia Expediente</label>
                    <input type="text" name="referencia" class="input-field" placeholder="Nº Expediente">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Asalariado / Conductor</label>
                    <select id="asalariado_select" name="asalariado" class="input-field"></select>
                </div>
                <div class="flex items-end gap-2">
                    <label class="checkbox-inline flex-1"><input type="checkbox" id="festivo" name="festivo" class="w-4 h-4 text-primary-link"> <span class="text-[10px] font-black uppercase">Festivo</span></label>
                    <label class="checkbox-inline flex-1"><input type="checkbox" id="finalizado" name="finalizado" class="w-4 h-4 text-green-600"> <span class="text-[10px] font-black uppercase">Finalizado</span></label>
                </div>
            </div>

            <div class="section-title text-slate-800">
                <span class="bg-primary-link text-white w-7 h-7 rounded-full flex items-center justify-center mr-3 text-xs">2</span>
                Tarifas y Datos Pasajero
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-8 items-end">
                <div class="lg:col-span-5 flex gap-2">
                    <label class="checkbox-inline flex-1"><input type="checkbox" id="urbano" name="urbano"> <span class="text-[10px] font-bold uppercase">Urbano</span></label>
                    <label class="checkbox-inline flex-1"><input type="checkbox" id="diurno" name="diurno"> <span class="text-[10px] font-bold uppercase">Diurno</span></label>
                    <label class="checkbox-inline flex-1"><input type="checkbox" id="noct_fest" name="noct_fest"> <span class="text-[10px] font-bold uppercase">Noct/Fest</span></label>
                </div>
                <div class="lg:col-span-3">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">DNI Pasajero</label>
                    <input type="text" name="dni_pasajero" id="dni_pasajero" class="input-field uppercase font-mono" placeholder="12345678X">
                </div>
                <div class="lg:col-span-4">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Matrícula Vehículo</label>
                    <input type="text" name="matricula" id="matricula" class="input-field uppercase font-mono" placeholder="0000-BBB">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div class="md:col-span-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Nombre Pasajero / Cliente</label>
                    <input type="text" name="cliente" id="cliente" class="input-field" placeholder="Nombre completo">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Origen</label>
                    <textarea name="origen" rows="1" class="input-field"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Destino</label>
                    <textarea name="destino" rows="1" class="input-field"></textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Parada</label>
                    <input type="text" name="parada" class="input-field">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 bg-slate-100 p-4 rounded-2xl shadow-inner border border-slate-200">
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase mb-1 ml-1">Km Totales</label>
                    <input type="number" step="0.01" name="km_totales" class="input-field text-right font-black" placeholder="0.00">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase mb-1 ml-1">Km Nacionales</label>
                    <input type="number" step="0.01" name="km_nacionales" class="input-field text-right" placeholder="0.00">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase mb-1 ml-1">Km Internac.</label>
                    <input type="number" step="0.01" name="km_internacionales" class="input-field text-right" placeholder="0.00">
                </div>
            </div>

            <div class="section-title text-slate-800">
                <span class="bg-primary-link text-white w-7 h-7 rounded-full flex items-center justify-center mr-3 text-xs">3</span>
                Liquidación de Importes y Extras
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Hora Recogida</label>
                    <input type="time" name="hora" id="hora_rec" class="input-field">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Tiempo Espera</label>
                    <input type="time" name="tiempo_espera" class="input-field">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Nº Plazas</label>
                    <input type="number" name="num_plazas" class="input-field text-center font-bold" value="4">
                </div>
                <div class="flex items-center pt-4">
                    <label class="checkbox-inline w-full"><input type="checkbox" id="enganche" name="enganche"> <span class="text-[10px] font-black uppercase">Enganche</span></label>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 items-end">
                <div class="md:col-span-1">
                    <label class="block text-[10px] font-black text-orange-600 uppercase mb-1 ml-1">Importe Suplidos (€)</label>
                    <input type="number" step="0.01" name="importe_suplidos" class="input-field text-right border-orange-200 bg-orange-50 font-bold" value="0.00">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Autorizado Por</label>
                    <input type="text" name="autorizado_por" class="input-field" placeholder="Nombre">
                </div>
                <div class="bg-slate-900 p-4 rounded-2xl shadow-xl border-4 border-primary-pastel">
                    <label class="block text-[10px] font-black text-primary-pastel uppercase mb-1 text-center">Importe Total Albarán</label>
                    <div class="flex items-center justify-center">
                        <span class="text-xl font-black text-white mr-2">€</span>
                        <input type="number" step="0.01" name="importe_total" required class="bg-transparent border-none w-full text-right font-black text-3xl text-primary-link outline-none focus:ring-0" placeholder="0.00">
                    </div>
                </div>
            </div>

            <div class="w-full mt-8">
                <label class="block text-[11px] font-black text-slate-400 uppercase mb-2 ml-1 tracking-widest">
                    Observaciones / Incidencias del Servicio
                </label>
                <div class="relative">
                    <textarea 
                        name="observaciones" 
                        id="observaciones" 
                        rows="4" 
                        class="input-field italic w-full resize-none p-4" 
                        placeholder="Escriba aquí cualquier detalle relevante sobre el trayecto, equipaje especial, incidencias con el tráfico, etc..."></textarea>
                    
                    <div class="flex justify-end mt-2">
                        <p id="wordCount" class="text-[10px] font-black text-slate-400 uppercase tracking-widest bg-slate-100 px-3 py-1 rounded-full shadow-inner border border-slate-200">
                            0 palabras registradas
                        </p>
                    </div>
                </div>
            </div>

            <div class="mt-10 flex justify-center">
                <button type="submit" class="bg-primary-link text-white font-black py-4 px-16 rounded-2xl shadow-2xl hover:bg-slate-800 transform transition-all hover:scale-105 active:scale-95 flex items-center gap-3 text-lg">
                    <i data-lucide="save" class="w-6 h-6"></i> GUARDAR ALBARÁN
                </button>
            </div>
            <div id="statusMessage" class="hidden mt-6 p-4 rounded-lg text-center font-bold"></div>
        </form>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
