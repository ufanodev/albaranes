<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Nuevo Albarán - Panel Titular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/security.js"></script>
    <script src="/js/albaran_nuevo.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'primary-pastel': '#FFDAB9', 'primary-link': '#FF8C00' } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .input-field { @apply w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl shadow-inner outline-none transition-all duration-200 text-gray-800 text-sm; }
        .input-field:focus { @apply bg-white border-primary-link ring-4 ring-orange-100 shadow-none; }
        .label-style { @apply block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1 tracking-tighter; }
        .checkbox-inline { @apply flex items-center space-x-2 bg-slate-100 px-3 py-2 rounded-lg shadow-inner border border-slate-200 hover:bg-white transition cursor-pointer h-full; }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="max-w-7xl mx-auto bg-white shadow-2xl rounded-[2rem] overflow-hidden border border-slate-100">
        
        <div class="bg-gradient-to-r from-primary-pastel to-orange-100 p-6 flex justify-between items-center border-b border-orange-200">
            <h1 class="text-2xl font-black text-slate-800 flex items-center">
                <i data-lucide="file-plus-2" class="mr-3 text-primary-link"></i> REGISTRO DE ALBARÁN
            </h1>
            <button onclick="window.location.href='/titulares'" class="bg-slate-800 text-white px-5 py-2 rounded-xl font-bold hover:bg-black transition flex items-center shadow-lg text-sm">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> VOLVER
            </button>
        </div>

        <form id="albaranForm" class="p-6 md:p-10 space-y-6" onsubmit="handleAction('crear', event)">
            
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <div>
                    <label class="label-style">Licencia Ref</label>
                    <input type="text" id="licencia" name="licencia_ref" readonly class="input-field bg-slate-200 cursor-not-allowed font-bold">
                </div>
                <div>
                    <label class="label-style">Nº Albarán *</label>
                    <input type="text" name="numero_albaran" id="n_albaran" required class="input-field font-black text-primary-link uppercase">
                </div>
                <div>
                    <label class="label-style">Fecha *</label>
                    <input type="date" name="fecha" id="fecha" required class="input-field">
                </div>
                <div>
                    <label class="label-style">Hora Inicio</label>
                    <input type="time" name="hora_ini" class="input-field">
                </div>
                <div>
                    <label class="label-style">Hora Fin</label>
                    <input type="time" name="hora_fin" class="input-field">
                </div>
            </div>

            <div class="bg-orange-50 border-l-4 border-orange-400 p-2 ml-1 rounded-r-lg">
                <p class="text-[10px] font-bold text-orange-700 uppercase flex items-center">
                    <i data-lucide="info" class="w-3 h-3 mr-2"></i> Resto de datos detallarlos en el campo Observaciones al final del formulario
                </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                <div class="md:col-span-3">
                    <label class="label-style">Empresa Ref *</label>
                    <select id="empresa" name="empresa_ref" required class="input-field font-semibold"></select>
                </div>
                <div class="md:col-span-2">
                    <label class="label-style">Matrícula</label>
                    <input type="text" name="matricula" maxlength="12" class="input-field font-bold uppercase" placeholder="12 caracteres">
                </div>
                <div class="md:col-span-3">
                    <label class="label-style">Pasajero / Teléfono</label>
                    <input type="text" name="nombre_pasajero" class="input-field" placeholder="Nombre o contacto">
                </div>
                <div class="md:col-span-2">
                    <label class="label-style">DNI Pasajero</label>
                    <input type="text" name="dni_pasajero" class="input-field uppercase" placeholder="DNI/NIE">
                </div>
                <div class="md:col-span-2">
                    <label class="label-style">Referencia</label>
                    <input type="text" name="referencia" class="input-field" placeholder="Expediente">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-6 gap-4">
                <div class="md:col-span-6 flex gap-2">
                    <label class="checkbox-inline flex-1"><input type="checkbox" name="urbano" class="w-4 h-4 text-orange-500"> <span class="text-[9px] font-bold uppercase">Urbano</span></label>
                    <label class="checkbox-inline flex-1"><input type="checkbox" name="diurno" class="w-4 h-4 text-orange-500"> <span class="text-[9px] font-bold uppercase">Diurno</span></label>
                    <label class="checkbox-inline flex-1"><input type="checkbox" name="noct_fest" class="w-4 h-4 text-orange-500"> <span class="text-[9px] font-bold uppercase">Noche/Fest.</span></label>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <div>
                    <label class="label-style">Origen *</label>
                    <input type="text" name="origen" required class="input-field">
                </div>
                <div>
                    <label class="label-style">Destino *</label>
                    <input type="text" name="destino" required class="input-field">
                </div>
                <div>
                    <label class="label-style">Parada</label>
                    <input type="text" name="parada" class="input-field">
                </div>
                <div>
                    <label class="label-style">Espera Inicio</label>
                    <input type="time" name="espera_ini" class="input-field">
                </div>
                <div>
                    <label class="label-style">Espera Fin</label>
                    <input type="time" name="espera_fin" class="input-field">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-3 bg-slate-100 p-4 rounded-2xl border border-slate-200 items-end">
                <div class="md:col-span-2">
                    <label class="label-style text-slate-500">Kms Inicio</label>
                    <input type="number" step="0.01" name="km_ini" class="input-field font-bold" placeholder="0.00">
                </div>
                <div class="md:col-span-2">
                    <label class="label-style text-slate-500">Kms Fin</label>
                    <input type="number" name="km_fin" class="input-field font-bold" placeholder="0">
                </div>
                <div class="md:col-span-2">
                    <label class="label-style text-slate-500">Kms Nac.</label>
                    <input type="number" step="0.01" name="km_nacionales" class="input-field" placeholder="0.00">
                </div>
                <div class="md:col-span-2">
                    <label class="label-style text-slate-500">Kms Int.</label>
                    <input type="number" step="0.01" name="km_internacionales" class="input-field" placeholder="0.00">
                </div>
                <div class="md:col-span-2">
                    <label class="label-style text-primary-link font-black">Kms Totales</label>
                    <input type="number" step="0.01" name="km_totales" class="input-field bg-white border-primary-link font-black text-right" placeholder="0.00">
                </div>
                <div class="md:col-span-2 flex gap-2 border-l border-slate-300 pl-4 h-full items-end">
                    <div class="flex-1 h-full">
                        <label class="checkbox-inline w-full border-orange-200">
                            <input type="checkbox" name="remolque" class="w-4 h-4 text-orange-600"> 
                            <span class="text-[9px] font-black uppercase">Remolque</span>
                        </label>
                    </div>
                    <div class="w-16">
                        <label class="label-style">Plazas</label>
                        <select name="num_plazas" class="input-field font-bold text-center py-2">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4" selected>4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                <div class="md:col-span-3">
                    <label class="label-style">Conductor / Asalariado</label>
                    <select id="asalariado_select" name="asalariado" class="input-field font-semibold"></select>
                </div>
                <div class="md:col-span-3">
                    <label class="label-style">Autorizado Por</label>
                    <input type="text" name="autorizado_por" class="input-field" placeholder="Nombre responsable">
                </div>
                <div class="md:col-span-2">
                    <label class="label-style text-orange-600">Suplidos (€)</label>
                    <input type="number" step="0.01" name="importe_suplidos" class="input-field border-orange-200 bg-orange-50 font-bold" value="0.00">
                </div>
                <div class="md:col-span-1 pt-4">
                    <label class="checkbox-inline w-full border-blue-200 bg-blue-50">
                        <input type="checkbox" name="adjuntos" class="w-4 h-4 text-blue-600"> 
                        <span class="text-[9px] font-black uppercase text-blue-700">Adj.</span>
                    </label>
                </div>
                <div class="md:col-span-3 bg-slate-900 p-3 rounded-2xl border-4 border-primary-pastel shadow-xl">
                    <label class="block text-[9px] font-black text-primary-pastel uppercase mb-1 text-center tracking-tighter">Importe Total Albarán *</label>
                    <div class="flex items-center justify-center">
                        <span class="text-xl font-black text-white mr-2">€</span>
                        <input type="number" step="0.01" name="importe_total" id="importe_total" required class="bg-transparent border-none w-full text-right font-black text-3xl text-primary-link outline-none focus:ring-0" placeholder="0.00">
                    </div>
                </div>
            </div>

            <div class="w-full">
                <label class="label-style tracking-widest text-slate-500 mb-2 block uppercase">Observaciones del Servicio</label>
                <textarea 
                    name="observaciones" 
                    id="observaciones"
                    rows="4" 
                    class="input-field italic w-full resize-none p-4" 
                    placeholder="Escriba aquí cualquier detalle relevante sobre el trayecto, equipaje especial, incidencias con el tráfico, etc..."></textarea>
                <div class="flex justify-end mt-1">
                    <span id="wordCount" class="text-[9px] font-black text-slate-400 uppercase tracking-widest bg-slate-50 px-2 py-0.5 rounded border">0 palabras registradas</span>
                </div>
            </div>

            <div class="flex flex-col items-center pt-6">
                <button type="submit" class="bg-primary-link text-white font-black py-4 px-20 rounded-2xl shadow-2xl hover:bg-slate-800 transform transition-all hover:scale-105 active:scale-95 flex items-center gap-3 text-lg uppercase tracking-widest">
                    <i data-lucide="save" class="w-6 h-6"></i> Guardar Albarán
                </button>
                <div id="statusMessage" class="hidden mt-6 p-4 rounded-xl text-center font-bold w-full max-w-md border-2"></div>
            </div>
        </form>
    </div>
    
    <script>lucide.createIcons();</script>
</body>
</html>
