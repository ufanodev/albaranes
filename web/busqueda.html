<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚕 Búsqueda de Albaranes de Servicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configuración para usar colores personalizados (Naranja Pastel)
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pastel': '#FFDAB9', // Naranja Pastel
                        'primary-link': '#FF8C00',  // Naranja más vivo para botones/links
                        'black-pure': '#000000',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Clases base */
        .card { @apply bg-white p-6 rounded-xl shadow-lg border border-primary-pastel/50; }
        .input-field { @apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-link focus:border-primary-link transition duration-150; }
        
        /* Estilos del mensaje de estado (usados por JS) */
        .status-message { 
            @apply mt-4 p-3 rounded-md font-medium text-center; 
        }
        .status-success { 
            @apply bg-green-100 text-green-700 border border-green-400; 
        }
        .status-error { 
            /* Rojo pastel */
            @apply bg-red-400 text-white border border-red-600; 
        }
        .status-info, .status-neutral { 
            @apply bg-gray-200 text-gray-700 border border-gray-400; 
        }

        /* Estilos específicos para la tabla y el pie */
        .total-row td {
            @apply bg-primary-pastel/70 font-extrabold text-gray-800 text-lg;
        }
        /* Estilo para los encabezados de tabla clickables */
        .sortable {
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
        }
        .sort-icon {
            margin-left: 0.5rem;
            width: 1rem;
            height: 1rem;
            display: inline-block;
        }
    </style>
</head>

    </div>

                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
                    </button>
                    <button title="Exportar a Word" class="bg-indigo-500 text-white hover:bg-indigo-600 font-semibold p-2 rounded-full shadow-md transition duration-200 active:scale-95" onclick="handleAction('Exportar Word', 'Todo el listado')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>

                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M11 15h6"/><path d="M14 12v6"/><path d="M8 12h2"/><path d="M8 15h2"/><path d="M8 18h2"/></svg>
                    </button>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-3">

            <form id="searchForm" onsubmit="handleSearch(event)">

                    </div>
                    <div>
                        <label for="empresa" class="block text-xs font-medium text-gray-700 mb-1">Empresa</label>
                        <select id="empresa" name="empresa" class="input-field appearance-none">

                            <option value="race">RACE</option>
                            <option value="mapfre">Mapfre</option>
                            <option value="mutua">Mutua Madrileña</option>
                        </select>
                    </div>
                    <div>
                        <label for="state" class="block text-xs font-medium text-gray-700 mb-1">Estado</label>
                        <select id="state" name="state" class="input-field appearance-none">
                            <option value="">Por favor Seleccione</option>
                            <option value="creado">Creado</option>
                            <option value="enviado">Enviado</option>
                            <option value="pagado">Pagado</option>
                            <option value="finalizado">Finalizado</option>
                        </select>
                    </div>
                    <div>
                        <label for="referencia" class="block text-xs font-medium text-gray-700 mb-1">Referencia</label>
                        <input type="text" id="referencia" name="referencia" placeholder="Si la tiene" class="input-field">
                    </div>
                    <div class="lg:col-span-2">
                        <label for="fecha_desde" class="block text-xs font-medium text-gray-700 mb-1">Fecha (Desde)</label>
                        <input type="date" id="fecha_desde" name="fecha_desde" class="input-field">
                    </div>
                    <div class="lg:col-span-2">
                        <label for="fecha_hasta" class="block text-xs font-medium text-gray-700 mb-1">Fecha (Hasta)</label>
                        <input type="date" id="fecha_hasta" name="fecha_hasta" class="input-field">
                    </div>
                </div>
                <div class="mt-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="flex flex-wrap gap-x-6 text-sm text-gray-700">
                        <label class="inline-flex items-center">
                            <input type="radio" name="search_type" value="exacta" class="form-radio text-primary-link h-4 w-4 border-gray-300 focus:ring-primary-link" checked>
                            <span class="ml-2">Frase Exacta</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="search_type" value="todas" class="form-radio text-primary-link h-4 w-4 border-gray-300 focus:ring-primary-link">
                            <span class="ml-2">Todas las palabras</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="search_type" value="cualquier" class="form-radio text-primary-link h-4 w-4 border-gray-300 focus:ring-primary-link">
                            <span class="ml-2">Cualquier palabra</span>
                        </label>
                    </div>
                    <div class="flex flex-wrap gap-3">
                        <button type="button" onclick="document.getElementById('searchForm').reset();" 
                            class="group relative inline-flex items-center justify-center px-5 py-2.5 font-semibold text-blue-600 transition-all duration-300 ease-in-out bg-white border-2 border-blue-500 rounded-lg shadow-md hover:bg-blue-50 hover:border-blue-600 hover:shadow-lg hover:shadow-blue-500/20 active:scale-95 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 transition-transform group-hover:rotate-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"/>
                                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                                <line x1="10" y1="11" x2="10" y2="17"/>
                                <line x1="14" y1="11" x2="14" y2="17"/>
                            </svg>
                            <span class="relative">Limpiar</span>
                        </button>
                        
                        <button type="submit" 
                            class="group relative inline-flex items-center justify-center px-5 py-2.5 font-semibold text-white transition-all duration-300 ease-in-out bg-gradient-to-r from-blue-500 to-blue-600 rounded-lg shadow-lg hover:shadow-xl hover:shadow-blue-500/50 hover:from-blue-600 hover:to-blue-700 active:scale-95 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 transition-transform group-hover:scale-110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

                        </button>
                    </div>
                </div>
            </form>
        </div>

        <h2 class="text-xl font-bold text-black-pure mb-4">📊 Últimos Albaranes</h2>

        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center space-x-2 text-sm text-gray-600">
                <span>Registros por página:</span>
                <select id="recordsPerPage" class="input-field w-auto px-2 py-1">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
            <div class="flex items-center space-x-2">
                <button class="bg-gray-200 text-gray-700 hover:bg-gray-300 p-2 rounded-lg transition duration-200 active:scale-95" title="Anterior">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <span class="text-sm text-gray-600 font-medium">Página 1 de 5 (Simulado)</span>
                <button class="bg-gray-200 text-gray-700 hover:bg-gray-300 p-2 rounded-lg transition duration-200 active:scale-95" title="Siguiente">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>

        <div class="overflow-x-auto shadow-lg rounded-xl border border-gray-100">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-primary-link text-white">
                    <tr>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider rounded-tl-xl">
                            <div class="sortable" onclick="sortTable('id')">Nº Albarán<span class="sort-icon" id="sort-id"></span></div>
                        </th>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider">
                            <div class="sortable" onclick="sortTable('date')">Fecha<span class="sort-icon" id="sort-date"></span></div>
                        </th>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider">Socio/Conductor</th>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider">Empresa</th>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider">
                            <div class="sortable" onclick="sortTable('ref')">Referencia<span class="sort-icon" id="sort-ref"></span></div>
                        </th>
                        <th scope="col" class="px-4 py-3 text-right text-xs font-bold uppercase tracking-wider">Importe</th>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider">
                             <div class="sortable" onclick="sortTable('state')">Estado<span class="sort-icon" id="sort-state"></span></div>
                        </th>
						<th scope="col" class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider">Observaciones</th>
                        <th scope="col" class="px-4 py-3 text-center text-xs font-bold uppercase tracking-wider rounded-tr-xl">Acciones</th>
                    </tr>
                </thead>
                <tbody id="albaranResults" class="bg-white divide-y divide-gray-200">
                    </tbody>
                <tfoot id="albaranTotal">
                    </tfoot>
            </table>
        </div>
        <div id="statusMessage" class="hidden status-message" role="alert"></div>
    </div>
    
    <script>
        // Mocks de datos ACTUALIZADOS con 'state' y 'obs'
        let mockAlbaranes = [
            { id: '2023-0001', date: '2023-11-15', driver: '001A', company: 'Mapfre', ref: 'R45678', amount: 45.00, state: 'pagado', obs: 'Cobrado por transferencia' },
            { id: '2023-0002', date: '2023-11-16', driver: '002', company: 'RACE', ref: 'E90123', amount: 80.50, state: 'enviado', obs: 'Pendiente de pago' },
            { id: '2023-0003', date: '2023-11-17', driver: '003B', company: 'Mutua Madrileña', ref: 'M54321', amount: 120.90, state: 'finalizado', obs: 'Servicio completado' },
            { id: '2023-0004', date: '2023-11-18', driver: '004', company: 'Mapfre', ref: 'R99887', amount: 55.00, state: 'creado', obs: 'Borrador inicial' },
            { id: '2023-0005', date: '2023-11-19', driver: '005C', company: 'RACE', ref: 'E11223', amount: 99.95, state: 'pagado', obs: 'Cobrado en efectivo' },
            { id: '2023-0006', date: '2023-11-14', driver: '006D', company: 'Mutua Madrileña', ref: 'A00001', amount: 15.00, state: 'creado', obs: 'Borrador' },
            { id: '2023-0007', date: '2023-11-20', driver: '007', company: 'Mapfre', ref: 'Z99999', amount: 115.00, state: 'enviado', obs: 'Pendiente de pago' },
        ];
        
        // Objeto para mantener el estado de la ordenación
        let sortState = {
            column: 'id',
            direction: 'asc' // 'asc' o 'desc'
        };

        /**
         * Muestra/oculta el modal de mensajes
         * @param {boolean} show Si es true, muestra. Si es false, oculta.
         * @param {string} title Título del modal.
         * @param {string} body Contenido del modal.
         */
        function showModal(show, title = '', body = '') {
            const modal = document.getElementById('actionModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').textContent = body;
            modal.classList.toggle('hidden', !show);
            if (show) {
                // Pequeña animación para mostrar
                setTimeout(() => {
                    modal.querySelector('div').classList.remove('scale-90');
                }, 10);
            } else {
                // Animación para ocultar
                modal.querySelector('div').classList.add('scale-90');
            }
        }

        /**
         * Simula una acción y muestra el resultado en un modal.
         */
        function handleAction(action, itemId) {
            let title = `${action} de Albarán`;
            let message = `Se ha solicitado la acción "${action}" para el albarán/listado: ${itemId}.`;

            if (action === 'Eliminar') {
                 title = 'Confirmación de Eliminación';
                 message = `ATENCIÓN: Se ha simulado la eliminación del albarán ${itemId}. En un entorno real, se requeriría una confirmación adicional.`;
            } else if (action.includes('Exportar') || action.includes('Imprimir')) {
                 title = 'Exportación Simulada';
                 message = `El documento para "${itemId}" ha sido generado para ${action}.`;
            }
            
            showModal(true, title, message);
        }
        
        /**
         * Devuelve la representación HTML del estado del albarán.
         */
        function getStateHtml(state) {
            switch (state) {
                case 'pagado':
                    return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Pagado</span>`;
                case 'enviado':
                    return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">Enviado</span>`;
                case 'finalizado':
                    return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-primary-link/20 text-primary-link">Finalizado</span>`;
                case 'creado':
                default:
                    return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-200 text-gray-700">Creado</span>`;
            }
        }

        /**
         * Función principal de ordenación.
         * @param {string} column La clave de la columna por la que ordenar ('id', 'date', 'ref', 'state').
         */
        function sortTable(column) {
            // Determinar la dirección de la ordenación
            if (sortState.column === column) {
                sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortState.column = column;
                sortState.direction = 'asc';
            }

            // Lógica de ordenación
            const sortedData = [...mockAlbaranes].sort((a, b) => {
                let comparison = 0;
                let aValue = a[column];
                let bValue = b[column];

                if (column === 'id' || column === 'ref' || column === 'state') {
                    // Ordenación alfabética/string
                    if (aValue < bValue) {
                        comparison = -1;
                    } else if (aValue > bValue) {
                        comparison = 1;
                    }
                } else if (column === 'date') {
                    // Ordenación por fecha (comparando strings de fecha ISO)
                    if (aValue < bValue) {
                        comparison = -1;
                    } else if (aValue > bValue) {
                        comparison = 1;
                    }
                }

                // Aplicar la dirección
                return sortState.direction === 'asc' ? comparison : comparison * -1;
            });

            // Actualizar los datos originales (simulados) con los ordenados
            mockAlbaranes = sortedData;
            
            // Re-renderizar la tabla con los datos ordenados
            renderAlbaranes(mockAlbaranes);
        }

        /**
         * Renderiza los iconos de ordenación en la tabla.
         */
        function renderSortIcons() {
            // Limpiar todos los iconos
            document.querySelectorAll('.sort-icon').forEach(icon => {
                icon.innerHTML = '';
            });

            // Añadir el icono a la columna activa
            const activeIconElement = document.getElementById(`sort-${sortState.column}`);
            if (activeIconElement) {
                if (sortState.direction === 'asc') {
                    // Flecha hacia arriba
                    activeIconElement.innerHTML = `<svg data-lucide="chevron-up" class="h-4 w-4"></svg>`;
                } else {
                    // Flecha hacia abajo
                    activeIconElement.innerHTML = `<svg data-lucide="chevron-down" class="h-4 w-4"></svg>`;
                }
                 // Ejecutar Lucide para convertir el tag <i> en icono SVG
                lucide.createIcons();
            }
        }

        /**
         * Renderiza la tabla de albaranes y el total.
         */
        function renderAlbaranes(data = mockAlbaranes) {
            const resultsBody = document.getElementById('albaranResults');
            const totalFooter = document.getElementById('albaranTotal');
            resultsBody.innerHTML = '';
            
            let totalImporte = 0;

            if (data.length === 0) {
                resultsBody.innerHTML = `<tr><td colspan="9" class="text-center py-6 text-gray-500 italic">No se encontraron resultados que coincidan con los filtros.</td></tr>`;
                totalFooter.innerHTML = '';
            } else {
                data.forEach(albaran => {
                    totalImporte += albaran.amount;

                    const row = `
                        <tr>
                            <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-900">${albaran.id}</td>
                            <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">${albaran.date}</td>
                            <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-700">${albaran.driver}</td>
                            <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">${albaran.company}</td>
                            <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">${albaran.ref}</td>
                            <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900 font-semibold text-right">€${albaran.amount.toFixed(2)}</td>
                            <td class="px-4 py-3 whitespace-nowrap text-sm">${getStateHtml(albaran.state)}</td>
                            <td class="px-4 py-3 text-sm text-gray-600 max-w-xs overflow-hidden text-ellipsis">${albaran.obs || ''}</td>
                            <td class="px-4 py-3 whitespace-nowrap text-center text-sm font-medium">
                                <div class="flex justify-center space-x-2">
                                    <button onclick="handleAction('Ver', '${albaran.id}')" title="Ver detalle" class="text-blue-500 hover:text-blue-700 p-1 rounded-full hover:bg-blue-100 transition active:scale-90">
                                        <i data-lucide="eye" class="h-5 w-5"></i>
                                    </button>
                                    <button onclick="handleAction('Editar', '${albaran.id}')" title="Editar albarán" class="text-primary-link hover:text-orange-700 p-1 rounded-full hover:bg-orange-100 transition active:scale-90">
                                        <i data-lucide="pencil" class="h-5 w-5"></i>
                                    </button>
                                    <button onclick="handleAction('Copiar', '${albaran.id}')" title="Duplicar albarán" class="text-purple-500 hover:text-purple-700 p-1 rounded-full hover:bg-purple-100 transition active:scale-90">
                                        <i data-lucide="copy" class="h-5 w-5"></i>
                                    </button>
                                    <button onclick="handleAction('Eliminar', '${albaran.id}')" title="Eliminar albarán" class="text-red-500 hover:text-red-700 p-1 rounded-full hover:bg-red-100 transition active:scale-90">
                                        <i data-lucide="trash-2" class="h-5 w-5"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                    resultsBody.insertAdjacentHTML('beforeend', row);
                });
            }

            // Renderizar el pie de tabla con el total
            totalFooter.innerHTML = `
                <tr class="total-row">
                    <td colspan="5" class="px-4 py-3 text-right">TOTAL</td>
                    <td class="px-4 py-3 text-right">€${totalImporte.toFixed(2)}</td>
                    <td colspan="3" class="px-4 py-3"></td>
                </tr>
            `;

            // Ejecutar Lucide para convertir los tags <i> en iconos SVG
            lucide.createIcons();

            // Renderizar el icono de ordenación
            renderSortIcons();
        }

        /**
         * Maneja el envío del formulario de búsqueda (simulado).
         */
        function handleSearch(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const searchParams = Object.fromEntries(formData.entries());

            const statusMessage = document.getElementById('statusMessage');
            
            console.log("Parámetros de búsqueda:", searchParams);

            // Simulación de filtro: Filtramos una copia de los datos
            const filteredResults = mockAlbaranes.filter(albaran => {
                const matchCompany = !searchParams.empresa || albaran.company.toLowerCase() === searchParams.empresa;
                const matchState = !searchParams.state || albaran.state.toLowerCase() === searchParams.state;
                const matchLicencia = !searchParams.licencia || albaran.driver.toLowerCase().includes(searchParams.licencia.toLowerCase());
                const matchReferencia = !searchParams.referencia || albaran.ref.toLowerCase().includes(searchParams.referencia.toLowerCase());
                
                return matchCompany && matchState && matchLicencia && matchReferencia;
            });
            
            // Reemplazar el mock actual con los resultados filtrados para que la ordenación actúe sobre ellos
            // NOTA: En una aplicación real, se cargaría la data del servidor.
            mockAlbaranes = filteredResults; 

            renderAlbaranes(mockAlbaranes); // Renderizar los resultados filtrados

            // Mostrar un mensaje de éxito simulado
            statusMessage.textContent = `Búsqueda realizada con éxito. Mostrando ${filteredResults.length} resultados.`;
            statusMessage.className = 'status-message status-success';
            statusMessage.classList.remove('hidden');

            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 3000);
        }

        // Inicialización al cargar la página
        window.onload = function() {
            // Aplicar la ordenación inicial (por ID ascendente) y renderizar
            sortTable('id'); 
        };
    </script>
